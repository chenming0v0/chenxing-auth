    get:
      tags: [Admin OAuth Providers]
      summary: 自定义 OAuth 提供商设置页（转发到 React 管理设置）
      operationId: oauthProviderSettingsPage
      description: |
        遗留浏览器入口。GET 保留查询串并 303 到 `/admin/settings`（React 管理设置页），
      responses:
        '303':
          description: 重定向到 React SPA 的 /admin/settings，查询串原样保留
          headers:
            Location:
              schema: { type: string, example: /admin/settings }
