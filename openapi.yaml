        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthProviderUpdateInput' }
      responses:
        '204': { description: 更新成功，省略 Client Secret 时保留原值 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/oauth/providers/{slug}/disable:
    post:
      tags: [Admin OAuth Providers]
      summary: 停用自定义 OAuth 提供商
      operationId: disableOAuthProvider
      security: [{ sessionCookie: [] }, { adminBearer: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204': { description: 停用成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/oauth/providers/{slug}/enable:
    post:
      tags: [Admin OAuth Providers]
      summary: 启用自定义 OAuth 提供商
      operationId: enableOAuthProvider
      security: [{ sessionCookie: [] }, { adminBearer: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204': { description: 启用成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/settings/oauth:
    get:
      tags: [Admin OAuth Providers]
      summary: 自定义 OAuth 提供商设置页（转发到 React 控制台）
      operationId: oauthProviderSettingsPage
      responses:
        '303':
          description: 重定向到 React SPA 的 /console/settings
          headers:
            Location: { schema: { type: string } }
  /api/v1/admin/keys/rotate:
    post:
      tags: [Admin Operations]
      summary: 轮换签名密钥
      operationId: rotateSigningKey
      security: [{ sessionCookie: [] }, { adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '200':
          description: 轮换结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_id: { type: string }
                  published_key_count: { type: integer }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    adminBearer: { type: http, scheme: bearer }
    basicClientAuth: { type: http, scheme: basic }
    sessionCookie: { type: apiKey, in: cookie, name: chenxing_session }
    chenxingSession: { type: apiKey, in: header, name: X-Chenxing-Session, description: 仅开发兼容配置 OAUTH_SESSION_HEADER_ENABLED=true 时可用；不能替代 pending、Session 绑定、CSRF 或 consent }
  parameters:
    ClientId: { name: client_id, in: query, required: true, schema: { type: string } }
    SessionResponseMode: { name: X-Chenxing-Session-Mode, in: header, required: false, description: 非浏览器兼容模式。仅在 SESSION_TOKEN_RESPONSE_ENABLED=true 且值为 token 时将 session_id 放入 JSON；浏览器不得发送此请求头。, schema: { type: string, enum: [token] } }
    CsrfHeader: { name: X-CSRF-Token, in: header, required: true, description: 浏览器 Session 写操作必需；ADMIN_TOKEN Bearer 请求不需要, schema: { type: string } }
    Page: { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Search: { name: search, in: query, required: false, schema: { type: string, maxLength: 128 } }
    StatusFilter: { name: status, in: query, required: false, schema: { type: string, enum: [active, disabled] } }
  headers:
    SetCookie: { description: Session 和 CSRF Cookie, schema: { type: string } }
  responses:
    BadRequest: { description: 请求错误, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: 未认证或凭据无效, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: 无权限, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: 资源冲突（包括套餐 code 冲突和默认套餐保护）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: 资源不存在, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    TooManyRequests: { description: OAuth 配额已耗尽或 QPS 限流触发, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    OAuthBadRequest: { description: OAuth 请求错误，响应遵守 RFC 6749/7009, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } } } }
    OAuthUnauthorized:
      description: OAuth 客户端或 Bearer 凭据无效
      headers:
        WWW-Authenticate: { description: RFC 6749/6750 challenge, schema: { type: string } }
      content: { application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } } }
    OAuthTooManyRequests: { description: OAuth 限流或容量保护触发, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } } } }
    OAuthServiceUnavailable: { description: OAuth 依赖暂时不可用, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } } } }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    OAuthErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string, description: RFC 6749/6750/7009 error code }
        error_description: { type: string, description: Human-readable non-sensitive description }
    HealthResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        service: { type: string, example: chenxing-auth }
    RegistrationInput:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 10 }
        display_name: { type: string, nullable: true, maxLength: 128 }
    LoginInput:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, description: 用户名或邮箱 }
        password: { type: string, format: password, minLength: 10 }
        totp_code: { type: string, pattern: '^[0-9]{6}$' }
    PendingLoginResponse:
      type: object
      required: [status, login_ticket, methods]
      properties:
        status: { type: string, enum: [factor_setup_required, factor_required] }
        login_ticket: { type: string }
        methods: { type: array, items: { type: string, enum: [totp, passkey] } }
    LoginTicketInput:
      type: object
      required: [login_ticket]
      properties:
        login_ticket: { type: string }
    TotpSetupResponse:
      type: object
      required: [secret_base32, otpauth_url]
      properties:
        secret_base32: { type: string }
        otpauth_url: { type: string, format: uri }
    TotpConfirmInput:
      allOf:
        - $ref: '#/components/schemas/LoginTicketInput'
        - type: object
          required: [code]
          properties:
            code: { type: string, pattern: '^[0-9]{6}$' }
    WebAuthnOptions:
      type: object
      description: WebAuthn options returned by webauthn-rs; pass through to navigator.credentials.
      additionalProperties: true
    PasskeyRegistrationInput:
      allOf:
        - $ref: '#/components/schemas/LoginTicketInput'
        - type: object
          required: [credential]
          properties:
            credential: { type: object, additionalProperties: true }
    PasskeyAuthenticationInput:
      allOf:
        - $ref: '#/components/schemas/LoginTicketInput'
        - type: object
          required: [credential]
          properties:
            credential: { type: object, additionalProperties: true }
    PublicUser:
      type: object
      required: [id, username, email, status, role, created_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        username: { type: string, minLength: 3, maxLength: 64 }
        email: { type: string, format: email }
        display_name: { type: string, nullable: true }
        status: { type: string }
        role: { type: string, enum: [user, admin, owner] }
        created_at: { type: string, format: date-time }
    AdminUserPlan:
      type: object
      required: [id, code, name, expires_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        code: { type: string }
        name: { type: string }
        expires_at: { type: string, format: date-time, nullable: true, description: null 表示永久有效 }
    AdminUserQueryItem:
      allOf:
        - $ref: '#/components/schemas/PublicUser'
        - type: object
          required: [plan]
          properties:
            plan: { $ref: '#/components/schemas/AdminUserPlan' }
    LoginResponse:
      type: object
      required: [expires_at]
      description: 浏览器安全的登录响应。Session token 默认不出现在 JSON 中，客户端应使用 HttpOnly Cookie 并通过 auth/status 和 auth/me 确认登录状态。
      properties:
        session_id: { type: string, description: '仅在 SESSION_TOKEN_RESPONSE_ENABLED=true 且请求显式发送 X-Chenxing-Session-Mode: token 时返回；浏览器响应默认不包含此字段' }
        expires_at: { type: string, format: date-time }
    AuthStatusResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
    PublicExternalProvider:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    UserMeResponse:
      type: object
      required: [id, username, email, status, role, current_session_expires_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        username: { type: string, minLength: 3, maxLength: 64 }
        email: { type: string, format: email }
        display_name: { type: string, nullable: true }
        status: { type: string }
        role: { type: string, enum: [user, admin, owner] }
        current_session_expires_at: { type: string, format: date-time }
    UpdateProfileInput:
      type: object
      properties:
        display_name: { type: string, nullable: true, maxLength: 128 }
    ChangePasswordInput:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 10 }
    SessionItem:
      type: object
      required: [id, created_at, expires_at, current]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }
    SessionListResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SessionItem' } }
    AuthorizedOAuthApp:
      type: object
      required: [client_id, client_name, scopes, updated_at]
      properties:
        client_id: { type: string }
        client_name: { type: string, description: OAuth 应用显示名称 }
        scopes: { type: array, items: { type: string } }
        updated_at: { type: string, format: date-time }
    AuthorizedOAuthAppList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuthorizedOAuthApp' } }
    QuotaSnapshot:
      type: object
      required: [daily_limit, daily_used, monthly_limit, monthly_used]
      properties:
        daily_limit: { type: integer, format: int64, minimum: 0, description: 当前 owner effective plan 的每日授权上限 }
        daily_used: { type: integer, format: int64 }
        monthly_limit: { type: integer, format: int64, minimum: 0, nullable: true, description: 当前 owner effective plan 的每月授权上限；null 表示无限 }
        monthly_used: { type: integer, format: int64 }
    OwnedOAuthClient:
      type: object
      required: [id, client_id, client_name, redirect_uris, scopes, status, quota]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        client_id: { type: string }
        client_name: { type: string }
        redirect_uris: { type: array, items: { type: string, format: uri } }
        scopes: { type: array, items: { type: string } }
        status: { type: string, enum: [active, disabled] }
        quota: { $ref: '#/components/schemas/QuotaSnapshot' }
    OwnedOAuthClientList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OwnedOAuthClient' } }
    RegisteredOwnedOAuthClient:
      allOf:
        - $ref: '#/components/schemas/OwnedOAuthClient'
        - type: object
          required: [client_secret]
          properties:
            client_secret: { type: string, format: password }
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token] }
        code: { type: string }
        redirect_uri: { type: string, format: uri }
        code_verifier: { type: string }
        refresh_token: { type: string }
        scope: { type: string }
        client_id: { type: string }
        client_secret: { type: string, format: password }
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, format: int64 }
        scope: { type: string }
        refresh_token: { type: string }
        id_token: { type: string }
    UserInfo:
      type: object
      required: [sub]
      properties:
        sub: { type: string }
        email: { type: string, format: email }
        name: { type: string }
    PendingAuthorizationResponse:
      type: object
      required: [request_id, client_id, client_name, redirect_host, scopes, expires_in]
      properties:
        request_id: { type: string }
        client_id: { type: string }
        client_name: { type: string }
        redirect_host: { type: string }
        scopes: { type: array, items: { type: string } }
        expires_in: { type: integer, format: int64, example: 600 }
    AuthorizationDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, deny] }
    AuthorizationDecisionResponse:
      type: object
      required: [decision, redirect_to]
      properties:
        decision: { type: string, enum: [approve, deny] }
        redirect_to: { type: string, format: uri }
    AdminMeResponse:
      type: object
      required: [role, permissions, status]
      properties:
        user_id: { type: integer, format: int64, minimum: 1, nullable: true }
        username: { type: string, nullable: true }
        role: { type: string, enum: [owner, admin] }
        permissions: { type: array, items: { type: string } }
        status: { type: string }
    AdminOverview:
      type: object
      required: [users, oauth_clients, administrators, audit_events]
      properties:
        users: { type: integer, format: int64 }
        oauth_clients: { type: integer, format: int64 }
        administrators: { type: integer, format: int64 }
        audit_events: { type: integer, format: int64 }
    RegistrationEmailSettingResponse:
      type: object
      required: [registration_email_from]
      properties:
        registration_email_from: { type: string, format: email, nullable: true }
    UpdateRegistrationEmailSettingInput:
      type: object
      required: [registration_email_from]
      properties:
        registration_email_from: { type: string, format: email, nullable: true }
    PagedUsers:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminUserQueryItem' } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    PagedClients:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ClientSummary' } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    PagedAudit:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { type: object } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    AdminInput:
      type: object
      required: [username, email, password, role]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 10 }
        role: { type: string, enum: [admin, owner] }
    BootstrapOwnerInput:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 10 }
    BootstrapOwnerResponse:
      type: object
      required: [id, username, email, role]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        username: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [owner] }
    BootstrapStatusResponse:
      type: object
      required: [initialized]
      properties:
        initialized: { type: boolean }
    PasskeySetting:
      type: object
      required: [enabled, rp_name, rp_id, user_verification, authenticator_attachment, allow_insecure_origin, allowed_origins]
      properties:
        enabled: { type: boolean }
        rp_name: { type: string, maxLength: 128 }
        rp_id: { type: string, maxLength: 253 }
        user_verification: { type: string, enum: [preferred, required, discouraged] }
        authenticator_attachment: { type: string, enum: [any, platform, cross_platform] }
        allow_insecure_origin: { type: boolean }
        allowed_origins:
          type: array
          maxItems: 32
          items: { type: string, format: uri }
    EmailPolicySetting:
      type: object
      required: [whitelist_enabled, alias_restriction_enabled, allowed_domains]
      properties:
        whitelist_enabled: { type: boolean }
        alias_restriction_enabled: { type: boolean }
        allowed_domains:
          type: array
          maxItems: 128
          items: { type: string, maxLength: 253 }
    SmtpSetting:
      type: object
      required: [host, port, username, from_address, ssl_enabled, force_auth_login, password_configured]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        from_address: { type: string }
        ssl_enabled: { type: boolean }
        force_auth_login: { type: boolean }
        password_configured: { type: boolean }
    SmtpSettingUpdate:
      type: object
      required: [host, port, username, from_address, ssl_enabled, force_auth_login]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        from_address: { type: string }
        ssl_enabled: { type: boolean }
        force_auth_login: { type: boolean }
        password: { type: string, format: password, nullable: true, writeOnly: true }
    AdminSummary:
      type: object
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        username: { type: string }
        role: { type: string }
        status: { type: string }
    OAuthProviderCreateInput:
      type: object
      required: [name, slug, authorization_endpoint, token_endpoint, userinfo_endpoint, client_id, client_secret, scopes]
      properties:
        name: { type: string, maxLength: 128 }
        slug: { type: string, pattern: '^[a-z0-9_-]+$', maxLength: 64 }
        authorization_endpoint:
          type: string
          format: uri
          description: HTTPS endpoint, or HTTP only for localhost or an IP loopback test address.
        token_endpoint:
          type: string
          format: uri
          description: HTTPS endpoint, or HTTP only for localhost or an IP loopback test address.
        userinfo_endpoint:
          type: string
          format: uri
          description: HTTPS endpoint, or HTTP only for localhost or an IP loopback test address.
        client_id: { type: string }
        client_secret: { type: string, format: password, writeOnly: true }
        scopes: { type: array, minItems: 1, items: { type: string } }
        subject_claim: { type: string, default: sub }
        email_claim: { type: string, default: email }
        name_claim: { type: string, nullable: true }
        email_verified_claim: { type: string, nullable: true }
        client_auth_method: { type: string, enum: [basic, request_body], default: basic }
    OAuthProviderUpdateInput:
      type: object
      required: [name, slug, authorization_endpoint, token_endpoint, userinfo_endpoint, client_id, scopes]
      description: client_secret 可省略，省略时保留原值
      properties:
        name: { type: string, maxLength: 128 }
        slug: { type: string, pattern: '^[a-z0-9_-]+$', maxLength: 64 }
        authorization_endpoint:
          type: string
          format: uri
          description: HTTPS endpoint, or HTTP only for localhost or an IP loopback test address.
        token_endpoint:
          type: string
          format: uri
          description: HTTPS endpoint, or HTTP only for localhost or an IP loopback test address.
        userinfo_endpoint:
          type: string
          format: uri
          description: HTTPS endpoint, or HTTP only for localhost or an IP loopback test address.
        client_id: { type: string }
        client_secret: { type: string, format: password, writeOnly: true, nullable: true }
        scopes: { type: array, minItems: 1, items: { type: string } }
        subject_claim: { type: string, default: sub }
        email_claim: { type: string, default: email }
        name_claim: { type: string, nullable: true }
        email_verified_claim: { type: string, nullable: true }
        client_auth_method: { type: string, enum: [basic, request_body], default: basic }
    OAuthProviderSummary:
      type: object
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        slug: { type: string }
        callback_uri: { type: string, format: uri }
        authorization_endpoint: { type: string, format: uri }
        token_endpoint: { type: string, format: uri }
        userinfo_endpoint: { type: string, format: uri }
        client_id: { type: string }
        scopes: { type: array, items: { type: string } }
        subject_claim: { type: string }
        email_claim: { type: string }
        name_claim: { type: string, nullable: true }
        email_verified_claim: { type: string, nullable: true }
        client_auth_method: { type: string, enum: [basic, request_body] }
        status: { type: string, enum: [active, disabled] }
        client_secret_configured: { type: boolean }
    ClientInput:
      type: object
      required: [client_name, redirect_uris, scopes]
      properties:
        client_name: { type: string, minLength: 1, maxLength: 128 }
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 10
          description: 重复 URI 按首次出现顺序去重；服务端仍严格校验 HTTPS、无 wildcard、fragment 和 userinfo。
          items: { type: string, format: uri, minLength: 1, maxLength: 2048 }
        scopes:
          type: array
          minItems: 1
          maxItems: 32
          items: { type: string, minLength: 1, maxLength: 64 }
    ClientSummary:
      allOf:
        - $ref: '#/components/schemas/ClientInput'
        - type: object
          properties:
            id: { type: integer, format: int64, minimum: 1 }
            client_id: { type: string }
            status: { type: string }
            owner_user_id: { type: integer, format: int64, minimum: 1, nullable: true }
    RegisteredClient:
      allOf:
        - $ref: '#/components/schemas/ClientSummary'
        - type: object
          properties:
            client_secret: { type: string, format: password }
    ClientSecretResponse:
      type: object
      properties:
        client_id: { type: string }
        client_secret: { type: string, format: password }
    Plan:
      type: object
      description: 套餐定义；monthly_auth_limit / max_qps 为 null 表示无限 / 不限
      required: [id, code, name, oauth_clients_limit, daily_auth_limit, monthly_auth_limit, max_qps, is_default, status, created_at, updated_at, assigned_users]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        code: { type: string, maxLength: 64, description: 小写字母、数字、下划线或连字符，服务端自动归一化 }
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true, maxLength: 512 }
        oauth_clients_limit: { type: integer, format: int32, minimum: 0 }
        daily_auth_limit: { type: integer, format: int64, minimum: 0 }
        monthly_auth_limit: { type: integer, format: int64, nullable: true, minimum: 0 }
        max_qps: { type: integer, format: int32, nullable: true, minimum: 1 }
        is_default: { type: boolean }
        status: { type: string, enum: [active, archived] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        assigned_users: { type: integer, format: int64, minimum: 0, description: 当前已分配用户数（管理端响应包含） }
    PlanInput:
      type: object
      description: 创建 / 更新套餐的输入
      required: [code, name, oauth_clients_limit, daily_auth_limit, is_default]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true, maxLength: 512 }
        oauth_clients_limit: { type: integer, format: int32, minimum: 0 }
        daily_auth_limit: { type: integer, format: int64, minimum: 0 }
        monthly_auth_limit: { type: integer, format: int64, nullable: true, minimum: 0 }
        max_qps: { type: integer, format: int32, nullable: true, minimum: 1 }
        is_default: { type: boolean }
    AssignPlanInput:
      type: object
      required: [plan_id]
      properties:
        plan_id: { type: integer, format: int64, minimum: 1 }
        expires_at: { type: string, format: date-time, nullable: true, description: null 表示永久有效；也接受 time crate 的 tuple 数组形式 }
    EntitlementsResponse:
      type: object
      required: [plan, entitlements]
      properties:
        plan:
          type: object
          required: [code, name, validity]
          properties:
            code: { type: string }
            name: { type: string }
            description: { type: string, nullable: true }
            validity: { type: string, description: permanent 或 RFC3339 到期时间 }
        entitlements:
          type: array
          items:
            type: object
            required: [key, label, used]
            properties:
              key: { type: string }
              label: { type: string }
              used: { type: integer, format: int64, minimum: 0 }
              limit: { type: integer, format: int64, nullable: true, description: 有上限时存在；null 表示无限；缺失表示无上限概念（如 QPS） }
