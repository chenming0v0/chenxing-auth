        `enabled=true` 要求 Issuer 已就绪，否则返回 503 `issuer_not_configured`：
        注册出来的账号必须能走完整认证/授权流程，避免「开关打开但注册全部 503」的分裂状态。
      operationId: updateRegistrationSetting
      security:
        - adminBearer: []
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationSetting' }
      responses:
