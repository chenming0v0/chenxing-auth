        plan_id: { type: integer, format: int64, minimum: 1 }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        price_points: { type: integer, format: int64, minimum: 1 }
        daily_auth_limit: { type: integer, format: int64, minimum: 0 }
        monthly_auth_limit: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [active, archived] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    QuotaAddonInput:
      type: object
      required: [code, name, price_points, daily_auth_limit, monthly_auth_limit]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true, maxLength: 512 }
        price_points: { type: integer, format: int64, minimum: 1 }
        daily_auth_limit: { type: integer, format: int64, minimum: 0, maximum: 1000000 }
        monthly_auth_limit: { type: integer, format: int64, minimum: 0, maximum: 31000000 }
    PurchaseQuotaAddonInput:
      type: object
      required: [addon_id]
      properties:
        addon_id: { type: integer, format: int64, minimum: 1 }
    PurchaseQuotaAddonResponse:
      type: object
      required: [balance, addon_id]
