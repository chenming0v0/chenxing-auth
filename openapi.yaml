                  active_key_id: { type: string }
                  published_key_count: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    adminBearer: { type: http, scheme: bearer, description: 系统 ADMIN_TOKEN 自动化通道，权限等价于 Owner 且无用户 ID，不需要浏览器 CSRF。ADMIN_TOKEN 为空时整个管理面关闭：Bearer 与 sessionCookie 两条通道都被拒绝，已初始化的管理接口统一返回 403 admin_disabled；唯一例外是不存在 Owner 时公开的首个 Owner 初始化接口 }
    basicClientAuth: { type: http, scheme: basic }
    sessionCookie: { type: apiKey, in: cookie, name: __Host-chenxing_session, description: HTTPS 浏览器部署使用的 host-only Session Cookie；仅 loopback HTTP 本地开发使用不带前缀的兼容名称。数据库事务型管理写在精确 Session 行锁取得后，以数据库语句时间复核撤销、代际、绝对过期和该 Session 固化的 idle 窗口；锁等待期间失效返回 401 invalid_session，业务副作用及成功审计回滚。管理接口只有在 ADMIN_TOKEN 非空时才接受此通道；ADMIN_TOKEN 为空时统一返回 403 admin_disabled }
    csrfCookie: { type: apiKey, in: cookie, name: __Host-chenxing_csrf, description: 浏览器 Session 写操作必需的 CSRF Cookie（客户端读取后复制到 X-CSRF-Token）；必须与 sessionCookie 和 csrfHeader 同时提交并绑定。HTTP 本地开发使用不带前缀的兼容名称 }
    csrfHeader: { type: apiKey, in: header, name: X-CSRF-Token, description: 管理写操作的浏览器 Session 分支必须同时提交；ADMIN_TOKEN Bearer 分支不需要 }
    chenxingSession: { type: apiKey, in: header, name: X-Chenxing-Session, description: 仅开发兼容配置 OAUTH_SESSION_HEADER_ENABLED=true 时可用；不能替代 pending、Session 绑定、CSRF 或 consent }
  parameters:
    ClientId: { name: client_id, in: query, required: true, schema: { type: string } }
    SessionResponseMode: { name: X-Chenxing-Session-Mode, in: header, required: false, description: 非浏览器兼容模式。仅在 SESSION_TOKEN_RESPONSE_ENABLED=true 且值为 token 时将 session_id 放入 JSON；浏览器不得发送此请求头。, schema: { type: string, enum: [token] } }
    CsrfHeader: { name: X-CSRF-Token, in: header, required: true, description: 浏览器 Session 写操作必需；ADMIN_TOKEN Bearer 请求不需要。ADMIN_TOKEN 为空时整个管理面关闭，管理请求一律 403 admin_disabled，本请求头不再生效, schema: { type: string } }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Client 创建与 Secret 轮换的可选重试键。调用方应为一次逻辑操作生成同一个 1..128 字节可见 ASCII 值，
        并保留到收到成功响应；24 小时内同一调用者、同一键和同一请求返回相同 Client ID/Secret 且不重复写审计。
        非法键返回 400 invalid_idempotency_key；同键更换操作或请求内容返回 409 idempotency_conflict；
        历史结果引用的 kid 已不可用时返回 503 idempotency_key_unavailable；审计依赖不可用时回滚整个操作并返回 503 audit_unavailable。
        服务端只保存 SHA-256 摘要，不保存原始键或明文 Secret。
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]{1,128}$' }
    WalletPurchaseIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        一次逻辑钱包购买必须生成并保留同一个 1..128 字节可见 ASCII 键，直到收到成功响应。
        24 小时内同一用户、同一键和同一请求只会扣款/授予一次，重试返回已提交的原结果。
        同键更换购买类型或请求内容返回 409 idempotency_key_conflict；缺失或非法键返回 400。
        服务端只保存 SHA-256 摘要，不保存原始键。
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]{1,128}$' }
    Page: { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Search: { name: search, in: query, required: false, schema: { type: string, maxLength: 128 } }
    StatusFilter: { name: status, in: query, required: false, schema: { type: string, enum: [active, disabled] } }
  headers:
    SetCookie: { description: Session、CSRF 或 pending-login Cookie, schema: { type: string } }
    SettingDiagnostic:
      description: |
        仅在已持久化设置无法用于热路径时出现。值为 `invalid`（取值越界或校验失败）
        或 `corrupt`（JSON 不可读）。有效值和未配置行不返回此头。
        响应头与 JSON body 都不包含配置原文、域名或阈值。
      schema: { type: string, enum: [invalid, corrupt] }
  responses:
    BadRequest: { description: 请求错误；JSON 请求体无法解析时返回 400 invalid_json，且不暴露 serde 字段或类型细节, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    PayloadTooLarge: { description: JSON 请求体超过端点允许的大小时返回 413 payload_too_large，响应不包含请求体或解析细节, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { code: payload_too_large, message: request body exceeds the allowed size } } } }
    UnsupportedMediaType: { description: JSON 请求缺少正确的 Content-Type 时返回 415 unsupported_media_type, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { code: unsupported_media_type, message: request Content-Type must be application/json } } } }
    InvalidJsonData: { description: JSON 语法正确但字段类型无法反序列化时返回 422 invalid_json，响应不包含字段或 Rust/serde 类型细节, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { code: invalid_json, message: request body must be valid JSON } } } }
    InvalidPagination:
      description: page/page_size 无法解析为整数、整数溢出、page 小于 1、page_size 不在 1..=100 或 offset 溢出；响应不包含 serde 细节，服务端不静默修正越界值
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: invalid_pagination, message: page must be a positive integer and page_size must be an integer between 1 and 100 }
    Unauthorized: { description: 未认证或凭据无效, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: 无权限（admin_forbidden）；ADMIN_TOKEN 未配置时管理接口统一返回 admin_disabled, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: 资源冲突（包括 idempotency_conflict、套餐 code 冲突、已归档套餐不能设为默认和 Passkey 禁用保护）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: 资源不存在, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    TooManyRequests: { description: 认证、OAuth 配额或 QPS 限流触发, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ServiceUnavailable: { description: 依赖或必要能力暂不可用；Issuer 门禁在 Runtime Awaiting 时先回读 PostgreSQL 并应用合法值。数据库确实无 Issuer 记录时 code 为 issuer_not_configured；空值/无效值、读取失败、Runtime Pending/Invalid 或 DB/Runtime 事实无法一致应用时 code 为 issuer_runtime_invalid, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    InternalServerError: { description: 服务端内部故障, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    HealthServiceUnavailable:
      description: |
        数据库、Redis 不可用；raw Issuer 记录为空/无效或读取失败；Runtime 已加载但数据库无记录；数据库有记录但 Runtime
        未加载；或 generation/value 不一致。raw DB 与 Runtime 都没有 Issuer 是健康的保护模式，合法记录与 Runtime
        完全一致时同样就绪。任一关键 worker 未成功启动、心跳/最近成功过期、连续失败、panic 或意外返回，或签名密钥同步异常时同样不可就绪。
        响应体只暴露聚合状态，不含连接串或错误细节。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/HealthResponse' }
          example: { status: unavailable, service: chenxing-auth }
    OAuthBadRequest: { description: OAuth 请求错误，响应遵守 RFC 6749/7009, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } } } }
    OAuthUnauthorized:
      description: OAuth 客户端或 Bearer 凭据无效
      headers:
        WWW-Authenticate: { description: RFC 6749/6750 challenge, schema: { type: string } }
      content: { application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } } }
    OAuthTooManyRequests: { description: OAuth 限流或容量保护触发, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } } } }
    OAuthServiceUnavailable:
      description: |
        Runtime Awaiting 时门禁先回读 PostgreSQL，合法持久化 Issuer 会应用到当前请求并继续。数据库无记录、空值/无效值、
        读取失败、Runtime Pending/Invalid、DB/Runtime 事实无法一致应用、OAuth 依赖暂时不可用，或请求超时
        （Issues #423、#441）时统一返回 RFC 6749 `error=temporarily_unavailable`，
        不使用内部 `{code, message}`。
      content: { application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } } }
    RequestTimeout:
      description: |
        非 `/oauth/*` 应用路由或 system 路由（bootstrap、bootstrap/status、Issuer 管理）
        触发请求超时（Issues #423、#451）。
        OAuth 协议端点超时不使用本响应，见 `OAuthServiceUnavailable`。
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    OAuthErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string, description: RFC 6749/6750/7009 error code }
        error_description: { type: string, description: Human-readable non-sensitive description }
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
          description: ok 表示该探针通过；unavailable 仅出现在就绪探针 503
        service: { type: string, example: chenxing-auth }
    ExternalIdentityListResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExternalIdentity' }
    ExternalIdentity:
      type: object
      required: [provider, provider_name, email, linked_at]
      additionalProperties: false
      properties:
        provider: { type: string, description: Provider slug }
        provider_name: { type: string }
        email: { type: string, format: email, description: Email snapshot received when the identity was linked }
        linked_at: { type: string, format: date-time }
    ExternalIdentityBindingStartResponse:
      type: object
      required: [authorization_url]
      additionalProperties: false
      properties:
        authorization_url:
          type: string
          format: uri
          description: 外部 OAuth 授权 URL；不包含 Client Secret、PKCE verifier 或其他服务端凭据。
    ExternalIdentityUnlinkInput:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, format: password, maxLength: 128, writeOnly: true }
    RegistrationInput:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$', description: 仅允许 ASCII 字母、数字、点号、下划线和连字符；系统保留名不可使用 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 10, maxLength: 128 }
        display_name: { type: string, nullable: true, maxLength: 128 }
        invitation_code: { type: string, nullable: true, writeOnly: true, description: 仅公开注册在策略要求时消费 }
    CreateUserInput:
      description: 管理侧创建用户输入。基础字段与注册一致，额外允许指定角色和初始状态。
      allOf:
        - $ref: '#/components/schemas/RegistrationInput'
        - type: object
          properties:
            role: { type: string, enum: [user, admin, owner], default: user, description: 缺省为 user；指定 admin 或 owner 时额外要求 manage_roles 权限 }
            status: { type: string, enum: [active, disabled], default: active }
    LoginInput:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, maxLength: 254, description: 用户名或邮箱；超过 254 字符按凭据错误拒绝 }
        password: { type: string, format: password, minLength: 10, maxLength: 128, description: 超过 128 字符按凭据错误拒绝，不返回独立错误码 }
        totp_code: { type: string, pattern: '^[0-9]{6}$' }
    AuthorizationRequest:
      type: object
      required: [client_id, redirect_uri, response_type, scope, code_challenge, code_challenge_method]
      properties:
        client_id: { type: string }
        redirect_uri: { type: string, format: uri, description: "canonicalize 后必须匹配注册值；授权码兑换时必须原样回送本次请求文本" }
        response_type: { type: string, enum: [code] }
        scope: { type: string, description: 空格分隔的 OAuth scope }
        state: { type: string, maxLength: 512 }
        nonce: { type: string, maxLength: 512 }
        code_challenge: { type: string }
        code_challenge_method: { type: string, enum: [S256] }
    PendingLoginResponse:
      type: object
      required: [status, methods]
      properties:
        status: { type: string, enum: [factor_setup_required, factor_required] }
        methods: { type: array, items: { type: string, enum: [totp, passkey] } }
    LoginTicketInput:
      type: object
      description: 可选的旧版请求字段。服务端只把它与 HttpOnly login ticket Cookie 做一致性校验，不能替代 Cookie 和 holder proof。
      properties:
        login_ticket: { type: string }
    TotpSetupResponse:
      type: object
      required: [secret_base32, otpauth_url]
      properties:
        secret_base32: { type: string }
        otpauth_url: { type: string, format: uri }
    TotpConfirmInput:
      allOf:
        - $ref: '#/components/schemas/LoginTicketInput'
        - type: object
          required: [code]
          properties:
            code: { type: string, pattern: '^[0-9]{6}$' }
    EmptyObject:
      type: object
      additionalProperties: false
    FactorSummaryResponse:
      type: object
      required: [totp_enabled, passkey_count, available_methods]
      properties:
        totp_enabled: { type: boolean }
        passkey_count: { type: integer, format: int64, minimum: 0 }
        available_methods:
          type: array
          items: { type: string, enum: [totp, passkey] }
          description: 当前登录策略实际生效的方法；不包含待确认 enrollment。
    SessionTotpStartResponse:
      type: object
      required: [enrollment_id, secret_base32, otpauth_url]
      additionalProperties: false
      properties:
        enrollment_id: { type: string, format: uuid }
        secret_base32: { type: string, description: 仅在 start 响应返回一次，按凭据材料处理且不得记录日志。 }
        otpauth_url: { type: string, format: uri, description: 仅在 start 响应返回一次，客户端应本地生成二维码。 }
    CancelFactorEnrollmentInput:
      type: object
      required: [enrollment_id, method]
      additionalProperties: false
      properties:
        enrollment_id: { type: string, format: uuid }
        method: { type: string, enum: [totp, passkey] }
    SessionTotpConfirmInput:
      type: object
      required: [enrollment_id, code]
      additionalProperties: false
      properties:
        enrollment_id: { type: string, format: uuid }
        code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
    SessionPasskeyStartResponse:
      type: object
      required: [enrollment_id, options]
      additionalProperties: false
      properties:
        enrollment_id: { type: string, format: uuid }
        options: { $ref: '#/components/schemas/WebAuthnOptions' }
    SessionPasskeyFinishInput:
      type: object
      required: [enrollment_id, credential]
      additionalProperties: false
      properties:
        enrollment_id: { type: string, format: uuid }
        credential: { type: object, additionalProperties: true, writeOnly: true }
    FactorEnrollmentResponse:
      type: object
      required: [method, enabled]
      additionalProperties: false
      properties:
        method: { type: string, enum: [totp, passkey] }
        enabled: { type: boolean, enum: [true] }
    FactorRemovalInput:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, format: password, maxLength: 128, writeOnly: true }
    FactorRemovalResponse:
      type: object
      required: [method, removed, credentials_revoked]
      additionalProperties: false
      properties:
        method: { type: string, enum: [totp, passkey] }
        removed: { type: integer, format: int64, minimum: 1, description: TOTP 固定为 1；Passkey 为本次删除的全部凭据数。 }
        credentials_revoked: { type: boolean, enum: [true] }
    WebAuthnOptions:
      type: object
      description: WebAuthn options returned by webauthn-rs; pass through to navigator.credentials.
      additionalProperties: true
    PasskeyRegistrationInput:
      allOf:
        - $ref: '#/components/schemas/LoginTicketInput'
        - type: object
          required: [credential]
          properties:
            credential: { type: object, additionalProperties: true }
    PasskeyAuthenticationInput:
      allOf:
        - $ref: '#/components/schemas/LoginTicketInput'
        - type: object
          required: [credential]
          properties:
            credential: { type: object, additionalProperties: true }
    DiscoverablePasskeyStartResponse:
      type: object
      required: [challenge_id, options]
      properties:
        challenge_id: { type: string, format: uuid }
        options: { $ref: '#/components/schemas/WebAuthnOptions' }
    DiscoverablePasskeyFinishInput:
      type: object
      required: [challenge_id, credential]
      properties:
        challenge_id: { type: string, format: uuid }
        credential: { type: object, additionalProperties: true }
    PublicUser:
      type: object
      required: [id, username, email, status, role, created_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        username: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        email: { type: string, format: email }
        display_name: { type: string, nullable: true }
        status: { type: string }
        role: { type: string, enum: [user, admin, owner] }
        created_at: { type: string, format: date-time }
    AdminUserPlan:
      type: object
      required: [id, code, name, expires_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        code: { type: string }
        name: { type: string }
        expires_at: { type: string, format: date-time, nullable: true, description: null 表示永久有效 }
    AdminUserQueryItem:
      allOf:
        - $ref: '#/components/schemas/PublicUser'
        - type: object
          required: [plan]
          properties:
            plan: { $ref: '#/components/schemas/AdminUserPlan' }
    LoginResponse:
      type: object
      required: [expires_at]
      description: 浏览器安全的登录响应。Session token 默认不出现在 JSON 中，客户端应使用 HttpOnly Cookie 并通过 auth/status 和 auth/me 确认登录状态。
      properties:
        session_id: { type: string, description: '仅在 SESSION_TOKEN_RESPONSE_ENABLED=true 且请求显式发送 X-Chenxing-Session-Mode: token 时返回；浏览器响应默认不包含此字段' }
        expires_at: { type: string, format: date-time }
    AuthStatusResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
    PublicExternalProvider:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    StartEmailChangeInput:
      type: object
      additionalProperties: false
      required: [new_email, current_password]
      properties:
        new_email: { type: string, format: email, maxLength: 254 }
        current_password: { type: string, format: password, maxLength: 128, writeOnly: true }
    EmailChangeStartResponse:
      type: object
      additionalProperties: false
      required: [challenge_id, expires_at]
      properties:
        challenge_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
    ConfirmEmailChangeInput:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string, format: uuid }
        code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
    UserMeResponse:
      type: object
      required: [id, username, email, status, role, current_session_expires_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        username: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        email: { type: string, format: email }
        display_name: { type: string, nullable: true }
        status: { type: string }
        role: { type: string, enum: [user, admin, owner] }
        current_session_expires_at: { type: string, format: date-time }
        avatar_updated_at:
          type: string
          format: date-time
          nullable: true
          description: 头像版本时间戳；null 表示未设置头像。同时作为头像 URL 的缓存击穿参数。
    UpdateProfileInput:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, nullable: true, maxLength: 128 }
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]+$'
          description: 规范化为 ASCII 小写；与当前用户名相同的请求不需要 current_password
        current_password:
          type: string
          format: password
          maxLength: 128
          writeOnly: true
          description: 仅在修改用户名时要求；不会出现在响应或日志中
    ChangePasswordInput:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          maxLength: 128
          description: 空口令或超过 128 字符按当前密码错误拒绝，不返回独立错误码
        new_password: { type: string, format: password, minLength: 10, maxLength: 128 }
    SessionItem:
      type: object
      required: [id, created_at, expires_at, current]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }
    SessionListResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SessionItem' } }
    AuthorizedOAuthApp:
      type: object
      required: [client_id, client_name, scopes, updated_at]
      properties:
        client_id: { type: string }
        client_name: { type: string, description: OAuth 应用显示名称 }
        scopes: { type: array, items: { type: string } }
        updated_at: { type: string, format: date-time }
        logo_uri: { type: string, format: uri, nullable: true }
        client_uri: { type: string, format: uri, nullable: true }
        description:
          type: string
          nullable: true
          maxLength: 512
          description: 可选应用描述，展示在授权确认页和已授权应用列表；空白或省略表示未设置
    AuthorizedOAuthAppList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuthorizedOAuthApp' } }
    QuotaSnapshot:
      type: object
      description: |
        用量始终来自实际计数，上限来自生效套餐。两个 limit 都可能为 null，但含义不同：
        daily_limit 为 null 表示没有生效套餐（无上限概念，平台未开放自助接入）；
        monthly_limit 为 null 表示有生效套餐但该维度不限。
      required: [daily_limit, daily_used, monthly_limit, monthly_used]
      properties:
        daily_limit: { type: integer, format: int64, minimum: 0, nullable: true, description: 当前 owner effective plan 的每日授权上限；null 表示没有生效套餐 }
        daily_used: { type: integer, format: int64 }
        monthly_limit: { type: integer, format: int64, minimum: 0, nullable: true, description: 当前 owner effective plan 的每月授权上限；null 表示该维度不限 }
        monthly_used: { type: integer, format: int64 }
    OwnedOAuthClient:
      type: object
      required: [id, client_id, client_name, redirect_uris, scopes, status, quota, auth_method]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        client_id: { type: string }
        client_name: { type: string }
        redirect_uris: { type: array, items: { type: string, format: uri } }
        scopes: { type: array, items: { type: string } }
        status: { type: string, enum: [active, disabled] }
        quota: { $ref: '#/components/schemas/QuotaSnapshot' }
        auth_method:
          type: string
          description: Client 认证方式；`none` 表示公开客户端（SPA/移动端），不签发 Secret
          enum: [client_secret_basic, client_secret_post, none]
        logo_uri:
          type: string
          format: uri
          nullable: true
          description: RFC 7591 可选展示元数据。HTTPS 图片 URL，服务端不拉取；缺省时同意页使用应用名首字
        client_uri:
          type: string
          format: uri
          nullable: true
          description: RFC 7591 可选主页 URL，仅 HTTPS；缺省不影响授权
        description:
          type: string
          nullable: true
          maxLength: 512
          description: 可选应用描述，展示在开发者控制台和授权确认页；空白或省略表示未设置
    OwnedOAuthClientList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OwnedOAuthClient' } }
        total: { type: integer, format: int64, minimum: 0, description: 当前用户拥有的 OAuth 项目总数，用于分页 }
    RegisteredOwnedOAuthClient:
      allOf:
        - $ref: '#/components/schemas/OwnedOAuthClient'
        - type: object
          required: [auth_method]
          properties:
            auth_method:
              type: string
              description: Client 认证方式；`none` 表示公开客户端（SPA/移动端），此时 client_secret 字段整体省略（Issue #66）
              enum: [client_secret_basic, client_secret_post, none]
            client_secret:
              type: string
              format: password
              description: 明文 Secret，仅创建时返回一次；公开客户端（auth_method = none）不签发 Secret，该字段整体省略
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token] }
        code: { type: string }
        redirect_uri: { type: string, format: uri, description: "authorization_code grant 必须与授权请求中的原始 redirect_uri 文本完全一致" }
        code_verifier: { type: string }
        refresh_token: { type: string }
        scope:
          type: string
          description: refresh_token grant 可省略；空白字符串按省略处理并保留原授权 scope，非空值只能缩小原授权范围。
        client_id: { type: string }
        client_secret: { type: string, format: password }
    RevocationRequest:
      type: object
      required: [token]
      description: |
        HTTP Basic 凭据不出现在表单中。`client_secret_post` 必须同时提交
        `client_id` 与 `client_secret`；公开 Client 的 `none` 必须提交 `client_id`
        且省略 `client_secret`。三种 Client 认证方式不得混用。
      properties:
        token: { type: string, format: password }
        token_type_hint:
          type: string
          description: 可省略；仅支持 access_token 或 refresh_token，其他值返回 unsupported_token_type
          enum: [access_token, refresh_token]
        client_id: { type: string }
        client_secret: { type: string, format: password }
    UserInfoPostRequest:
      type: object
      required: [access_token]
      description: 仅在不使用 Authorization Bearer 时提交；Bearer 与表单 access_token 必须二选一。
      properties:
        access_token: { type: string, format: password }
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, format: int64 }
        scope: { type: string }
        refresh_token: { type: string }
        id_token: { type: string, description: "JWT ID Token（scope 含 openid 时返回）" }
    IdTokenClaims:
      type: object
      description: >
        OIDC ID Token 的 JWT payload 结构（RFC 7519 + OIDC Core 1.0 §2）。
        azp 在单 audience 场景可省略（OIDC Core §2 允许），不签发也不声明。
      required: [iss, sub, aud, exp, iat]
      properties:
        iss: { type: string, format: uri, description: "令牌签发者（等于 PostgreSQL app_settings 中已加载的运行时 Issuer）" }
        sub: { type: string, description: "用户主体标识符" }
        aud: { type: string, description: "接收方 client_id" }
        exp: { type: integer, format: int64, description: "过期时间（Unix 秒）" }
        iat: { type: integer, format: int64, description: "签发时间（Unix 秒）" }
        auth_time:
          type: integer
          format: int64
          description: >
            终端用户完成认证的时刻（会话建立时间，Unix 秒）。
            OIDC Core §2 定义。无会话上下文时（刷新令牌路径、降级路径）省略该键而非 null。
        nonce:
          type: string
          description: "授权请求中携带的 nonce，有值时出现在 ID Token 中（OIDC Core §3.1.3.7）"
        email:
          type: string
          format: email
          description: "scope 含 email 时签发"
        name:
          type: string
          description: "scope 含 profile 时签发（用户显示名称）"
    OpenIdConfiguration:
      type: object
      description: "OIDC Discovery 元数据（OIDC Discovery 1.0 §3）"
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - userinfo_endpoint
        - jwks_uri
        - response_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
        - token_endpoint_auth_methods_supported
        - revocation_endpoint_auth_methods_supported
      properties:
        issuer: { type: string, format: uri }
        authorization_endpoint: { type: string, format: uri }
        token_endpoint: { type: string, format: uri }
        userinfo_endpoint: { type: string, format: uri }
        revocation_endpoint: { type: string, format: uri }
        jwks_uri: { type: string, format: uri }
        response_types_supported: { type: array, items: { type: string } }
        subject_types_supported: { type: array, items: { type: string } }
        id_token_signing_alg_values_supported: { type: array, items: { type: string } }
        scopes_supported: { type: array, items: { type: string } }
        claims_supported:
          type: array
          items: { type: string }
          description: "支持的 ID Token Claims，含 sub、iss、aud、exp、iat、email、name、nonce、auth_time"
        code_challenge_methods_supported: { type: array, items: { type: string } }
        token_endpoint_auth_methods_supported: { type: array, items: { type: string } }
        revocation_endpoint_auth_methods_supported: { type: array, items: { type: string } }
    UserInfo:
      type: object
      required: [sub]
      properties:
        sub: { type: string }
        email: { type: string, format: email }
        name: { type: string }
    PendingAuthorizationResponse:
      type: object
      required: [request_id, client_id, client_name, redirect_host, scopes, expires_in]
      properties:
        request_id: { type: string }
        client_id: { type: string }
        client_name: { type: string }
        redirect_host: { type: string }
        scopes: { type: array, items: { type: string } }
        expires_in: { type: integer, format: int64, example: 600 }
        logo_uri: { type: string, format: uri, nullable: true }
        client_uri: { type: string, format: uri, nullable: true }
        description:
          type: string
          nullable: true
          maxLength: 512
          description: 可选应用描述，展示在授权确认页；空白或省略表示未设置
    AuthorizationDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, deny] }
    AuthorizationDecisionResponse:
      type: object
      required: [decision, redirect_to]
      properties:
        decision: { type: string, enum: [approve, deny] }
        redirect_to: { type: string, format: uri }
    AdminMeResponse:
      type: object
      required: [role, permissions, status]
      properties:
        user_id: { type: integer, format: int64, minimum: 1, nullable: true }
        username: { type: string, nullable: true }
        role: { type: string, enum: [owner, admin] }
        permissions:
          type: array
          description: |
            当前调用者的权限名。`manage_system_settings`、`manage_authentication_policy`、
            `manage_identity_providers`、`manage_issuer`、`manage_plans`、`manage_auth_factors` 与 `rotate_keys`
            仅 Owner 拥有；`manage_settings` 保留给邀请码和钱包兑换码等运营设置。
          items:
            type: string
            enum: [manage_users, manage_clients, rotate_keys, read_audit, manage_settings, manage_system_settings, manage_authentication_policy, manage_plans, manage_identity_providers, manage_issuer, manage_roles, manage_auth_factors]
        status: { type: string }
    TotpFactorStatus:
      type: object
      required: [key_state, readable, updated_at]
      description: TOTP 因子相对当前密钥环的状态。不含 kid、密文和种子。
      properties:
        key_state:
          type: string
          enum: [current, rotatable, legacy, unavailable]
          description: unavailable 表示密文引用的 kid 已不在 AUTH_ENCRYPTION_KEYS 内，账号已被锁死。
        readable: { type: boolean, description: 密文是否仍可被当前密钥环解密 }
        updated_at: { type: string, format: date-time }
    AccountFactorStatusResponse:
      type: object
      required: [user_id, methods]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        methods:
          type: array
          description: 已注册的因子方法名，去重后排序。
          items: { type: string, enum: [passkey, totp] }
        totp:
          allOf: [{ $ref: '#/components/schemas/TotpFactorStatus' }]
          nullable: true
          description: 未注册 TOTP 时为 null。
    TotpFactorResetResponse:
      type: object
      required: [user_id, previous_key_state, credentials_revoked]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        previous_key_state:
          type: string
          enum: [current, rotatable, legacy, unavailable]
          description: 删除前密文的可读状态。unavailable 表示这次重置解救了一个被密钥退役锁死的账号。
        credentials_revoked: { type: boolean, description: 重置同时撤销了该账号的全部会话与 Refresh Token，固定为 true }
    PasskeyFactorResetResponse:
      type: object
      required: [user_id, removed, credentials_revoked]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        removed: { type: integer, format: int64, minimum: 1, description: 本次清掉的 Passkey 凭据条数 }
        credentials_revoked: { type: boolean, description: 重置同时撤销了该账号的全部会话与 Refresh Token，固定为 true }
    AuthFactorKeyHealthResponse:
      type: object
      required: [total, scanned, current, rotatable, legacy, unavailable, truncated]
      properties:
        total: { type: integer, format: int64, description: TOTP 密文总数 }
        scanned: { type: integer, format: int64, description: 本次实际分类的条数，上限 10000 }
        current: { type: integer, format: int64, description: 由 active kid 加密 }
        rotatable: { type: integer, format: int64, description: 由密钥环内的非 active key 加密，退役该 key 会造成锁死 }
        legacy: { type: integer, format: int64, description: 无 kid 的历史信封 }
        unavailable: { type: integer, format: int64, description: kid 已不在密钥环内，这些账号当前无法通过 TOTP 登录 }
        truncated: { type: boolean, description: 密文总数超过扫描上限，统计只覆盖前 scanned 条 }
    AdminOverview:
      type: object
      required: [users, oauth_clients, administrators, audit_events]
      properties:
        users: { type: integer, format: int64 }
        oauth_clients: { type: integer, format: int64 }
        administrators: { type: integer, format: int64 }
        audit_events: { type: integer, format: int64 }
    RegistrationEmailSettingResponse:
      type: object
      required: [registration_email_from]
      properties:
        registration_email_from: { type: string, format: email, nullable: true }
    UpdateRegistrationEmailSettingInput:
      type: object
      required: [registration_email_from]
      properties:
        registration_email_from: { type: string, format: email, nullable: true }
    PagedUsers:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminUserQueryItem' } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    PagedClients:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ClientSummary' } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    PagedAudit:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    PagedSecurityEvents:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SecurityEvent' } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    SecurityEvent:
      type: object
      description: 用户可见的审计事件白名单；不包含 actor、resource_id 或 metadata。category 与 severity 由服务端单点映射，未映射的 action 回落 account/info。
      required: [id, action, category, severity, resource_type, client_id, client_name, created_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        action: { type: string }
        category: { $ref: '#/components/schemas/SecurityEventCategory' }
        severity: { $ref: '#/components/schemas/SecurityEventSeverity' }
        resource_type: { type: string }
        client_id: { type: string, nullable: true }
        client_name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    SecurityEventCategory:
      type: string
      enum: [auth, session, authorization, account]
      description: 事件类别，用于列表筛选。auth=登录与认证因子，session=会话生命周期，authorization=OAuth 授权，account=资料与凭据变更。
    SecurityEventSeverity:
      type: string
      enum: [info, notice, warning, critical]
      description: 事件等级，用于呈现与告警。info=常规活动，notice=成功的敏感操作，warning=需要用户留意，critical=高危变更。
    SecurityEventDetail:
      type: object
      description: 单个安全事件详情。ip / user_agent 从 metadata 白名单提取；ip_location 与 ray_id 暂无数据来源，恒为 null；client 仅 OAuth 相关事件填充，Client 已删除时为 null。
      required: [id, action, category, severity, resource_type, created_at, ip, ip_location, user_agent, ray_id, client]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        action: { type: string }
        category: { $ref: '#/components/schemas/SecurityEventCategory' }
        severity: { $ref: '#/components/schemas/SecurityEventSeverity' }
        resource_type: { type: string }
        created_at: { type: string, format: date-time }
        ip: { type: string, nullable: true, description: 事件请求源 IP（来自 metadata source_ip 白名单提取） }
        ip_location: { type: string, nullable: true, description: IP 归属地；离线归属地库未接入，恒为 null }
        user_agent: { type: string, nullable: true, description: 事件请求 User-Agent（来自 metadata user_agent 白名单提取） }
        ray_id: { type: string, nullable: true, description: 请求关联 ID；暂无对应概念，恒为 null }
        client:
          allOf:
            - $ref: '#/components/schemas/SecurityEventClient'
          nullable: true
    SecurityEventClient:
      type: object
      description: 详情接口中 OAuth Client 的公开摘要，只来自 oauth_clients 表自身列。
      required: [client_id, client_name, created_at, status]
      properties:
        client_id: { type: string }
        client_name: { type: string }
        created_at: { type: string, format: date-time }
        status: { type: string, enum: [active, disabled] }
    AuditEvent:
      type: object
      required: [id, actor_type, actor_id, action, resource_type, resource_id, metadata, created_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        actor_type: { type: string }
        actor_id: { type: string, nullable: true }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string, nullable: true }
        metadata: { type: object, additionalProperties: true, description: 已经过敏感字段递归脱敏的审计上下文 }
        created_at: { type: string, format: date-time }
    AdminInput:
      type: object
      required: [username, email, password, role]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 10 }
        role: { type: string, enum: [admin, owner] }
    BootstrapOwnerInput:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 10 }
    BootstrapOwnerResponse:
      type: object
      required: [id, username, email, role]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        username: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [owner] }
    BootstrapStatusResponse:
      type: object
      required: [initialized]
      properties:
        initialized: { type: boolean }
    IssuerRecordResponse:
      type: object
      required: [value, generation, updated_at]
      properties:
        value: { type: string, format: uri, description: 无尾斜杠的规范化 OIDC 根 URL }
        generation: { type: integer, format: int64, minimum: 1 }
        updated_at: { type: string, format: date-time }
    IssuerSettingResponse:
      type: object
      required: [persisted, loaded, phase]
      properties:
        persisted:
          allOf: [{ $ref: '#/components/schemas/IssuerRecordResponse' }]
          nullable: true
        loaded:
          allOf: [{ $ref: '#/components/schemas/IssuerRecordResponse' }]
          nullable: true
        phase: { type: string, enum: [awaiting_issuer, issuer_loaded, issuer_invalid] }
    UpdateIssuerSetting:
      type: object
      required: [value, expected_generation, confirm]
      properties:
        value: { type: string, format: uri, maxLength: 2048 }
        expected_generation: { type: integer, format: int64, minimum: 0 }
        confirm: { type: boolean, description: 已有 Issuer 改值时必须为 true }
    PasskeySetting:
      type: object
      required: [enabled, rp_name, rp_id, user_verification, authenticator_attachment, allow_insecure_origin, allowed_origins]
      properties:
        enabled: { type: boolean }
        rp_name: { type: string, maxLength: 128 }
        rp_id:
          type: string
          maxLength: 253
          description: 必须是可注册域（eTLD+1），公共后缀（co.uk、com.cn、github.io 等）会被拒绝；localhost 与 IPv4 是仅有的例外。Unicode 域名须用 Punycode 形式填写。
        user_verification: { type: string, enum: [preferred, required, discouraged] }
        authenticator_attachment: { type: string, enum: [any, platform, cross_platform] }
        allow_insecure_origin: { type: boolean }
        allowed_origins:
          type: array
          maxItems: 32
          items: { type: string, format: uri }
    EmailPolicySetting:
      type: object
      required: [whitelist_enabled, alias_restriction_enabled, allowed_domains, generation, repair_required]
      properties:
        whitelist_enabled: { type: boolean }
        alias_restriction_enabled: { type: boolean }
        allowed_domains:
          type: array
          maxItems: 128
          items: { type: string, maxLength: 253 }
        generation: { type: integer, format: int64, minimum: 0 }
        diagnostic:
          type: string
          enum: [invalid, corrupt]
          description: 仅持久化设置无法安全用于热路径时返回；响应 value 是 fail-closed 修复预览。
        repair_required: { type: boolean, description: true 时 PUT 必须显式 confirm_repair=true 才能覆盖原值。 }
    UpdateEmailPolicySetting:
      type: object
      required: [whitelist_enabled, alias_restriction_enabled, allowed_domains, expected_generation]
      properties:
        whitelist_enabled: { type: boolean }
        alias_restriction_enabled: { type: boolean }
        allowed_domains:
          type: array
          maxItems: 128
          items: { type: string, maxLength: 253 }
        expected_generation: { type: integer, format: int64, minimum: 0 }
        confirm_repair: { type: boolean, default: false }
    RegistrationSetting:
      type: object
      description: >-
        公开注册开关。双布尔默认全关：未配置实例的公开注册保持关闭。
        email_verification_required 为真时，即使 enabled 打开，注册仍在邮件验证
        能力缺失处 fail-closed（503 email_verification_unavailable）。
      required: [enabled, email_verification_required, invitation_code_required]
      properties:
        enabled: { type: boolean }
        email_verification_required: { type: boolean }
        invitation_code_required: { type: boolean }
    RegistrationStatusResponse:
      type: object
      description: >-
        匿名注册状态。enabled 是有效值（存储开关 AND Issuer 就绪），
        email_verification_required 是存储值。
      required: [enabled, email_verification_required, invitation_code_required]
      properties:
        enabled: { type: boolean }
        email_verification_required: { type: boolean }
        invitation_code_required: { type: boolean }
    InvitationCodeSummary:
      type: object
      required: [id, max_uses, use_count, created_at]
      properties:
        id: { type: integer, format: int64 }
        label: { type: string, nullable: true, maxLength: 128 }
        max_uses: { type: integer, minimum: 1, maximum: 10000 }
        use_count: { type: integer, minimum: 0 }
        expires_at: { type: string, format: date-time, nullable: true }
        disabled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    CreateInvitationCodesInput:
      type: object
      required: [count, max_uses, expires_at, label]
      properties:
        count: { type: integer, minimum: 1, maximum: 100 }
        max_uses: { type: integer, minimum: 1, maximum: 10000 }
        expires_at: { type: string, format: date-time, nullable: true }
        label: { type: string, nullable: true, maxLength: 128 }
    CreatedInvitationCode:
      allOf:
        - $ref: '#/components/schemas/InvitationCodeSummary'
        - type: object
          required: [code]
          properties:
            code: { type: string, writeOnly: true, description: 仅创建响应返回一次 }
    InvitationCodeUse:
      type: object
      required: [user_id, username, display_name, used_at]
      properties:
        user_id: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string, nullable: true }
        used_at: { type: string, format: date-time }
    InvitationCodeDetail:
      allOf:
        - $ref: '#/components/schemas/InvitationCodeSummary'
        - type: object
          required: [uses]
          properties:
            uses:
              type: array
              items: { $ref: '#/components/schemas/InvitationCodeUse' }
    SmtpSetting:
      type: object
      required: [host, port, username, from_address, ssl_enabled, force_auth_login, password_configured]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        from_address: { type: string }
        ssl_enabled: { type: boolean }
        force_auth_login: { type: boolean }
        password_configured: { type: boolean }
    SmtpPasswordAction:
      type: string
      enum: [keep, set, clear]
      description: >-
        SMTP 密码更新意图。keep 保留已存密文，set 加密替换，clear 原子删除已存密文。
        响应、日志和审计只记录该枚举，永不回显 password 或 password_ciphertext。
    SmtpSettingUpdate:
      type: object
      required: [host, port, username, from_address, ssl_enabled, force_auth_login]
      description: >-
        SMTP 设置写入体。密码三态以 password_action 为准：keep 必须省略 password；
        set 必须提供非空 password（最长 512）；clear 必须省略 password。
        省略 password_action 仅兼容旧客户端——此时省略或 null 的 password 视为 keep，
        非空 password 视为 set。空字符串不再等于 keep，与 action 冲突或 set 缺值返回
        400 invalid_smtp_setting。GET/PUT 响应只有 password_configured，不含明文或密文。
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        from_address: { type: string }
        ssl_enabled: { type: boolean }
        force_auth_login: { type: boolean }
        password_action:
          $ref: '#/components/schemas/SmtpPasswordAction'
        password: { type: string, format: password, nullable: true, writeOnly: true, maxLength: 512 }
    SessionLifetimeSetting:
      type: object
      description: 浏览器会话的绝对与空闲有效期；修改只影响之后新签发的会话
      required: [session_ttl_seconds, session_idle_timeout_seconds]
      properties:
        session_ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 7776000
          default: 1209600
          description: 会话绝对有效期（秒），默认 14 天，最长 90 天
        session_idle_timeout_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 2592000
          default: 1209600
          description: 会话连续无操作超时（秒），默认 14 天，最长 30 天
    SecurityLimitsSetting:
      type: object
      description: >-
        可配置的安全阈值与 TTL。全部 13 项必填，且必须落在各自的 minimum..maximum 之间；
        越界（含 0、负数与 i64::MAX 之类的极值）会被拒绝并返回 400 invalid_security_limits，
        错误信息给出越界的字段名。阈值本身就是安全控制，因此上界与下界同样强制：例如
        account_failure_limit 填极大值等于关掉账户锁定。授权码 TTL 上限 600 秒，取自
        RFC 6749 §4.1.2 的 10 分钟建议。
      required:
        - unauthenticated_source_qps
        - authorization_code_ttl_seconds
        - pending_request_ttl_seconds
        - max_pending_requests_per_client
        - max_pending_requests_global
        - auth_failure_window_seconds
        - account_failure_limit
        - ip_failure_limit
        - totp_ticket_failure_limit
        - external_login_state_ttl_seconds
        - external_login_state_rate_window_seconds
        - external_login_state_rate_limit
        - external_login_state_max_pending
      properties:
        unauthenticated_source_qps:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 30
          description: 未认证来源在 OAuth /token 端点的 QPS 上限（次/秒）
        authorization_code_ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 600
          default: 300
          description: 授权码有效期（秒）。RFC 6749 §4.1.2 建议不超过 600
        pending_request_ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 3600
          default: 600
          description: 待决授权请求 TTL（秒），即用户停留在授权确认页的最长时间
        max_pending_requests_per_client:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000
          default: 20
          description: 单个 Client 的待决授权请求容量上限（个）
        max_pending_requests_global:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
          default: 1000
          description: 全局待决授权请求容量上限（个）
        auth_failure_window_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 86400
          default: 900
          description: 认证失败计数的滑动窗口时长（秒）
        account_failure_limit:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000
          default: 10
          description: 任意一个滑动窗口内账户维度的失败次数上限（次）
        ip_failure_limit:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000
          default: 30
          description: 单窗口内源 IP 维度的失败次数上限（次）
        totp_ticket_failure_limit:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
          default: 5
          description: 单个 TOTP 登录 ticket 允许的累计失败次数（次）
        external_login_state_ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 3600
          default: 600
          description: 外部 OAuth 登录 state 有效期（秒）
        external_login_state_rate_window_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 3600
          default: 60
          description: 外部 OAuth 登录 state 的源 IP 限流窗口（秒）
        external_login_state_rate_limit:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000
          default: 30
          description: 单窗口内单个源 IP 可创建的外部登录 state 数量上限（个）
        external_login_state_max_pending:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
          default: 10000
          description: 外部 OAuth 登录 state 的全局待决容量上限（个）
    AdminSummary:
      type: object
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        username: { type: string }
        role: { type: string }
        status: { type: string }
    OAuthProviderCreateInput:
      type: object
      required: [name, slug, authorization_endpoint, token_endpoint, userinfo_endpoint, client_id, client_secret, scopes, email_verified_claim]
      properties:
        name: { type: string, maxLength: 128 }
        slug: { type: string, pattern: '^[a-z0-9_-]+$', maxLength: 64 }
        authorization_endpoint:
          type: string
          format: uri
          description: HTTPS 公网端点；IP 字面量和连接时 DNS 解析结果不得落入私网、链路本地、CGNAT、ULA 或保留地址。仅 localhost/回环地址可用于本机 HTTP 测试。
        token_endpoint:
          type: string
          format: uri
          description: HTTPS 公网端点；IP 字面量和连接时 DNS 解析结果不得落入私网、链路本地、CGNAT、ULA 或保留地址。仅 localhost/回环地址可用于本机 HTTP 测试。
        userinfo_endpoint:
          type: string
          format: uri
          description: HTTPS 公网端点；IP 字面量和连接时 DNS 解析结果不得落入私网、链路本地、CGNAT、ULA 或保留地址。仅 localhost/回环地址可用于本机 HTTP 测试。
        client_id: { type: string }
        client_secret: { type: string, format: password, writeOnly: true }
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          description: >-
            发往外部 IdP 的 scope。可包含 openid（多数 OIDC 提供商需要它才开放 UserInfo 端点），但本平台只用它
            换取可调用 UserInfo 的 access token，不会解析或验证随之返回的 id_token。
        subject_claim: { type: string, default: sub }
        email_claim: { type: string, default: email }
        name_claim: { type: string, nullable: true }
        email_verified_claim:
          type: string
          description: 指向布尔型邮箱验证状态的 claim 路径。必填：缺失、空白、非 bool 或 false 时服务端拒绝身份解析与自动建号。
        client_auth_method: { type: string, enum: [basic, request_body], default: basic }
        pkce_enabled:
          type: boolean
          default: true
          description: 是否对该外部提供商启用 PKCE；默认开启，只有明确确认提供商不支持时才关闭。
    OAuthProviderUpdateInput:
      type: object
      required: [name, slug, authorization_endpoint, token_endpoint, userinfo_endpoint, client_id, scopes, email_verified_claim, expected_version]
      description: client_secret 可省略，省略时保留原值
      properties:
        name: { type: string, maxLength: 128 }
        slug: { type: string, pattern: '^[a-z0-9_-]+$', maxLength: 64 }
        authorization_endpoint:
          type: string
          format: uri
          description: HTTPS 公网端点；IP 字面量和连接时 DNS 解析结果不得落入私网、链路本地、CGNAT、ULA 或保留地址。仅 localhost/回环地址可用于本机 HTTP 测试。
        token_endpoint:
          type: string
          format: uri
          description: HTTPS 公网端点；IP 字面量和连接时 DNS 解析结果不得落入私网、链路本地、CGNAT、ULA 或保留地址。仅 localhost/回环地址可用于本机 HTTP 测试。
        userinfo_endpoint:
          type: string
          format: uri
          description: HTTPS 公网端点；IP 字面量和连接时 DNS 解析结果不得落入私网、链路本地、CGNAT、ULA 或保留地址。仅 localhost/回环地址可用于本机 HTTP 测试。
        client_id: { type: string }
        client_secret: { type: string, format: password, writeOnly: true, nullable: true }
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          description: >-
            发往外部 IdP 的 scope。可包含 openid（多数 OIDC 提供商需要它才开放 UserInfo 端点），但本平台只用它
            换取可调用 UserInfo 的 access token，不会解析或验证随之返回的 id_token。
        subject_claim: { type: string, default: sub }
        email_claim: { type: string, default: email }
        name_claim: { type: string, nullable: true }
        email_verified_claim:
          type: string
          description: 指向布尔型邮箱验证状态的 claim 路径。必填：缺失、空白、非 bool 或 false 时服务端拒绝身份解析与自动建号。
        client_auth_method: { type: string, enum: [basic, request_body], default: basic }
        expected_version: { type: integer, format: int64, minimum: 1, description: 列表或最近写响应返回的 state_version。 }
    OAuthProviderStatusInput:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
    OAuthProviderStatusResponse:
      type: object
      additionalProperties: false
      required: [state_version]
      properties:
        state_version: { type: integer, format: int64, minimum: 1 }
    OAuthProviderSummary:
      type: object
      description: >-
        自定义提供商摘要。身份建立只依赖 UserInfo 响应；本平台不为该提供商验证 ID Token，
        因此契约中不存在 issuer、jwks_uri 或 id_token 相关字段。
      required: [id, name, slug, trust_model, callback_uri, authorization_endpoint, token_endpoint, userinfo_endpoint, client_id, scopes, subject_claim, email_claim, client_auth_method, status, state_version, client_secret_configured]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        slug: { type: string }
        trust_model:
          type: string
          enum: [oauth2_userinfo]
          description: >-
            身份信任模型。恒为 oauth2_userinfo：OAuth 2.0 授权码流程 + UserInfo 端点，sub/email/email_verified
            全部来自 UserInfo 响应，令牌响应中的 id_token 不被解析也不参与身份判定。本平台作为 OP 对下游 Client
            仍完整支持 OIDC，该字段只描述上游自定义提供商这一侧。
        callback_uri: { type: string, format: uri }
        authorization_endpoint: { type: string, format: uri }
        token_endpoint: { type: string, format: uri }
        userinfo_endpoint: { type: string, format: uri }
        client_id: { type: string }
        scopes: { type: array, items: { type: string } }
        subject_claim: { type: string }
        email_claim: { type: string }
        name_claim: { type: string, nullable: true }
        email_verified_claim:
          type: string
          nullable: true
          description: null 表示存量遗留配置，该 provider 无法判断邮箱验证状态，不能被启用，也不会放行外部登录。
        client_auth_method: { type: string, enum: [basic, request_body] }
        pkce_enabled: { type: boolean }
        status: { type: string, enum: [active, disabled] }
        state_version: { type: integer, format: int64, minimum: 1 }
        client_secret_configured: { type: boolean }
    ClientInput:
      type: object
      required: [client_name, redirect_uris, scopes]
      properties:
        client_name: { type: string, minLength: 1, maxLength: 128 }
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 10
          description: 重复 URI 按首次出现顺序去重；HTTPS 可使用普通主机，HTTP 仅允许字面回环 IP（127.0.0.0/8 或 [::1]），不接受 localhost；禁止 wildcard、fragment 和 userinfo。
          items: { type: string, format: uri, minLength: 1, maxLength: 2048 }
        scopes:
          type: array
          minItems: 1
          maxItems: 32
          description: 服务端仅接受 OAUTH_CLIENT_ALLOWED_SCOPES allowlist 中的 scope；默认 allowlist 为 openid、profile、email。
          items: { type: string, minLength: 1, maxLength: 64 }
        auth_method:
          type: string
          enum: [client_secret_basic, client_secret_post, none]
          description: 仅创建时生效，缺省为 client_secret_basic。更新请求忽略此字段，创建后不可改认证方式。
        logo_uri:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
          description: 可选 HTTPS 图片 URL。空白或省略表示未设置；更新时传空字符串可清除。服务端不拉取该地址。
        client_uri:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
          description: 可选 HTTPS 主页 URL。空白或省略表示未设置；更新时传空字符串可清除。
        description:
          type: string
          nullable: true
          maxLength: 512
          description: 可选应用描述，展示在开发者控制台和授权确认页；空白或省略表示未设置；更新时传空字符串可清除。服务端 trim，最长 512 字符，拒绝除换行/回车/制表外的控制字符。
    ClientSummary:
      allOf:
        - $ref: '#/components/schemas/ClientInput'
        - type: object
          required: [id, client_id, status, auth_method]
          properties:
            id: { type: integer, format: int64, minimum: 1 }
            client_id: { type: string }
            status: { type: string }
            owner_user_id: { type: integer, format: int64, minimum: 1, nullable: true }
            auth_method:
              type: string
              enum: [client_secret_basic, client_secret_post, none]
            logo_uri: { type: string, format: uri, nullable: true }
            client_uri: { type: string, format: uri, nullable: true }
            description: { type: string, nullable: true, maxLength: 512 }
    RegisteredClient:
      allOf:
        - $ref: '#/components/schemas/ClientSummary'
        - type: object
          required: [auth_method]
          properties:
            auth_method:
              type: string
              description: Client 认证方式；`none` 表示公开客户端，此时 client_secret 字段整体省略
              enum: [client_secret_basic, client_secret_post, none]
            client_secret:
              type: string
              format: password
              description: 明文 Secret，仅创建时返回一次；公开客户端（auth_method = none）不签发，字段整体省略
    ClientSecretResponse:
      type: object
      properties:
        client_id: { type: string }
        client_secret: { type: string, format: password }
    Plan:
      type: object
      description: 套餐定义；monthly_auth_limit / max_qps 为 null 表示无限 / 不限。日授权 0–1000000，月授权 0–31000000，QPS 1–10000。price_points=0 表示不可自助购买，仅管理员可分配。
      required: [id, code, name, oauth_clients_limit, daily_auth_limit, monthly_auth_limit, max_qps, is_default, status, price_points, billing_period, created_at, updated_at, assigned_users]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        code: { type: string, maxLength: 64, description: 小写字母、数字、下划线或连字符，服务端自动归一化 }
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true, maxLength: 512 }
        oauth_clients_limit: { type: integer, format: int32, minimum: 0, maximum: 1000 }
        daily_auth_limit: { type: integer, format: int64, minimum: 0, maximum: 1000000 }
        monthly_auth_limit: { type: integer, format: int64, nullable: true, minimum: 0, maximum: 31000000 }
        max_qps: { type: integer, format: int32, nullable: true, minimum: 1, maximum: 10000 }
        is_default: { type: boolean }
        status: { type: string, enum: [active, archived] }
        price_points: { type: integer, format: int64, minimum: 0, description: 自助购买价格（辰星点）；0 表示仅管理员分配 }
        billing_period: { type: string, enum: [one_time, monthly, yearly] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        assigned_users: { type: integer, format: int64, minimum: 0, description: 当前已分配用户数（管理端响应包含） }
    PlanInput:
      type: object
      description: 创建 / 更新套餐的输入。price_points / billing_period 缺省为 0 / one_time。
      required: [code, name, oauth_clients_limit, daily_auth_limit, is_default]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true, maxLength: 512 }
        oauth_clients_limit: { type: integer, format: int32, minimum: 0, maximum: 1000 }
        daily_auth_limit: { type: integer, format: int64, minimum: 0, maximum: 1000000 }
        monthly_auth_limit: { type: integer, format: int64, nullable: true, minimum: 0, maximum: 31000000 }
        max_qps: { type: integer, format: int32, nullable: true, minimum: 1, maximum: 10000 }
        is_default: { type: boolean }
        price_points: { type: integer, format: int64, minimum: 0, default: 0 }
        billing_period: { type: string, enum: [one_time, monthly, yearly], default: one_time }
    PlanCatalogItem:
      type: object
      required: [id, code, name, price_points, billing_period, oauth_clients_limit, daily_auth_limit, monthly_auth_limit, max_qps]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        code: { type: string }
        name: { type: string }
