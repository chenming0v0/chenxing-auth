openapi: 3.0.3
info:
  title: 辰星认证中枢 API
  version: 1.0.0
  description: |
    辰星通行证用户认证、OAuth 2.0/OIDC 和统一用户管理 API。
    当前定义以仓库实际路由为准。运行时 Issuer 的权威来源是 PostgreSQL `app_settings` 表中的 `app_issuer` 记录，不是环境变量、请求 Host 或反向代理输入。
    数据库与 Runtime 都没有 Issuer 时进入保护模式：只要数据库、Redis、关键 worker 与签名同步均就绪，readiness 仍视为健康；首 Owner 初始化仍可用，只有用户 ID=1 可以本地登录，
    ADMIN_TOKEN 保留用于恢复和 Issuer 配置；除首 Owner 初始化外，公共注册与所有用户创建接口关闭。仅依赖正式 Issuer
    的路由关闭，包括 OAuth/OIDC 协议与授权确认、Discovery、JWKS、外部登录及其 Provider 管理。Issuer 门禁发现 Runtime
    处于 AwaitingIssuer 时会立即回读 PostgreSQL：合法持久化值会应用到当前请求并继续处理；无记录、空值/无效值、数据库读取失败、
    Runtime 已是 Pending/Invalid，或 DB/Runtime 事实无法一致应用时才返回 503。readiness 独立要求 raw DB 与 Runtime 完全一致，
    且五个关键后台 worker 的心跳与最近成功均在各自时限内，签名密钥同步状态允许令牌签发。

    ADMIN_TOKEN 为空时整个已初始化管理面 fail closed：系统 Bearer 与浏览器 Session 两条管理通道都返回 403
    admin_disabled；唯一例外是不存在 Owner 时公开的首个 Owner 初始化接口。WebAuthn 的显式 WEBAUTHN_RP_ID / WEBAUTHN_ORIGIN
    覆盖始终优先；未显式覆盖时从持久化 Issuer 的 host / 根 URL 派生，绝不从请求 Host 或反向代理输入推导。

    已注册的 `/oauth/authorize`、`/oauth/token`、`/oauth/revoke` 和 `/oauth/userinfo` 始终保持 RFC 6749
    `OAuthErrorResponse` 信封。Issuer 门禁即时回读后仍不可用、OAuth 依赖不可用或请求超时
    （`REQUEST_TIMEOUT_SECONDS`）时统一返回标准 `503 temporarily_unavailable`，不得改写为内部 API 信封。
    未知 `/oauth/*` 路径仍返回统一 404；其余应用路由使用内部 `ErrorResponse`。
    健康检查与静态 SPA fallback 不套用该请求超时。
    所有声明 `application/json` requestBody 的内部 API 使用统一提取错误：缺少或错误 Content-Type
    返回 415 `unsupported_media_type`，JSON 语法错误返回 400 `invalid_json`，字段类型或必填字段错误
    返回 422 `invalid_json`；响应始终是 `ErrorResponse`，不暴露 serde 字段路径或实现类型。
servers:
  - url: http://127.0.0.1:3000
    description: 本地开发
tags:
  - name: System
  - name: User Auth
  - name: User Auth/Account
  - name: User Auth/MFA
  - name: User Auth/Security
  - name: User Auth/Sessions
  - name: User Auth/Security Events
  - name: User Auth/OAuth Clients
  - name: User Auth/Authorized Apps
  - name: User Entitlements
  - name: User Wallet
  - name: User Auth/Browser Login
  - name: OAuth/OIDC
  - name: Admin Auth
  - name: Admin Users
  - name: Admin Plans
  - name: Admin Clients
  - name: Admin OAuth Providers
  - name: Admin Auth Factors
  - name: Admin Operations
paths:
  /health:
    get:
      tags: [System]
      summary: 就绪探针（与 /health/ready 相同）
      operationId: health
      description: |
        兼容别名，处理逻辑与 GET /health/ready 相同：检查数据库、Redis、Issuer 收敛和五个关键后台 worker。
        raw DB 没有 Issuer 记录且 Runtime 也未加载 Issuer 是合法的保护模式，此时数据库、Redis、worker 和签名密钥同步均就绪则返回 200。
        raw DB 存在合法 Issuer 且 generation/value 与 Runtime 完全一致时同样返回 200。raw 记录为空或无效、读取失败、
        Runtime 已加载但数据库无记录、数据库有记录但 Runtime 未加载，或值/代次不一致时返回 503。
        任一关键 worker 未成功启动、心跳/最近成功过期、连续失败、panic 或意外返回，或签名密钥同步异常时也返回 503。
        响应体只暴露聚合状态，不含连接串或错误细节。
      responses:
        '200':
          description: 数据库、Redis、五个关键 worker 和签名密钥同步均就绪，且 raw DB/Runtime 均无 Issuer，或合法 generation/value 完全一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example: { status: ok, service: chenxing-auth }
        '503':
          $ref: '#/components/responses/HealthServiceUnavailable'
  /health/live:
    get:
      tags: [System]
      summary: 存活探针
      operationId: healthLive
      description: |
        只报告进程本身，不触碰数据库、Redis 或 Issuer。恒返回 200，供编排器 liveness 探针使用。
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example: { status: ok, service: chenxing-auth }
  /health/ready:
    get:
      tags: [System]
      summary: 就绪探针
      operationId: healthReady
      description: |
        检查数据库、Redis、Issuer 收敛和五个关键后台 worker，并确认签名密钥同步允许令牌签发。raw DB 与 Runtime 都没有 Issuer 是合法的保护模式；raw DB 存在合法 Issuer
        且 generation/value 与 Runtime 完全一致时也就绪。raw 记录为空或无效、读取失败、任一侧缺失、值/代次不一致，
        任一依赖超时/未就绪，或任一关键 worker 未成功启动、心跳/最近成功过期、连续失败、panic/意外返回，或签名密钥同步异常时返回 503。
        响应体只暴露聚合状态，不含连接串、主机名或错误细节。
      responses:
        '200':
          description: 数据库、Redis、五个关键 worker 和签名密钥同步均就绪，且 raw DB/Runtime 均无 Issuer，或合法 generation/value 完全一致
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example: { status: ok, service: chenxing-auth }
        '503':
          $ref: '#/components/responses/HealthServiceUnavailable'
  /.well-known/openid-configuration:
    get:
      tags: [OAuth/OIDC]
      summary: OIDC Discovery
      operationId: openidConfiguration
      description: |
        返回 OIDC Discovery 文档。公开只读元数据，允许任意来源跨域读取
        （`Access-Control-Allow-Origin: *`，不带凭据）。Runtime 处于 AwaitingIssuer 时，门禁立即回读 PostgreSQL；
        合法持久化 Issuer 会应用到当前请求并继续返回 Discovery。数据库确实无记录时返回内部 `ErrorResponse`
        信封的 503 `issuer_not_configured`；持久化空值/无效值、读取失败、Runtime Pending/Invalid，或事实无法一致应用时
        返回 503 `issuer_runtime_invalid`。
      responses:
        '200':
          description: OIDC 配置
          headers:
            Access-Control-Allow-Origin:
              description: 当请求带 Origin 时返回 `*`，允许 RP 跨域读取；无 Origin 时省略。
              schema: { type: string }
            Vary:
              description: 始终为 `Origin`，避免共享缓存混用带/不带 Origin 的响应。
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIdConfiguration'
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /.well-known/jwks.json:
    get:
      tags: [OAuth/OIDC]
      summary: JWKS 公钥集合
      operationId: jwks
      description: |
        返回当前及验证过渡期公钥集合，只用于验证 JWT，不包含私钥。
        公开只读元数据，CORS 与 Discovery 一致：请求带 Origin 时返回
        `Access-Control-Allow-Origin: *`（不带凭据），且始终 `Vary: Origin`。
        另返回 `Access-Control-Expose-Headers: ETag`，让浏览器 JS 能读取 ETag 并发起
        条件请求；200 与 304 均适用。该头只出现在 JWKS，不扩到其它路由。
        缓存策略为 `Cache-Control: public, max-age=60, must-revalidate`，RP 可在 60 秒内
        直接使用共享缓存；过期后用 `If-None-Match` 发起条件请求，公钥集合未变时返回 304。
        ETag 由 JWKS 字节的 SHA-256 派生，确定性且跨实例一致；密钥轮换或吊销后 ETag 改变。
        Runtime 处于 AwaitingIssuer 时，门禁立即回读 PostgreSQL；合法持久化 Issuer 会应用到当前请求并继续返回 JWKS。
        数据库确实无记录时返回内部 `ErrorResponse` 信封的 503 `issuer_not_configured`；持久化空值/无效值、读取失败、
        Runtime Pending/Invalid，或事实无法一致应用时返回 503 `issuer_runtime_invalid`。
      parameters:
        - { name: If-None-Match, in: header, required: false, description: RP 上次响应的 ETag，匹配时返回 304, schema: { type: string } }
      responses:
        '200':
          description: 公钥集合
          headers:
            Cache-Control:
              description: '`public, max-age=60, must-revalidate`'
              schema: { type: string }
            ETag:
              description: JWKS 字节 SHA-256 的强 ETag，用于条件请求。
              schema: { type: string }
            Access-Control-Allow-Origin:
              description: 当请求带 Origin 时返回 `*`，允许 RP 跨域读取；无 Origin 时省略。
              schema: { type: string }
            Access-Control-Expose-Headers:
              description: 始终为 `ETag`，让浏览器 JS 能读取 ETag。
              schema: { type: string }
            Vary:
              description: 始终为 `Origin`，避免共享缓存混用带/不带 Origin 的响应。
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
        '304':
          description: 公钥集合未变更，RP 可继续使用缓存副本
          headers:
            ETag:
              description: 与 200 响应相同的 ETag。
              schema: { type: string }
            Cache-Control:
              description: '`public, max-age=60, must-revalidate`'
              schema: { type: string }
            Access-Control-Allow-Origin:
              description: 当请求带 Origin 时返回 `*`；无 Origin 时省略。
              schema: { type: string }
            Access-Control-Expose-Headers:
              description: 始终为 `ETag`，条件请求命中后浏览器 JS 仍能读取 ETag。
              schema: { type: string }
            Vary:
              description: 始终为 `Origin`。
              schema: { type: string }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/users:
    post:
      tags: [User Auth/Account]
      summary: 注册用户
      operationId: registerUser
      description: |
        公开注册由 `registration` 设置闸门控制，默认关闭：
        - 开关关闭时返回 403 `registration_disabled`。
        - 开关打开且 `email_verification_required=true` 时，在邮件所有权验证能力接入前
          fail-closed，返回 503 `email_verification_unavailable`，不创建未验证身份。
        - `invitation_code_required=true` 时必须提供有效邀请码；邀请码与用户创建在同一
          数据库事务中消费，失败请求不会占用次数。
        - 其余情况执行真实创建：输入校验、邮箱域名策略、按源 IP 的注册尝试配额、
          Owner 前提全部通过后，创建 role=user、status=active 的账号。
        用户名和邮箱的唯一冲突统一返回 `registration_conflict`，不暴露具体冲突字段。
        Issuer 缺少时注册接口关闭并返回 503 `issuer_not_configured`。
        有效注册状态（开关 AND Issuer 就绪）见 GET /api/v1/auth/registration-status。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/PublicUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/login:
    post:
      tags: [User Auth/Account]
      summary: 用户登录
      description: |
        请求先经过 Issuer 门禁。Runtime 为 AwaitingIssuer 时立即回读 PostgreSQL：合法持久化 Issuer 会应用到当前请求并继续；
        数据库确实无记录时进入保护模式，只有用户 ID=1 可以本地登录，其他用户返回 `invalid_credentials`。
        门禁允许继续后，请求格式错误返回 415 或 422；持久化空值/无效值、读取失败或 Runtime Pending/Invalid 时，
        在进入登录处理器前返回 503 `issuer_runtime_invalid`。

        没有绑定 TOTP 的账号在口令校验成功后直接签发普通 Session，审计 factor 固定为
        `password`。已绑定 TOTP 时返回 `factor_required`，并通过 ticket-only 流程完成
        验证器应用确认。Passkey 是独立的第一因子，不会在密码之后作为第二步出现。
        `factor_setup_required` 保留在响应枚举中用于协议兼容。

        错误码：
        - 401 invalid_credentials / invalid_factor：口令或 TOTP 验证码错误，或已被限流。
        - 503 factor_key_unavailable：请求带 `totp_code` 且该账号的 TOTP 种子由已退役的
          加密 kid 保护，服务端无法解密。重试无效，需要管理员重置因子。该结果不消耗
          认证失败额度。
      operationId: loginUser
      parameters:
        - { $ref: '#/components/parameters/SessionResponseMode' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: 登录成功，同时设置 Session 和 CSRF Cookie
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '202':
          description: 密码正确且账号已绑定 TOTP，需要完成验证器应用第二步。通过 HttpOnly login ticket 与 holder Cookie 继续流程，不在 JSON 响应中返回 ticket
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingLoginResponse' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/totp/setup:
    post:
      tags: [User Auth/MFA]
      summary: 开始 TOTP 首次绑定
      operationId: startTotpSetup
      description: |
        otpauth issuer 标签取自已加载 Issuer 的 host，不读取请求 Host 或代理头。
        Issuer 门禁即时回读后仍不可用时返回 503 `issuer_not_configured` 或
        `issuer_runtime_invalid`，不会生成来源不明的二维码标签。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginTicketInput' }
      responses:
        '200':
          description: 返回一次性 TOTP 秘钥和标准 otpauth URI；客户端应在本地将 otpauth URI 生成二维码，禁止提交到第三方二维码服务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpSetupResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/totp/setup/confirm:
    post:
      tags: [User Auth/MFA]
      summary: 确认 TOTP 并完成登录
      description: |
        验证码在同一时间步内只能使用一次，边界按「用户 + 时间步」判定，
        与注册确认还是登录验证无关：注册成功消费掉的那个码不能再用于后续登录，
        反之亦然。遇到这种冲突时等下一个验证码重试即可，ticket 和待确认注册都保留。

        错误码：
        - 400 invalid_login_ticket：ticket 无效、缺少 holder proof，或待确认注册
          未绑定到该 ticket 的用户（fail closed，ticket 与待确认注册一并作废）。
        - 401 invalid_factor：验证码错误、该时间步的验证码已被使用，或已被限流。
        - 503 factor_key_unavailable：待确认注册的密文由已退役的加密 kid 保护，
          服务端读不出种子。重试无效；重新调用 POST /api/v1/auth/totp/setup 即可
          用当前 active key 重新开始绑定。该结果不消耗认证失败额度。
      operationId: confirmTotpSetup
      parameters:
        - { $ref: '#/components/parameters/SessionResponseMode' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpConfirmInput' }
      responses:
        '200':
          description: TOTP 正确，已设置 Session 和 CSRF Cookie
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/totp/login:
    post:
      tags: [User Auth/MFA]
      summary: 使用 TOTP 完成待处理登录
      description: |
        验证码在同一时间步内只能使用一次，边界按「用户 + 时间步」判定：
        刚用于 TOTP 绑定确认的验证码不能再用于这个端点，换一张新的 login ticket
        也不行。等下一个验证码重试即可，本次冲突不会作废 ticket。

        错误码：
        - 401 invalid_factor：验证码错误、该时间步的验证码已被使用，或已被限流。
        - 503 factor_key_unavailable：已注册的 TOTP 种子由已退役的加密 kid 保护，
          服务端无法解密。用户重试无效，必须由管理员调用
          DELETE /api/v1/admin/users/{user_id}/auth-factors/totp 重置因子后重新绑定。
          该结果不消耗认证失败额度，也不会把账号推向限流。
      operationId: loginTotp
      parameters:
        - { $ref: '#/components/parameters/SessionResponseMode' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpConfirmInput' }
      responses:
        '200':
          description: TOTP 正确，已设置 Session 和 CSRF Cookie
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/passkeys/register/start:
    post:
      tags: [User Auth/MFA]
      summary: 开始 passkey 注册
      operationId: startPasskeyRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginTicketInput' }
      responses:
        '200':
          description: WebAuthn 注册 challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnOptions' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/passkeys/register/finish:
    post:
      tags: [User Auth/MFA]
      summary: 完成 passkey 注册并登录
      operationId: finishPasskeyRegistration
      parameters:
        - { $ref: '#/components/parameters/SessionResponseMode' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyRegistrationInput' }
      responses:
        '200':
          description: passkey 注册成功且无需 TOTP，已设置 Session 和 CSRF Cookie
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '202':
          description: Passkey 注册验证成功，但账号已绑定 TOTP，必须继续完成验证器应用确认
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingLoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/passkeys/authentication/start:
    post:
      tags: [User Auth/MFA]
      summary: 开始 passkey 登录验证
      operationId: startPasskeyAuthentication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginTicketInput' }
      responses:
        '200':
          description: WebAuthn 登录 challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnOptions' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/passkeys/authentication/finish:
    post:
      tags: [User Auth/MFA]
      summary: 完成 passkey 登录验证
      operationId: finishPasskeyAuthentication
      parameters:
        - { $ref: '#/components/parameters/SessionResponseMode' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyAuthenticationInput' }
      responses:
        '200':
          description: Passkey 验证成功且无需 TOTP，已设置 Session 和 CSRF Cookie
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '202':
          description: Passkey 验证成功，但账号已绑定 TOTP，必须继续完成验证器应用确认
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingLoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/passkeys/discoverable/start:
    post:
      tags: [User Auth/Browser Login]
      summary: 开始无密码 Passkey 登录
      operationId: startDiscoverablePasskeyAuthentication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyObject' }
      responses:
        '200':
          description: WebAuthn discoverable challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoverablePasskeyStartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/passkeys/discoverable/finish:
    post:
      tags: [User Auth/Browser Login]
      summary: 完成无密码 Passkey 登录
      operationId: finishDiscoverablePasskeyAuthentication
      parameters:
        - { $ref: '#/components/parameters/SessionResponseMode' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscoverablePasskeyFinishInput' }
      responses:
        '200':
          description: Passkey 验证成功且无需 TOTP，已设置 Session 和 CSRF Cookie
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '202':
          description: Passkey 验证成功，但账号已绑定 TOTP，必须继续完成验证器应用确认
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingLoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/security/factors:
    get:
      tags: [User Auth/Security]
      summary: 查询当前用户认证因素概览
      operationId: getCurrentUserFactorSummary
      description: |
        只统计已持久化确认的因素。Redis 中待确认的 TOTP 种子或 Passkey challenge
        不会出现在 `available_methods`，也不会改变后续登录策略。
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 当前用户因素概览
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FactorSummaryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/security/totp/enrollment/start:
    post:
      tags: [User Auth/Security]
      summary: 使用当前 Session 开始 TOTP 注册
      operationId: startCurrentUserTotpEnrollment
      description: |
        创建约五分钟有效、绑定当前用户、Session ID 和 session_epoch 的待确认注册。
        同一用户同一方法只允许一份 pending；并发败者返回 409，绝不覆盖已返回的种子。
        otpauth issuer 标签取自配置 Issuer 的 host，不读取请求 Host 或代理头。
        Issuer 门禁即时回读后仍不可用时返回 503 `issuer_not_configured` 或
        `issuer_runtime_invalid`，不会创建 pending enrollment。
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyObject' }
      responses:
        '200':
          description: 待确认 TOTP 注册
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionTotpStartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/security/factor/enrollment/cancel:
    post:
      tags: [User Auth/Security]
      summary: 取消当前 Session 的认证因素注册
      operationId: cancelCurrentUserFactorEnrollment
      description: 仅允许取消与当前用户、Session ID、session_epoch 和 enrollment_id 绑定的待确认注册。
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelFactorEnrollmentInput' }
      responses:
        '200':
          description: 注册已取消
          content:
            application/json:
              schema:
                type: object
                required: [cancelled]
                properties:
                  cancelled: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/security/totp/enrollment/confirm:
    post:
      tags: [User Auth/Security]
      summary: 确认当前 Session 的 TOTP 注册
      operationId: confirmCurrentUserTotpEnrollment
      description: |
        ownership、Session ID、session_epoch 和 enrollment_id 全部匹配后才可完成。
        成功只持久化因素，不签发或替换 Session。TOTP 已存在时拒绝；已有 Passkey 不影响注册。
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionTotpConfirmInput' }
      responses:
        '200':
          description: TOTP 已启用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FactorEnrollmentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/security/passkeys/registration/start:
    post:
      tags: [User Auth/Security]
      summary: 使用当前 Session 开始 Passkey 注册
      operationId: startCurrentUserPasskeyRegistration
      description: |
        创建绑定当前用户、Session ID 和 session_epoch 的 WebAuthn challenge。
        已有 TOTP 或其他 Passkey 不阻止新增凭据；同一用户同一方法的并发 start 不覆盖 challenge。
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyObject' }
      responses:
        '200':
          description: Passkey 注册 challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPasskeyStartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/security/passkeys/registration/finish:
    post:
      tags: [User Auth/Security]
      summary: 完成当前 Session 的 Passkey 注册
      operationId: finishCurrentUserPasskeyRegistration
      description: |
        验证 WebAuthn credential 后原子消费 ownership 匹配的 pending，并在用户 advisory
        lock 下写入凭据。保留 credential_id 全局唯一约束。成功不签发新 Session。
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionPasskeyFinishInput' }
      responses:
        '200':
          description: Passkey 已启用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FactorEnrollmentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/security/factors/totp:
    delete:
      tags: [User Auth/Security]
      summary: 移除当前用户的 TOTP 因素
      operationId: removeCurrentUserTotpFactor
      description: |
        需要当前 Session、CSRF 和请求内显式密码再认证。成功时在同一数据库事务内删除
        TOTP、推进 session_epoch、撤销全部 Session/Refresh Token 并写入 outbox；随后清空
        当前浏览器认证 Cookie。密码不可用时拒绝，管理员恢复是唯一回退。
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FactorRemovalInput' }
      responses:
        '200':
          description: TOTP 已移除，当前及其他会话均已撤销
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FactorRemovalResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/security/factors/passkey:
    delete:
      tags: [User Auth/Security]
      summary: 移除当前用户的全部 Passkey 凭据
      operationId: removeCurrentUserPasskeyFactor
      description: |
        方法级移除：删除该用户全部已注册 Passkey。需要当前 Session、CSRF 和请求内显式
        密码再认证；成功时原子推进 session_epoch、撤销全部 Session/Refresh Token 和 outbox，
        并清空当前浏览器认证 Cookie。响应 `removed` 明确给出删除凭据数。
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FactorRemovalInput' }
      responses:
        '200':
          description: 全部 Passkey 已移除，当前及其他会话均已撤销
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FactorRemovalResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/status:
    get:
      tags: [User Auth/Account]
      summary: 查询当前登录状态
      operationId: authStatus
      responses:
        '200':
          description: 登录状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthStatusResponse' }
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/email-change/start:
    post:
      tags: [User Auth/Account]
      summary: 发起邮箱变更
      operationId: startEmailChange
      description: |
        校验当前密码后创建 10 分钟邮箱变更挑战，并将验证码邮件写入 PostgreSQL
        email_outbox。邮件 outbox 对 SMTP 外部副作用采用 at-least-once（至少一次）
        语义：SMTP 调用成功但 `processed_at` 终结写入或事务提交结果不确定时，行会保留
        待重试状态，恢复后可能再次发送同一封邮件。调用方不得把 202 解读为 SMTP 已
        完成投递或最多只会收到一封邮件。
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartEmailChangeInput' }
      responses:
        '202': { description: 验证挑战和邮件 outbox 已持久化排队；SMTP 投递仍由后台 worker 异步执行，采用 at-least-once 语义, content: { application/json: { schema: { $ref: '#/components/schemas/EmailChangeStartResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/email-change/confirm:
    post:
      tags: [User Auth/Account]
      summary: 确认邮箱变更
      operationId: confirmEmailChange
      description: |
        验证码正确后更新邮箱、撤销全部登录会话，并在同一事务中排队向旧邮箱发送安全告警。
        安全告警与验证码邮件均采用 at-least-once（至少一次）投递；数据库终结写入结果不
        确定时，后续重试可能造成重复邮件，目的是避免关键安全通知永久漏发。
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmEmailChangeInput' }
      responses:
        '204': { description: 邮箱已变更并撤销全部会话 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/auth/me:
    get:
      tags: [User Auth/Account]
      summary: 查询当前用户资料
      operationId: currentUserProfile
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 当前用户资料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserMeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [User Auth/Account]
      summary: 更新当前用户资料
      operationId: updateCurrentUserProfile
      description: |
        普通资料修改按低风险写操作处理：Session 与 CSRF 只在请求入口校验，不在资料落库前二次锁定 Session 行。
        该策略不适用于钱包扣款、兑换或权益授予等资产/权益操作。
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileInput' }
      responses:
        '200':
          description: 更新后的用户资料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserMeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/me/avatar:
    get:
      tags: [User Auth/Account]
      operationId: getCurrentUserAvatar
      summary: 获取本人头像字节
      description: 按会话返回本人头像。响应为 image/jpeg，Cache-Control 为 private。
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 头像字节
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 未设置头像 }
    put:
      tags: [User Auth/Account]
      operationId: uploadCurrentUserAvatar
      summary: 上传或替换本人头像
      description: >
        请求体为原始图片字节（PNG / JPEG / WebP，上限 5 MiB，最短边 250 像素）。
        格式按字节魔数判定，不读 Content-Type。服务端一律重编码为 256x256 JPEG 后落库。
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          image/png:  { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: 更新后的用户资料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserMeResponse' }
        '400': { description: avatar_empty / avatar_too_small / avatar_unsupported_format / avatar_undecodable / csrf_invalid }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: 请求体超过 5 MiB }
    delete:
      tags: [User Auth/Account]
      operationId: deleteCurrentUserAvatar
      summary: 移除本人头像
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '200':
          description: 更新后的用户资料（avatar_updated_at 为 null）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserMeResponse' }
        '400': { description: csrf_invalid }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/password:
    post:
      tags: [User Auth/Account]
      summary: 修改当前用户密码
      operationId: changeCurrentUserPassword
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordInput' }
      responses:
        '204': { description: 密码已修改并撤销所有用户 Session }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/entitlements:
    get:
      tags: [User Entitlements]
      summary: 查询当前用户套餐与权益用量
      operationId: currentUserEntitlements
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: |
            当前生效套餐摘要与各权益用量；limit 为 null 表示无限，缺失表示数值无上限概念。
            没有生效套餐时返回 `{"plan": null, "entitlements": []}`，表示平台未开放自助接入，是合法状态而非错误。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/wallet:
    get:
      tags: [User Wallet]
      summary: 查询当前用户辰星点余额
      operationId: getWallet
      description: 钱包按需创建。从未入账的用户返回 balance=0，不插入 user_wallets 行。
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 当前余额；currency 固定为 points
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletBalance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/wallet/ledger:
    get:
      tags: [User Wallet]
      summary: 查询当前用户钱包流水
      operationId: listWalletLedger
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 按创建时间倒序的钱包流水
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedWalletLedger' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/plans/catalog:
    get:
      tags: [User Wallet]
      summary: 查询可展示的套餐目录
      operationId: listPlanCatalog
      description: 返回全部 active 套餐，含 price_points=0（仅管理员分配）的档位。
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: active 套餐目录
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlanCatalogItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/wallet/purchase:
    post:
      tags: [User Wallet]
      summary: 用辰星点购买套餐
      operationId: purchasePlan
      description: |
        同一事务内锁定钱包与套餐：active 且 price_points>0 才可购买。
        扣款和授予套餐前会在用户代际锁下二次复核入口捕获的精确 Session ID、token 摘要、
        credential generation、绝对/空闲有效期及账号 active 状态；复核失败则事务整体回滚。
        Session 被撤销、过期或代际变化返回 401 invalid_session；账号被禁用返回 401 user_disabled。
        余额不足返回 400 insufficient_balance；归档或定价为 0 返回 400 plan_not_purchasable。
        购买替换用户当前套餐。one_time 永久有效；monthly 为 now+30 天；yearly 为 now+365 天。
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - { $ref: '#/components/parameters/WalletPurchaseIdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchasePlanInput' }
      responses:
        '200':
          description: 购买成功，返回扣款后余额与新套餐
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchasePlanResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/wallet/redeem:
    post:
      tags: [User Wallet]
      summary: 兑换辰星点兑换卡
      operationId: redeemWalletCode
      description: |
        兑换入账和消耗兑换码前会在同一事务二次复核入口捕获的精确 Session 与账号 active 状态。
        Session 被撤销、过期或代际变化返回 401 invalid_session；账号被禁用返回 401 user_disabled，
        两种情况都不会入账、增加使用次数或写入成功审计。
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RedeemCodeInput' } }
      responses:
        '200': { description: 兑换成功, content: { application/json: { schema: { $ref: '#/components/schemas/RedeemCodeResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/quota-addons/catalog:
    get:
      tags: [User Wallet]
      summary: 查询当前套餐增量包目录
      operationId: listQuotaAddonCatalog
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: 可购买的增量包, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/QuotaAddon' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/quota-addons/purchase:
    post:
      tags: [User Wallet]
      summary: 购买授权额度增量包
      operationId: purchaseQuotaAddon
      description: |
        扣款和授予增量权益前会在同一事务二次复核入口捕获的精确 Session 与账号 active 状态。
        Session 被撤销、过期或代际变化返回 401 invalid_session；账号被禁用返回 401 user_disabled，
        两种情况都整体回滚。
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - { $ref: '#/components/parameters/WalletPurchaseIdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseQuotaAddonInput' } } }
      responses:
        '200': { description: 购买成功, content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseQuotaAddonResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/sessions:
    get:
      tags: [User Auth/Sessions]
      summary: 查询当前用户 Session
      operationId: listUserSessions
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 当前用户的活跃 Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/security-events:
    get:
      tags: [User Auth/Security Events]
      summary: 查询当前用户安全事件
      operationId: listCurrentUserSecurityEvents
      description: 仅查询 actor_user_id 为当前用户的热表与归档审计事件，并只返回非敏感白名单字段；每个事件携带服务端分级的 category 与 severity。
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 按创建时间倒序排列的当前用户安全事件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedSecurityEvents' }
        '400': { $ref: '#/components/responses/InvalidPagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/auth/security-events/{event_id}:
    get:
      tags: [User Auth/Security Events]
      summary: 查询当前用户单个安全事件详情
      operationId: getCurrentUserSecurityEvent
      description: |
        事件不存在或不属于当前用户时一律 404，不区分「查不到」与「不是你的」。
        ip / ip_location / user_agent / ray_id 只从 metadata 白名单提取，不透出
        metadata 原文；ip_location 与 ray_id 暂无数据来源，恒为 null。client 仅
        OAuth 相关事件填充，Client 已删除时为 null。
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: event_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: 单个安全事件详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityEventDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/auth/sessions/{session_id}:
    delete:
      tags: [User Auth/Sessions]
      summary: 撤销指定用户 Session
      operationId: revokeUserSession
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204': { description: Session 已撤销 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/auth/oauth-clients:
    get:
      tags: [User Auth/OAuth Clients]
      summary: 查询当前用户的 OAuth 项目
      operationId: listOwnedOAuthClients
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: limit, in: query, required: false, description: 每页条数，默认 200，最大 200, schema: { type: integer, format: int32, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, required: false, description: 跳过条数，默认 0, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '200':
          description: |
            只包含当前用户拥有的 OAuth 项目和配额使用量。
            没有生效套餐时照常列出既有项目，配额上限为 null，不会因此返回错误。
            超出 200 条的项目通过 limit/offset 分页获取。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnedOAuthClientList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [User Auth/OAuth Clients]
      summary: 创建当前用户的 OAuth 项目
      operationId: createOwnedOAuthClient
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '201':
          description: 创建成功，Client Secret 只返回一次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredOwnedOAuthClient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 调用者没有生效套餐（未挂载套餐且系统无 active 默认套餐），错误码 self_service_disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/authorized-apps:
    get:
      tags: [User Auth/Authorized Apps]
      summary: 查询当前用户已授权的 OAuth 应用
      operationId: listAuthorizedApps
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 当前用户授权记录的非敏感摘要，不包含 Secret、哈希、重定向地址或 Token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizedOAuthAppList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/authorized-apps/{client_id}:
    delete:
      tags: [User Auth/Authorized Apps]
      summary: 撤销当前用户对 OAuth 应用的授权
      operationId: revokeAuthorizedApp
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: client_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204': { description: 撤销成功或授权不存在，操作幂等 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/oauth-clients/{client_id}:
    put:
      tags: [User Auth/OAuth Clients]
      summary: 更新当前用户拥有的 OAuth 项目
      operationId: updateOwnedOAuthClient
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: client_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '204': { description: 更新成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/auth/oauth-clients/{client_id}/disable:
    post:
      tags: [User Auth/OAuth Clients]
      summary: 禁用当前用户拥有的 OAuth 项目
      operationId: disableOwnedOAuthClient
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: client_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204': { description: 禁用成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/auth/oauth-clients/{client_id}/enable:
    post:
      tags: [User Auth/OAuth Clients]
      summary: 启用当前用户拥有的 OAuth 项目
      operationId: enableOwnedOAuthClient
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: client_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204': { description: 启用成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/auth/oauth-clients/{client_id}/rotate-secret:
    post:
      tags: [User Auth/OAuth Clients]
      summary: 轮换当前用户 OAuth 项目的 Secret
      operationId: rotateOwnedOAuthClientSecret
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: client_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
        - { $ref: '#/components/parameters/IdempotencyKeyHeader' }
      responses:
        '200':
          description: 新 Secret，只返回一次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientSecretResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/session:
    delete:
      tags: [User Auth/Sessions]
      summary: 注销当前 Session
      operationId: revokeSession
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: 注销成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/external-identities:
    get:
      tags: [User Auth/Security]
      summary: 查询当前用户已绑定的外部身份
      operationId: listLinkedExternalIdentities
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 当前 Session 所属用户已绑定的外部 OAuth 身份；外部身份不属于 TOTP 或 Passkey 因子。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalIdentityListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/external-identities/{slug}/bind:
    post:
      tags: [User Auth/Security]
      summary: 发起当前用户的外部身份绑定
      operationId: startExternalIdentityBinding
      security: [{ sessionCookie: [] }]
      description: >-
        必须同时携带有效 Session Cookie、CSRF Cookie 和 X-CSRF-Token。服务端创建独立的一次性 binding state，
        将 purpose、用户 ID、Session ID 和 session_epoch 与 PKCE verifier 一起保存在 Redis；该流程不会调用
        自动建号逻辑，也不会按 email 自动关联用户。
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '200':
          description: >-
            已创建独立的一次性 binding state、PKCE verifier 及安全 state Cookie；响应返回外部 OAuth
            授权 URL，浏览器必须在读取同源 JSON 后自行导航到该 URL。
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExternalIdentityBindingStartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/external/{slug}/bind/callback:
    get:
      tags: [User Auth/Security]
      summary: 完成外部身份绑定回调
      operationId: externalIdentityBindingCallback
      security: [{ sessionCookie: [] }]
      description: >-
        消费仅一次的 binding state、校验 state Cookie、回调路径 provider slug、purpose 和 PKCE，并要求回调时仍为同一用户、同一 Session、同一 session_epoch。
        slug 或 purpose 不匹配不会消费有效 state；成功消费后重放一律失败。UserInfo 的 subject 已被其他用户占用时返回 409；本回调绝不自动创建用户，也绝不按 email 自动关联。
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302': { description: 绑定成功后重定向到安全设置页, headers: { Set-Cookie: { $ref: '#/components/headers/SetCookie' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/external-identities/{slug}:
    delete:
      tags: [User Auth/Security]
      summary: 解除当前用户的外部身份绑定
      operationId: unlinkExternalIdentity
      security: [{ sessionCookie: [] }]
      description: >-
        必须通过 Session Cookie、CSRF Cookie、X-CSRF-Token 及当前密码复验。仅 TOTP 不是独立登录凭据：密码登录已禁用且没有 Passkey 时，不能解除最后一个外部身份，返回 409 oauth_last_login_credential。操作在同一事务内检查凭据并删除身份，成功解绑不会改变当前 session_epoch，竞态导致 epoch 变更时返回 401。成功后记录 external_identity_unlink 审计事件。
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalIdentityUnlinkInput' }
      responses:
        '204': { description: 已解除绑定 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/external-providers:
    get:
      tags: [User Auth/Browser Login]
      summary: 查询公开的外部登录提供商
      operationId: listPublicExternalProviders
      description: Runtime 为 AwaitingIssuer 时先回读 PostgreSQL；合法持久化 Issuer 会应用到当前请求并继续。数据库确实无记录时返回内部 `ErrorResponse` 信封的 503 `issuer_not_configured`；空值/无效值、读取失败、Runtime Pending/Invalid 或事实无法一致应用时返回 503 `issuer_runtime_invalid`，且不暴露外部登录配置。
      responses:
        '200':
          description: 当前启用的外部登录提供商，仅包含登录页所需的公开信息
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicExternalProvider' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/registration-status:
    get:
      tags: [User Auth/Account]
      summary: 查询公开注册状态
      description: |
        匿名端点，无鉴权。`enabled` 是有效值：存储开关 AND Issuer 就绪；
        Issuer 未配置或设置不可读时一律报关（fail-closed）。
        `email_verification_required` 与 `invitation_code_required` 是存储值。
      operationId: getRegistrationStatus
      responses:
        '200':
          description: 当前公开注册状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationStatusResponse' }
  /auth/external/{slug}:
    get:
      tags: [User Auth/Browser Login]
      summary: 开始自定义外部 OAuth 登录
      description: >-
        自定义提供商按 OAuth 2.0 授权码流程 + UserInfo 信任模型接入，本平台在这一侧不是 OIDC 依赖方。
        scopes 可包含 openid（多数 OIDC 提供商需要它才开放 UserInfo），但它只用于换取可调用 UserInfo 的
        access token，不代表本平台执行了 OIDC 身份断言校验。Runtime 为 AwaitingIssuer 时先回读 PostgreSQL；合法持久化
        Issuer 会应用到当前请求并继续。数据库确实无记录时返回内部 `ErrorResponse` 信封的 503 `issuer_not_configured`；
        空值/无效值、读取失败、Runtime Pending/Invalid 或事实无法一致应用时返回 503 `issuer_runtime_invalid`。
      operationId: startExternalOAuthLogin
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: request_id, in: query, schema: { type: string } }
      responses:
        '302': { description: 重定向到外部授权端点, headers: { Set-Cookie: { $ref: '#/components/headers/SetCookie' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/external/{slug}/callback:
    get:
      tags: [User Auth/Browser Login]
      summary: 自定义外部 OAuth 回调
      description: >-
        身份字段只来自用 access token 经 TLS 调用 userinfo_endpoint 得到的 JSON：sub、email、email_verified
        全部按 provider 配置的 claim 路径从该响应读取。令牌响应中的 id_token 不被解析、不被存储、不参与身份判定
        （本平台不为自定义提供商保存 issuer、JWKS、允许算法或 nonce 策略，不具备验证它的条件）。只返回 id_token
        而没有 access_token 的令牌响应按失败处理，回跳 external_error=oauth_login_failed。email_verified 的
        可信度上限就是外部 UserInfo 响应本身。首次自动建号在同一数据库事务内执行普通注册共用的邮箱域名/别名策略，
        策略拒绝时不留下 user 或 identity 半成品并回跳 oauth_login_failed；既有绑定登录不重新应用注册策略。
        Runtime 为 AwaitingIssuer 时先回读 PostgreSQL；合法持久化 Issuer 会应用到
        当前请求并继续。数据库确实无记录时返回内部 `ErrorResponse` 信封的 503 `issuer_not_configured`；空值/无效值、
        读取失败、Runtime Pending/Invalid 或事实无法一致应用时返回 503 `issuer_runtime_invalid`。
      operationId: externalOAuthCallback
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302': { description: 登录成功或失败后的页面重定向, headers: { Set-Cookie: { $ref: '#/components/headers/SetCookie' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /oauth/authorize:
    get:
      tags: [OAuth/OIDC]
      summary: OAuth 授权码入口
      operationId: authorize
      security: [{ sessionCookie: [] }, { chenxingSession: [] }, {}]
      description: |
        未登录浏览器请求仅在 client、redirect_uri、scope、state 和 PKCE 完整校验后创建 pending。
        X-Chenxing-Session 仅在 OAUTH_SESSION_HEADER_ENABLED=true 的开发兼容配置中接受，不能绕过 Session 绑定、CSRF 或 consent。
        Client 已加载且 redirect_uri canonicalize 后仍严格匹配注册值时，后续参数校验或依赖错误通过 302
        回调该 canonical redirect_uri，并携带 RFC 6749 `error` / `error_description`；仅非空且不超过 512
        个字符的 state 会被回显。注册匹配允许默认端口消除、根斜杠补全和 RFC 8252 loopback 字面 IP
        的动态端口例外；授权码仍绑定请求提交的原始 redirect_uri 文本，Token 兑换必须原样回送。
        Client 或 redirect_uri 不可信时绝不重定向，改用 RFC 6749 JSON 错误信封。
        Runtime 为 AwaitingIssuer 时门禁先回读 PostgreSQL，合法持久化 Issuer 会应用到当前请求并继续。无记录、空值/无效值、
        数据库读取失败、Runtime Pending/Invalid 或事实无法一致应用，以及请求超时时，统一返回 RFC 6749 JSON 信封的
        503 `temporarily_unavailable`。此时尚无可用的 redirect_uri 上下文做错误重定向，
        不会返回内部 API 的 `{code, message}` 或 504 `request_timeout`（Issues #423、#441）。
      parameters:
        - { $ref: '#/components/parameters/ClientId' }
        - { name: redirect_uri, in: query, required: true, description: "canonicalize 后必须匹配注册值；授权码兑换时必须原样回送本次请求文本", schema: { type: string, format: uri } }
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: scope, in: query, required: true, description: "空格分隔的 scope；每个值必须同时属于服务端 OAUTH_CLIENT_ALLOWED_SCOPES allowlist（默认 openid、profile、email）和该 Client 已注册的 scope 集合", schema: { type: string, example: 'openid email profile' } }
        - { name: state, in: query, required: true, description: 最多 512 个字符, schema: { type: string, maxLength: 512 } }
        - { name: nonce, in: query, description: 最多 512 个字符, schema: { type: string, maxLength: 512 } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
      responses:
        '302': { description: 重定向到 Client 的 redirect_uri 或登录/授权确认页（跳转到 SPA 登录页或授权确认页时附带授权持有者 HttpOnly Cookie；HTTPS 名称为 __Host-chenxing_authz_holder，本地 HTTP 名称为 chenxing_authz_holder，供后续绑定端点校验；已授权直通到 redirect_uri 的分支不下发） }
        '400': { $ref: '#/components/responses/OAuthBadRequest' }
        '401': { $ref: '#/components/responses/OAuthUnauthorized' }
        '429': { $ref: '#/components/responses/OAuthTooManyRequests' }
        '503': { $ref: '#/components/responses/OAuthServiceUnavailable' }
    post:
      tags: [OAuth/OIDC]
      summary: OAuth 授权码入口（表单 POST）
      operationId: authorizePost
      security: [{ sessionCookie: [] }, { chenxingSession: [] }, {}]
      description: |
        与 GET `/oauth/authorize` 行为和安全边界相同。请求体必须使用
        `application/x-www-form-urlencoded`。Client 已加载且 canonical redirect_uri 严格匹配注册值时，
        后续参数校验或依赖错误通过 302 携带 RFC 6749 错误参数返回；不可信回调地址只返回 OAuth JSON 错误。
        state 仅在非空且不超过 512 个字符时回显。
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, redirect_uri, response_type, scope, state, code_challenge, code_challenge_method]
              properties:
                client_id: { type: string }
                redirect_uri: { type: string, format: uri, description: "canonicalize 后必须匹配注册值；授权码兑换时必须原样回送本次请求文本" }
                response_type: { type: string, enum: [code] }
                scope: { type: string, description: "空格分隔的 scope；受服务端 allowlist 和 Client 已注册 scopes 双重约束" }
                state: { type: string, maxLength: 512 }
                nonce: { type: string, maxLength: 512 }
                code_challenge: { type: string }
                code_challenge_method: { type: string, enum: [S256] }
      responses:
        '302': { description: 重定向到 Client 的 canonical registered redirect_uri 或登录/授权确认页；错误重定向携带 RFC 6749 error/error_description，并仅回显合法长度的 state }
        '400': { $ref: '#/components/responses/OAuthBadRequest' }
        '401': { $ref: '#/components/responses/OAuthUnauthorized' }
        '429': { $ref: '#/components/responses/OAuthTooManyRequests' }
        '503': { $ref: '#/components/responses/OAuthServiceUnavailable' }
  /api/v1/oauth/authorize/requests/{request_id}:
    get:
      tags: [OAuth/OIDC]
      summary: 查询绑定到当前 Session 的待授权请求
      operationId: inspectAuthorizationRequest
      security: [{ sessionCookie: [] }]
      description: |
        pending 请求绑定创建它的 `/oauth/authorize` 请求级 Issuer generation。
        Issuer 热切换后，旧 generation 或升级前缺失 generation 的请求会被丢弃并返回
        400 `authorization_request_expired`，Client 必须重新发起授权。
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 安全的授权确认数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingAuthorizationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [OAuth/OIDC]
      summary: 批准或拒绝绑定到当前 Session 的授权请求
      operationId: decideAuthorizationRequest
      security: [{ sessionCookie: [] }]
      description: |
        决策只能在 pending 创建时捕获的 Issuer generation 内完成。
        Issuer 热切换后不会把旧授权意图升级为新 Issuer 的授权码；旧 generation 或缺失
        generation 的请求会被丢弃并返回 400 `authorization_request_expired`。
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizationDecisionInput' }
      responses:
        '200':
          description: 决策结果和已校验的回调地址
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationDecisionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/oauth/authorize/requests/{request_id}/bind:
    post:
      tags: [OAuth/OIDC]
      summary: 将当前 Session 原子绑定到待授权请求
      operationId: bindAuthorizationRequest
      security: [{ sessionCookie: [] }]
      description: |
        绑定时必须同时满足：
        1. 有效的 Session Cookie（HTTPS 部署为 __Host-chenxing_session）
        2. CSRF 校验通过（HTTPS 部署为 __Host-chenxing_csrf Cookie + X-CSRF-Token 头）
        3. 授权持有者 Cookie 与 pending 记录中的摘要匹配（HTTPS 为 __Host-chenxing_authz_holder，本地 HTTP 为 chenxing_authz_holder，防御 OAuth login CSRF / 请求固定攻击 #115）

        授权持有者 Cookie 由 `/oauth/authorize` 在把浏览器交给 SPA（登录页或授权确认页）时下发；HTTPS 使用 `__Host-chenxing_authz_holder`，本地 HTTP 使用 `chenxing_authz_holder`
        （HttpOnly, SameSite=Lax, path=/），SHA-256 摘要存入 Redis 的 pending 记录。
        缺失该 Cookie 或摘要不匹配返回 403。

        升级前创建的旧 pending 记录无 holder 摘要，绑定时将被拒绝（fail-secure），用户需重新发起授权流程。

        pending 同时绑定创建它的请求级 Issuer generation。Issuer 热切换后，旧 generation 或升级前
        缺失 generation 的请求会被丢弃并返回 400 `authorization_request_expired`，Client 必须重新发起授权。

        **受控重绑（#270）**：上述校验全部通过时，无论该 pending 请求此前绑定的是哪个 Session 摘要，
        都会被重绑到调用者当前的 Session，写入走 CAS 保证原子性。
        holder Cookie 才是所有权凭据，Session 绑定是派生状态，因此重绑不放宽任何安全边界：
        没有 holder Cookie 的第三方即使持有有效 Session 也仍然被拒（403）。
        这让「会话过期后重新登录」与「切换账号继续授权」可以自愈，
        不再固定返回 401 并在登录页与授权确认页之间形成跳转循环。
        授权码在最终 approve 时按当时持有的 Session 签发。
        每次绑定或重绑都保留 Redis 请求键的原始剩余 TTL 与 expiry 索引截止时间；重复重绑不会延长
        pending 的总生命周期，临界过期请求也不会被恢复为完整配置 TTL。

        重绑会记录审计事件 `authorization_request_rebound`（resource_type `oauth_authorization`）。
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204': { description: 绑定成功、重绑成功，或同一 Session 的幂等重试 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'pending 请求正被并发修改，CAS 无法收敛（authorization_request_conflict）；重试即可', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /oauth/token:
    post:
      tags: [OAuth/OIDC]
      summary: 交换授权码或刷新 Token
      operationId: token
      description: |
        表单编码。Client 认证支持 HTTP Basic、`client_secret` 表单字段，或公开 Client 的 `none`。
        Runtime 为 AwaitingIssuer 时门禁先回读 PostgreSQL，合法持久化 Issuer 会应用到当前请求并继续。无记录、空值/无效值、
        数据库读取失败、Runtime Pending/Invalid 或事实无法一致应用，以及请求超时时统一返回 RFC 6749 信封的
        503 `temporarily_unavailable`。
        授权码交换在持久化 Refresh Token 后还会最终复核授权同意版本；该复核暂时不可用时，服务销毁未披露的
        Refresh Token，并在确认销毁后恢复授权码供重试。若无法确认销毁结果则保持授权码已消费，客户端需重新发起授权。
        两种 503 分支都会保留套餐退款台账，没有成功 TokenResponse 的失败不会永久计入日/月授权用量。
        授权码请求中的 redirect_uri 必须与创建授权码时的原始文本完全一致；canonical 等价但文本不同仍返回 invalid_grant。
        Refresh 轮换在 successor 写入后回源复核同意版本/撤销状态；拒绝或存储故障先原子回滚未披露
        successor，若 Redis 无法确认回滚状态则返回 temporarily_unavailable。所有失败分支都不返回
        Access Token、ID Token 或新 Refresh Token。
        不会返回内部 API 的 `{code, message}`
        或 504 `request_timeout`（Issues #423、#441）。
      security: [{ basicClientAuth: [] }, {}]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token 响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400': { $ref: '#/components/responses/OAuthBadRequest' }
        '401': { $ref: '#/components/responses/OAuthUnauthorized' }
        '429': { $ref: '#/components/responses/OAuthTooManyRequests' }
        '503': { $ref: '#/components/responses/OAuthServiceUnavailable' }
  /oauth/userinfo:
    get:
      tags: [OAuth/OIDC]
      summary: 获取 OIDC UserInfo
      operationId: userinfo
      description: |
        Runtime 为 AwaitingIssuer 时门禁先回读 PostgreSQL，合法持久化 Issuer 会应用到当前请求并继续。回读后仍不可用、
        OAuth 依赖暂时不可用或请求超时时，返回 RFC 6749 信封的 503 `temporarily_unavailable`，不使用内部 `{code, message}`。
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401': { $ref: '#/components/responses/OAuthUnauthorized' }
        '503': { $ref: '#/components/responses/OAuthServiceUnavailable' }
    post:
      tags: [OAuth/OIDC]
      summary: 获取 OIDC UserInfo（表单 POST）
      operationId: userinfoPost
      description: |
        Access Token 必须通过 Authorization Bearer 或表单 `access_token` 二选一提交；
        同时使用两种方式返回 400 `invalid_request`。Issuer 或依赖不可用时保持
        RFC 6749 信封的 503 `temporarily_unavailable`。
      security: [{ bearerAuth: [] }, {}]
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/UserInfoPostRequest' }
      responses:
        '200':
          description: 用户信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserInfo' }
        '400': { $ref: '#/components/responses/OAuthBadRequest' }
        '401': { $ref: '#/components/responses/OAuthUnauthorized' }
        '503': { $ref: '#/components/responses/OAuthServiceUnavailable' }
  /oauth/revoke:
    post:
      tags: [OAuth/OIDC]
      summary: 撤销 Token
      operationId: revokeToken
      description: |
        Client 认证支持 HTTP Basic、表单 `client_id` + `client_secret`
        (`client_secret_post`)，或公开 Client 只提交 `client_id` 的 `none`；认证方式
        不得混用。`token` 与可选 `token_type_hint` 同样使用表单编码。
        Runtime 为 AwaitingIssuer 时门禁先回读 PostgreSQL，合法持久化 Issuer 会应用到当前请求并继续。回读后仍不可用、
        OAuth 依赖暂时不可用或请求超时时，返回 RFC 6749 信封的 503 `temporarily_unavailable`，不使用内部 `{code, message}`。
      security: [{ basicClientAuth: [] }, {}]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/RevocationRequest' }
      responses:
        '200': { description: 撤销完成，无响应体 }
        '400': { $ref: '#/components/responses/OAuthBadRequest' }
        '401': { $ref: '#/components/responses/OAuthUnauthorized' }
        '503': { $ref: '#/components/responses/OAuthServiceUnavailable' }
  /api/v1/admin/bootstrap:
    post:
      tags: [Admin Auth]
      summary: 初始化首个 Owner 用户
      description: |
        Owner 尚未初始化时允许匿名创建首个 Owner（数据库 ID=1），无论 Issuer 是否已配置；
        该初始化入口是保护模式的唯一用户创建例外。按可信源 IP 限制为每分钟 5 次，
        缺少可信源地址时遵循服务端 missing_source_ip_policy，限流依赖不可用时 fail closed。
      operationId: bootstrapAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BootstrapOwnerInput' }
      responses:
        '201':
          description: 初始化成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapOwnerResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/admin/bootstrap/status:
    get:
      tags: [Admin Auth]
      summary: 查询未初始化状态
      description: |
        Owner 未初始化时返回 initialized=false，供前端显示初始化界面。
        实例已有 Owner 后返回与未知路径一致的 404，不向匿名调用者确认初始化状态，
        也不区分 Issuer 收敛异常。响应不含 generation、phase、issuer_persisted/persisted。
        Issuer 诊断见 GET /api/v1/admin/settings/issuer。
      operationId: adminBootstrapStatus
      responses:
        '200':
          description: 未初始化，返回 initialized=false
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapStatusResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
  /api/v1/admin/auth/me:
    get:
      tags: [Admin Auth]
      summary: 查询当前管理身份和权限
      description: ADMIN_TOKEN 未配置时整个管理面关闭，本端点对所有调用者返回 403 admin_disabled，不进入身份探测。
      operationId: adminMe
      security:
        - adminBearer: []
        - sessionCookie: []
      responses:
        '200':
          description: 管理身份摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/users:
    get:
      tags: [Admin Users]
      summary: 用户列表
      description: 返回用户数组。服务端强制分页上限，超出范围的 limit 会被 clamp 到 [1, 200]；需要完整分页信封时使用 /api/v1/admin/users/query。
      operationId: listUsers
      security:
        - adminBearer: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: 返回条数，默认 50；超出 [1, 200] 时自动 clamp。
          schema: { type: integer, format: int64, default: 50 }
        - name: offset
          in: query
          required: false
          description: 跳过条数，默认 0；负值按 0 处理。
          schema: { type: integer, format: int64, default: 0 }
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PublicUser' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Admin Users]
      summary: 创建用户
      description: |
        管理员创建任意角色和初始状态的用户，是 POST /api/v1/admin/admins 的一般化。
        响应只包含公开用户字段，永不返回口令、口令哈希或任何凭据材料。
        Issuer 缺少时所有管理用户创建接口关闭并返回 503 `issuer_not_configured`；首 Owner 只能通过 bootstrap 初始化。

        权限：`manage_users` 为基线；`role` 为 admin 或 owner 时所需权限抬升为 `manage_roles`。
        浏览器 Session 写操作必须同时携带 HttpOnly Session Cookie、CSRF Cookie 和 X-CSRF-Token。

        错误码：
        - 400：invalid_role、invalid_status、invalid_username、invalid_email、password_too_short、password_too_long、display_name_too_long、email_domain_not_allowed、csrf_invalid
        - 403：admin_forbidden
        - 409：username_already_registered、email_already_registered、owner_bootstrap_required
      operationId: createUser
      security:
        - adminBearer: []
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserInput' }
      responses:
        '201':
          description: 创建成功，返回公开用户字段（不含凭据材料）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
  /api/v1/admin/users/{user_id}/{status}:
    post:
      tags: [Admin Users]
      summary: 设置用户状态
      description: 基线权限为 manage_users；目标用户为 Owner 时额外要求 manage_roles。权限检查先于资源查询，低权限调用者不能据响应枚举用户或 Owner 身份。非法状态返回 400 invalid_status，不存在用户返回 404 user_not_found。管理员不能修改自己的状态，自我操作返回 403 self_status_change_forbidden。
      operationId: setUserStatus
      security:
        - adminBearer: []
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: status, in: path, required: true, schema: { type: string, example: disabled } }
      responses:
        '204': { description: 更新成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/users/{user_id}/role:
    post:
      tags: [Admin Users]
      summary: 修改用户角色
      operationId: setUserRole
      security:
        - adminBearer: []
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [user, admin, owner] }
      responses:
        '204': { description: 更新成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/InvalidJsonData' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/users/{user_id}/auth-factors:
    get:
      tags: [Admin Auth Factors]
      summary: 查看账号的认证因子状态
      description: |
        返回该账号已注册的因子方法，以及 TOTP 密文相对当前 `AUTH_ENCRYPTION_KEYS` 的可读状态。

        `totp.key_state` 的四个取值：
        - `current`：由当前 active kid 加密。
        - `rotatable`：由密钥环内的非 active key 加密，下次成功验证时自动迁移。
        - `legacy`：无 kid 的历史信封，可读，需要迁移。
        - `unavailable`：密文引用的 kid 已不在密钥环内，**账号无法通过 TOTP 登录**，
          需要调用 DELETE /api/v1/admin/users/{user_id}/auth-factors/totp 重置。

        响应只包含状态名，永不返回 kid、密文或 TOTP 种子。

        权限：`manage_users`。
      operationId: adminUserAuthFactors
      security:
        - adminBearer: []
        - sessionCookie: []
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: 账号因子状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountFactorStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/users/{user_id}/auth-factors/totp:
    delete:
      tags: [Admin Auth Factors]
      summary: 重置账号的 TOTP 因子
      description: |
        删除该账号的 TOTP 因子并撤销它的全部会话。账号回到「无因子」状态，
        下次密码登录直接签发普通 Session，用户可从已认证安全 API 重新绑定 TOTP。

        这是加密 kid 退役后唯一的恢复路径：种子已经无法解密，也就无法迁移，
        只能丢弃不可读的密文。响应中的 `previous_key_state` 说明这次重置救的是
        一个被锁死的账号（`unavailable`）还是移除了一个健康的因子。

        权限：Owner 专属的 `manage_auth_factors`，**不是** `manage_users`。
        重置因子把账号降级为「只有密码」，属于账号接管链条的一环，因此与普通
        用户管理分权。浏览器 Session 写操作必须同时携带 HttpOnly Session Cookie、
        CSRF Cookie 和 X-CSRF-Token。

        错误码：
        - 400：csrf_invalid
        - 403：admin_forbidden
        - 404：user_not_found、totp_factor_not_found
      operationId: adminResetUserTotpFactor
      security:
        - adminBearer: []
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: 已删除 TOTP 因子并撤销该账号的全部会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpFactorResetResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/users/{user_id}/auth-factors/passkey:
    delete:
      tags: [Admin Auth Factors]
      summary: 重置账号的全部 Passkey 凭据
      description: |
        删除该账号的全部 Passkey 凭据并撤销它的全部会话与已签发 Refresh Token。
        Passkey-only 账号回到「无因子」状态，下次密码登录直接签发普通 Session，
        用户可从已认证安全 API 重新绑定。仍绑定 TOTP 的账号继续要求 TOTP。

        这是 Passkey-only 账号丢失全部认证器后的受控恢复路径。末位 Owner 丢失
        全部 Passkey 时无法签发新的管理 Session：必须使用系统 `ADMIN_TOKEN`
        Bearer 通道。该通道不依赖现有 Passkey 或用户 Session，避免形成闭环。

        权限：Owner 专属的 `manage_auth_factors`，**不是** `manage_users`。
        系统 `ADMIN_TOKEN` 权限等价于 Owner，无用户 ID，豁免浏览器 CSRF。
        浏览器 Session 写操作必须同时携带 HttpOnly Session Cookie、CSRF Cookie
        和 X-CSRF-Token。

        响应只包含删除条数，永不返回 credential_id、公钥或 counter。

        错误码：
        - 400：csrf_invalid
        - 403：admin_forbidden
        - 404：user_not_found、passkey_factor_not_found
      operationId: adminResetUserPasskeyFactor
      security:
        - adminBearer: []
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: 已删除全部 Passkey 凭据并撤销该账号的全部会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasskeyFactorResetResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/auth-factors/key-health:
    get:
      tags: [Admin Auth Factors]
      summary: 因子加密密钥健康度
      description: |
        统计 TOTP 密文相对当前 `AUTH_ENCRYPTION_KEYS` 的分布。
        **从 `AUTH_ENCRYPTION_KEYS` 移除旧 key 之前必须先看这个端点**：

        - `unavailable > 0`：已经有账号读不出种子，处于锁死状态。
        - `rotatable > 0`：仍有账号依赖非 active key，此刻退役该 key 会制造新的锁死账号。
        - `legacy > 0`：仍有无 kid 的历史信封等待迁移。

        单次扫描上限 10000 条；`truncated` 为真时统计只覆盖前 `scanned` 条。
        响应只包含计数，不返回 kid 列表或密钥环结构。

        权限：Owner 专属的 `rotate_keys`。
      operationId: adminAuthFactorKeyHealth
      security:
        - adminBearer: []
        - sessionCookie: []
      responses:
        '200':
          description: 密文按可读状态的分布计数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthFactorKeyHealthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/admin/users/{user_id}/plan:
