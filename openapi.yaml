  /api/v1/admin/oauth/providers:
    get:
      tags: [Admin OAuth Providers]
      summary: 自定义 OAuth 提供商列表
      operationId: listOAuthProviders
      security: [{ sessionCookie: [] }, { adminBearer: [] }]
      responses:
        '200':
          description: 提供商摘要，不包含 Client Secret；trust_model 恒为 oauth2_userinfo
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OAuthProviderSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin OAuth Providers]
      summary: 创建自定义 OAuth 提供商
      description: >-
        提供商一律按 OAuth 2.0 + UserInfo 信任模型接入（trust_model = oauth2_userinfo）：不接受 issuer、
        jwks_uri、允许算法或 nonce 策略配置，服务端也不验证 ID Token。三个远程端点必须使用 HTTPS，IP 字面量和
        连接时 DNS 解析结果都必须是公网可路由地址；IPv6 只放行 2000::/3 全局单播中未被 IANA 特殊用途占用的部分，
        站点本地 fec0::/10、文档与保留前缀以及未分配空间一律拒绝。仅 localhost/回环地址保留本机开发例外。
        provider 专用 HTTP 客户端显式禁用系统代理，HTTP_PROXY/HTTPS_PROXY/ALL_PROXY 不生效。
      operationId: createOAuthProvider
      security: [{ sessionCookie: [] }, { adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthProviderCreateInput' }
      responses:
        '201':
          description: 创建成功，提供商默认停用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthProviderSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/oauth/providers/{slug}:
    put:
      tags: [Admin OAuth Providers]
      summary: 更新自定义 OAuth 提供商
      description: 更新时重新执行端点 scheme、IP 地址空间和连接时 DNS 解析边界校验；省略 Client Secret 时保留原值。
      operationId: updateOAuthProvider
      security: [{ sessionCookie: [] }, { adminBearer: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthProviderUpdateInput' }
      responses:
        '204': { description: 更新成功，省略 Client Secret 时保留原值 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
