        points: { type: integer, format: int64, minimum: 1 }
        max_uses: { type: integer, format: int32, minimum: 1 }
        use_count: { type: integer, format: int32, minimum: 0 }
        expires_at: { type: string, format: date-time, nullable: true }
        disabled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    CreatedWalletRedemptionCard:
      allOf:
        - $ref: '#/components/schemas/WalletRedemptionCard'
        - type: object
          required: [code]
          properties:
            code: { type: string, format: password, description: 明文兑换码仅返回一次 }
    WalletRedemptionCardDetail:
      allOf:
        - $ref: '#/components/schemas/WalletRedemptionCard'
        - type: object
          required: [uses]
          properties:
            uses:
              type: array
              items:
                type: object
                required: [user_id, username, points, redeemed_at]
                properties:
                  user_id: { type: integer, format: int64, minimum: 1 }
                  username: { type: string }
                  display_name: { type: string, nullable: true }
                  points: { type: integer, format: int64, minimum: 1 }
                  redeemed_at: { type: string, format: date-time }
    CreateWalletRedemptionCardsInput:
      type: object
      required: [count, points, max_uses]
      properties:
        count: { type: integer, format: int32, minimum: 1, maximum: 100 }
        points: { type: integer, format: int64, minimum: 1 }
        max_uses: { type: integer, format: int32, minimum: 1, maximum: 10000 }
        expires_at: { type: string, format: date-time, nullable: true }
        label: { type: string, nullable: true, maxLength: 128 }
    WalletBalance:
      type: object
      required: [balance, currency]
      properties:
        balance: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, enum: [points] }
    WalletLedgerEntry:
      type: object
      required: [id, amount, balance_after, kind, created_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        amount: { type: integer, format: int64, description: 正数为入账，负数为扣款；不可为 0 }
        balance_after: { type: integer, format: int64, minimum: 0 }
        kind: { type: string, enum: [credit, purchase, adjust] }
        note: { type: string, nullable: true, maxLength: 256 }
        reference_type: { type: string, nullable: true }
        reference_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    PagedWalletLedger:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WalletLedgerEntry' } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    PurchasePlanInput:
      type: object
      required: [plan_id]
      properties:
        plan_id: { type: integer, format: int64, minimum: 1 }
    PurchasePlanResponse:
      type: object
      required: [balance, plan_id, plan_expires_at]
      properties:
        balance: { type: integer, format: int64, minimum: 0 }
        plan_id: { type: integer, format: int64, minimum: 1 }
        plan_expires_at: { type: string, format: date-time, nullable: true, description: null 表示 one_time 永久有效 }
    CreditWalletInput:
      type: object
      required: [amount]
      properties:
        amount: { type: integer, format: int64, minimum: 1, maximum: 1000000000 }
        note: { type: string, nullable: true, maxLength: 256 }
    CreditWalletResponse:
      type: object
      required: [user_id, balance]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        balance: { type: integer, format: int64, minimum: 0 }
    AssignPlanInput:
      type: object
      required: [plan_id]
      properties:
        plan_id: { type: integer, format: int64, minimum: 1 }
        expires_at: { type: string, format: date-time, nullable: true, description: null 表示永久有效；也接受 time crate 的 tuple 数组形式 }
    EntitlementsResponse:
      type: object
      required: [entitlements]
      properties:
        plan:
          type: object
          nullable: true
          description: 当前生效套餐；null 表示该账号没有生效套餐（平台未开放自助接入），此时 entitlements 为空数组
          required: [code, name, validity]
          properties:
            code: { type: string }
            name: { type: string }
            description: { type: string, nullable: true }
            validity: { type: string, description: permanent 或 RFC3339 到期时间 }
        entitlements:
          type: array
          items:
            type: object
            required: [key, label, used]
            properties:
              key: { type: string }
              label: { type: string }
              used: { type: integer, format: int64, minimum: 0 }
              limit: { type: integer, format: int64, nullable: true, description: 有上限时存在；null 表示无限；缺失表示无上限概念（如 QPS） }
