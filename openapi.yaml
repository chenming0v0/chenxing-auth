    post:
      tags: [Admin OAuth Providers]
      summary: 停用自定义 OAuth 提供商
      operationId: disableOAuthProvider
      security: [{ sessionCookie: [] }, { adminBearer: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204': { description: 停用成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/oauth/providers/{slug}/enable:
    post:
      tags: [Admin OAuth Providers]
      summary: 启用自定义 OAuth 提供商
      operationId: enableOAuthProvider
      description: 缺少可用 email_verified_claim 或端点不满足公网出网边界的 provider 无法启用，返回 400 invalid_oauth_provider。
      security: [{ sessionCookie: [] }, { adminBearer: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204': { description: 启用成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/settings/oauth:
    get:
      tags: [Admin OAuth Providers]
      summary: 自定义 OAuth 提供商设置页（转发到 React 控制台）
      operationId: oauthProviderSettingsPage
      responses:
        '303':
          description: 重定向到 React SPA 的 /console/settings
          headers:
            Location: { schema: { type: string } }
  /api/v1/admin/keys/rotate:
    post:
      tags: [Admin Operations]
      summary: 轮换签名密钥
      operationId: rotateSigningKey
      security: [{ sessionCookie: [] }, { adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '200':
          description: 轮换结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_id: { type: string }
                  published_key_count: { type: integer }
  /api/v1/admin/keys/{key_id}/revoke:
    post:
      tags: [Admin Operations]
      summary: 按 kid 撤销签名密钥
      operationId: revokeSigningKey
      security: [{ sessionCookie: [] }, { adminBearer: [] }]
      parameters:
        - name: key_id
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '200':
          description: 撤销结果
          content:
            application/json:
              schema:
                type: object
                required: [key_id, active_key_id, published_key_count]
                properties:
                  key_id: { type: string }
                  active_key_id: { type: string }
                  published_key_count: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    adminBearer: { type: http, scheme: bearer }
    basicClientAuth: { type: http, scheme: basic }
    sessionCookie: { type: apiKey, in: cookie, name: __Host-chenxing_session, description: HTTPS 浏览器部署使用的 host-only Session Cookie；仅 loopback HTTP 本地开发使用不带前缀的兼容名称 }
    chenxingSession: { type: apiKey, in: header, name: X-Chenxing-Session, description: 仅开发兼容配置 OAUTH_SESSION_HEADER_ENABLED=true 时可用；不能替代 pending、Session 绑定、CSRF 或 consent }
  parameters:
    ClientId: { name: client_id, in: query, required: true, schema: { type: string } }
    SessionResponseMode: { name: X-Chenxing-Session-Mode, in: header, required: false, description: 非浏览器兼容模式。仅在 SESSION_TOKEN_RESPONSE_ENABLED=true 且值为 token 时将 session_id 放入 JSON；浏览器不得发送此请求头。, schema: { type: string, enum: [token] } }
    CsrfHeader: { name: X-CSRF-Token, in: header, required: true, description: 浏览器 Session 写操作必需；ADMIN_TOKEN Bearer 请求不需要, schema: { type: string } }
    Page: { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Search: { name: search, in: query, required: false, schema: { type: string, maxLength: 128 } }
    StatusFilter: { name: status, in: query, required: false, schema: { type: string, enum: [active, disabled] } }
  headers:
    SetCookie: { description: Session、CSRF 或 pending-login Cookie, schema: { type: string } }
  responses:
    BadRequest: { description: 请求错误, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: 未认证或凭据无效, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: 无权限, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: 资源冲突（包括套餐 code 冲突、已归档套餐不能设为默认和 Passkey 禁用保护）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: 资源不存在, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    TooManyRequests: { description: 认证、OAuth 配额或 QPS 限流触发, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    ServiceUnavailable: { description: 依赖或必要能力暂不可用, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    InternalServerError: { description: 服务端内部故障, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    OAuthBadRequest: { description: OAuth 请求错误，响应遵守 RFC 6749/7009, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } } } }
    OAuthUnauthorized:
      description: OAuth 客户端或 Bearer 凭据无效
      headers:
        WWW-Authenticate: { description: RFC 6749/6750 challenge, schema: { type: string } }
      content: { application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } } }
    OAuthTooManyRequests: { description: OAuth 限流或容量保护触发, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } } } }
    OAuthServiceUnavailable: { description: OAuth 依赖暂时不可用, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthErrorResponse' } } } }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    OAuthErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string, description: RFC 6749/6750/7009 error code }
        error_description: { type: string, description: Human-readable non-sensitive description }
    HealthResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        service: { type: string, example: chenxing-auth }
    RegistrationInput:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$', description: 仅允许 ASCII 字母、数字、点号、下划线和连字符；系统保留名不可使用 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 10, maxLength: 128 }
        display_name: { type: string, nullable: true, maxLength: 128 }
    CreateUserInput:
      description: 管理侧创建用户输入。基础字段与注册一致，额外允许指定角色和初始状态。
      allOf:
        - $ref: '#/components/schemas/RegistrationInput'
        - type: object
          properties:
            role: { type: string, enum: [user, admin, owner], default: user, description: 缺省为 user；指定 admin 或 owner 时额外要求 manage_roles 权限 }
            status: { type: string, enum: [active, disabled], default: active }
    LoginInput:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, maxLength: 254, description: 用户名或邮箱；超过 254 字符按凭据错误拒绝 }
        password: { type: string, format: password, minLength: 10, maxLength: 128, description: 超过 128 字符按凭据错误拒绝，不返回独立错误码 }
        totp_code: { type: string, pattern: '^[0-9]{6}$' }
    PendingLoginResponse:
      type: object
      required: [status, methods]
      properties:
        status: { type: string, enum: [factor_setup_required, factor_required] }
        methods: { type: array, items: { type: string, enum: [totp, passkey] } }
    LoginTicketInput:
      type: object
      description: 可选的旧版请求字段。服务端只把它与 HttpOnly login ticket Cookie 做一致性校验，不能替代 Cookie 和 holder proof。
      properties:
        login_ticket: { type: string }
    TotpSetupResponse:
      type: object
      required: [secret_base32, otpauth_url]
      properties:
        secret_base32: { type: string }
        otpauth_url: { type: string, format: uri }
    TotpConfirmInput:
      allOf:
        - $ref: '#/components/schemas/LoginTicketInput'
        - type: object
          required: [code]
          properties:
            code: { type: string, pattern: '^[0-9]{6}$' }
    WebAuthnOptions:
      type: object
      description: WebAuthn options returned by webauthn-rs; pass through to navigator.credentials.
      additionalProperties: true
    PasskeyRegistrationInput:
      allOf:
        - $ref: '#/components/schemas/LoginTicketInput'
        - type: object
          required: [credential]
          properties:
            credential: { type: object, additionalProperties: true }
    PasskeyAuthenticationInput:
      allOf:
        - $ref: '#/components/schemas/LoginTicketInput'
        - type: object
          required: [credential]
          properties:
            credential: { type: object, additionalProperties: true }
    PublicUser:
      type: object
      required: [id, username, email, status, role, created_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        username: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        email: { type: string, format: email }
        display_name: { type: string, nullable: true }
        status: { type: string }
        role: { type: string, enum: [user, admin, owner] }
        created_at: { type: string, format: date-time }
    AdminUserPlan:
      type: object
      required: [id, code, name, expires_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        code: { type: string }
        name: { type: string }
        expires_at: { type: string, format: date-time, nullable: true, description: null 表示永久有效 }
    AdminUserQueryItem:
      allOf:
        - $ref: '#/components/schemas/PublicUser'
        - type: object
          required: [plan]
          properties:
            plan: { $ref: '#/components/schemas/AdminUserPlan' }
    LoginResponse:
      type: object
      required: [expires_at]
      description: 浏览器安全的登录响应。Session token 默认不出现在 JSON 中，客户端应使用 HttpOnly Cookie 并通过 auth/status 和 auth/me 确认登录状态。
      properties:
        session_id: { type: string, description: '仅在 SESSION_TOKEN_RESPONSE_ENABLED=true 且请求显式发送 X-Chenxing-Session-Mode: token 时返回；浏览器响应默认不包含此字段' }
        expires_at: { type: string, format: date-time }
    AuthStatusResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
    PublicExternalProvider:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    UserMeResponse:
      type: object
      required: [id, username, email, status, role, current_session_expires_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        username: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        email: { type: string, format: email }
        display_name: { type: string, nullable: true }
        status: { type: string }
        role: { type: string, enum: [user, admin, owner] }
        current_session_expires_at: { type: string, format: date-time }
        avatar_updated_at:
          type: string
          format: date-time
          nullable: true
          description: 头像版本时间戳；null 表示未设置头像。同时作为头像 URL 的缓存击穿参数。
    UpdateProfileInput:
      type: object
      properties:
        display_name: { type: string, nullable: true, maxLength: 128 }
    ChangePasswordInput:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 10 }
    SessionItem:
      type: object
      required: [id, created_at, expires_at, current]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }
    SessionListResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SessionItem' } }
    AuthorizedOAuthApp:
      type: object
      required: [client_id, client_name, scopes, updated_at]
      properties:
        client_id: { type: string }
        client_name: { type: string, description: OAuth 应用显示名称 }
        scopes: { type: array, items: { type: string } }
        updated_at: { type: string, format: date-time }
    AuthorizedOAuthAppList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuthorizedOAuthApp' } }
    QuotaSnapshot:
      type: object
      description: |
        用量始终来自实际计数，上限来自生效套餐。两个 limit 都可能为 null，但含义不同：
        daily_limit 为 null 表示没有生效套餐（无上限概念，平台未开放自助接入）；
        monthly_limit 为 null 表示有生效套餐但该维度不限。
      required: [daily_limit, daily_used, monthly_limit, monthly_used]
      properties:
        daily_limit: { type: integer, format: int64, minimum: 0, nullable: true, description: 当前 owner effective plan 的每日授权上限；null 表示没有生效套餐 }
        daily_used: { type: integer, format: int64 }
        monthly_limit: { type: integer, format: int64, minimum: 0, nullable: true, description: 当前 owner effective plan 的每月授权上限；null 表示该维度不限 }
        monthly_used: { type: integer, format: int64 }
    OwnedOAuthClient:
      type: object
      required: [id, client_id, client_name, redirect_uris, scopes, status, quota]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        client_id: { type: string }
        client_name: { type: string }
        redirect_uris: { type: array, items: { type: string, format: uri } }
        scopes: { type: array, items: { type: string } }
        status: { type: string, enum: [active, disabled] }
        quota: { $ref: '#/components/schemas/QuotaSnapshot' }
    OwnedOAuthClientList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OwnedOAuthClient' } }
    RegisteredOwnedOAuthClient:
      allOf:
        - $ref: '#/components/schemas/OwnedOAuthClient'
        - type: object
          required: [auth_method]
          properties:
            auth_method:
              type: string
              description: Client 认证方式；`none` 表示公开客户端（SPA/移动端），此时 client_secret 字段整体省略（Issue #66）
              enum: [client_secret_basic, client_secret_post, none]
            client_secret:
              type: string
              format: password
              description: 明文 Secret，仅创建时返回一次；公开客户端（auth_method = none）不签发 Secret，该字段整体省略
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token] }
        code: { type: string }
        redirect_uri: { type: string, format: uri }
        code_verifier: { type: string }
        refresh_token: { type: string }
        scope:
          type: string
          description: refresh_token grant 可省略；空白字符串按省略处理并保留原授权 scope，非空值只能缩小原授权范围。
        client_id: { type: string }
        client_secret: { type: string, format: password }
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, format: int64 }
        scope: { type: string }
        refresh_token: { type: string }
        id_token: { type: string, description: "JWT ID Token（scope 含 openid 时返回）" }
    IdTokenClaims:
      type: object
      description: >
        OIDC ID Token 的 JWT payload 结构（RFC 7519 + OIDC Core 1.0 §2）。
        azp 在单 audience 场景可省略（OIDC Core §2 允许），不签发也不声明。
      required: [iss, sub, aud, exp, iat]
      properties:
        iss: { type: string, format: uri, description: "令牌签发者（等于 APP_ISSUER）" }
        sub: { type: string, description: "用户主体标识符" }
        aud: { type: string, description: "接收方 client_id" }
        exp: { type: integer, format: int64, description: "过期时间（Unix 秒）" }
        iat: { type: integer, format: int64, description: "签发时间（Unix 秒）" }
        auth_time:
          type: integer
          format: int64
          description: >
            终端用户完成认证的时刻（会话建立时间，Unix 秒）。
            OIDC Core §2 定义。无会话上下文时（刷新令牌路径、降级路径）省略该键而非 null。
        nonce:
          type: string
          description: "授权请求中携带的 nonce，有值时出现在 ID Token 中（OIDC Core §3.1.3.7）"
        email:
          type: string
          format: email
          description: "scope 含 email 时签发"
        name:
          type: string
          description: "scope 含 profile 时签发（用户显示名称）"
    OpenIdConfiguration:
      type: object
      description: "OIDC Discovery 元数据（OIDC Discovery 1.0 §3）"
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - userinfo_endpoint
        - jwks_uri
        - response_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
      properties:
        issuer: { type: string, format: uri }
        authorization_endpoint: { type: string, format: uri }
        token_endpoint: { type: string, format: uri }
        userinfo_endpoint: { type: string, format: uri }
        revocation_endpoint: { type: string, format: uri }
        jwks_uri: { type: string, format: uri }
        response_types_supported: { type: array, items: { type: string } }
        subject_types_supported: { type: array, items: { type: string } }
        id_token_signing_alg_values_supported: { type: array, items: { type: string } }
        scopes_supported: { type: array, items: { type: string } }
        claims_supported:
          type: array
          items: { type: string }
          description: "支持的 ID Token Claims，含 sub、iss、aud、exp、iat、email、name、nonce、auth_time"
        code_challenge_methods_supported: { type: array, items: { type: string } }
        token_endpoint_auth_methods_supported: { type: array, items: { type: string } }
    UserInfo:
      type: object
      required: [sub]
      properties:
        sub: { type: string }
        email: { type: string, format: email }
        name: { type: string }
    PendingAuthorizationResponse:
      type: object
      required: [request_id, client_id, client_name, redirect_host, scopes, expires_in]
      properties:
        request_id: { type: string }
        client_id: { type: string }
        client_name: { type: string }
        redirect_host: { type: string }
        scopes: { type: array, items: { type: string } }
        expires_in: { type: integer, format: int64, example: 600 }
    AuthorizationDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, deny] }
    AuthorizationDecisionResponse:
      type: object
      required: [decision, redirect_to]
      properties:
        decision: { type: string, enum: [approve, deny] }
        redirect_to: { type: string, format: uri }
    AdminMeResponse:
      type: object
      required: [role, permissions, status]
      properties:
        user_id: { type: integer, format: int64, minimum: 1, nullable: true }
        username: { type: string, nullable: true }
        role: { type: string, enum: [owner, admin] }
        permissions:
          type: array
          description: |
            当前调用者的权限名。`manage_auth_factors` 与 `rotate_keys` 仅 Owner 拥有。
          items:
            type: string
            enum: [manage_users, manage_clients, rotate_keys, read_audit, manage_settings, manage_identity_providers, manage_roles, manage_auth_factors]
        status: { type: string }
    TotpFactorStatus:
      type: object
      required: [key_state, readable, updated_at]
      description: TOTP 因子相对当前密钥环的状态。不含 kid、密文和种子。
      properties:
        key_state:
          type: string
          enum: [current, rotatable, legacy, unavailable]
          description: unavailable 表示密文引用的 kid 已不在 AUTH_ENCRYPTION_KEYS 内，账号已被锁死。
        readable: { type: boolean, description: 密文是否仍可被当前密钥环解密 }
        updated_at: { type: string, format: date-time }
    AccountFactorStatusResponse:
      type: object
      required: [user_id, methods]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        methods:
          type: array
          description: 已注册的因子方法名，去重后排序。
          items: { type: string, enum: [passkey, totp] }
        totp:
          allOf: [{ $ref: '#/components/schemas/TotpFactorStatus' }]
          nullable: true
          description: 未注册 TOTP 时为 null。
    TotpFactorResetResponse:
      type: object
      required: [user_id, previous_key_state, sessions_revoked]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        previous_key_state:
          type: string
          enum: [current, rotatable, legacy, unavailable]
          description: 删除前密文的可读状态。unavailable 表示这次重置解救了一个被密钥退役锁死的账号。
        sessions_revoked: { type: boolean, description: 重置同时撤销了该账号的全部会话，固定为 true }
    AuthFactorKeyHealthResponse:
      type: object
      required: [total, scanned, current, rotatable, legacy, unavailable, truncated]
      properties:
        total: { type: integer, format: int64, description: TOTP 密文总数 }
        scanned: { type: integer, format: int64, description: 本次实际分类的条数，上限 10000 }
        current: { type: integer, format: int64, description: 由 active kid 加密 }
        rotatable: { type: integer, format: int64, description: 由密钥环内的非 active key 加密，退役该 key 会造成锁死 }
        legacy: { type: integer, format: int64, description: 无 kid 的历史信封 }
        unavailable: { type: integer, format: int64, description: kid 已不在密钥环内，这些账号当前无法通过 TOTP 登录 }
        truncated: { type: boolean, description: 密文总数超过扫描上限，统计只覆盖前 scanned 条 }
    AdminOverview:
      type: object
      required: [users, oauth_clients, administrators, audit_events]
      properties:
        users: { type: integer, format: int64 }
        oauth_clients: { type: integer, format: int64 }
        administrators: { type: integer, format: int64 }
        audit_events: { type: integer, format: int64 }
    RegistrationEmailSettingResponse:
      type: object
      required: [registration_email_from]
      properties:
        registration_email_from: { type: string, format: email, nullable: true }
    UpdateRegistrationEmailSettingInput:
      type: object
      required: [registration_email_from]
      properties:
        registration_email_from: { type: string, format: email, nullable: true }
    PagedUsers:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminUserQueryItem' } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    PagedClients:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ClientSummary' } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    PagedAudit:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    AuditEvent:
      type: object
      required: [id, actor_type, actor_id, action, resource_type, resource_id, metadata, created_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        actor_type: { type: string }
        actor_id: { type: string, nullable: true }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string, nullable: true }
        metadata: { type: object, additionalProperties: true, description: 已经过敏感字段递归脱敏的审计上下文 }
        created_at: { type: string, format: date-time }
    AdminInput:
      type: object
      required: [username, email, password, role]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 10 }
        role: { type: string, enum: [admin, owner] }
    BootstrapOwnerInput:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$' }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 10 }
    BootstrapOwnerResponse:
      type: object
      required: [id, username, email, role]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        username: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [owner] }
    BootstrapStatusResponse:
      type: object
      required: [initialized]
      properties:
        initialized: { type: boolean }
    PasskeySetting:
      type: object
      required: [enabled, rp_name, rp_id, user_verification, authenticator_attachment, allow_insecure_origin, allowed_origins]
      properties:
        enabled: { type: boolean }
        rp_name: { type: string, maxLength: 128 }
        rp_id:
          type: string
          maxLength: 253
          description: 必须是至少包含一个点号的域名；localhost 是唯一允许的单标签本机开发例外。
        user_verification: { type: string, enum: [preferred, required, discouraged] }
        authenticator_attachment: { type: string, enum: [any, platform, cross_platform] }
        allow_insecure_origin: { type: boolean }
        allowed_origins:
          type: array
          maxItems: 32
          items: { type: string, format: uri }
    EmailPolicySetting:
      type: object
      required: [whitelist_enabled, alias_restriction_enabled, allowed_domains]
      properties:
        whitelist_enabled: { type: boolean }
        alias_restriction_enabled: { type: boolean }
        allowed_domains:
          type: array
          maxItems: 128
          items: { type: string, maxLength: 253 }
    SmtpSetting:
      type: object
      required: [host, port, username, from_address, ssl_enabled, force_auth_login, password_configured]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        from_address: { type: string }
        ssl_enabled: { type: boolean }
        force_auth_login: { type: boolean }
        password_configured: { type: boolean }
    SmtpSettingUpdate:
      type: object
      required: [host, port, username, from_address, ssl_enabled, force_auth_login]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        from_address: { type: string }
        ssl_enabled: { type: boolean }
        force_auth_login: { type: boolean }
        password: { type: string, format: password, nullable: true, writeOnly: true }
    SecurityLimitsSetting:
      type: object
      description: >-
        可配置的安全阈值与 TTL。全部 13 项必填，且必须落在各自的 minimum..maximum 之间；
        越界（含 0、负数与 i64::MAX 之类的极值）会被拒绝并返回 400 invalid_security_limits，
        错误信息给出越界的字段名。阈值本身就是安全控制，因此上界与下界同样强制：例如
        account_failure_limit 填极大值等于关掉账户锁定。授权码 TTL 上限 600 秒，取自
        RFC 6749 §4.1.2 的 10 分钟建议。
      required:
        - unauthenticated_source_qps
        - authorization_code_ttl_seconds
        - pending_request_ttl_seconds
        - max_pending_requests_per_client
        - max_pending_requests_global
        - auth_failure_window_seconds
        - account_failure_limit
        - ip_failure_limit
        - totp_ticket_failure_limit
        - external_login_state_ttl_seconds
        - external_login_state_rate_window_seconds
        - external_login_state_rate_limit
        - external_login_state_max_pending
      properties:
        unauthenticated_source_qps:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 30
          description: 未认证来源在 OAuth /token 端点的 QPS 上限（次/秒）
        authorization_code_ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 600
          default: 300
          description: 授权码有效期（秒）。RFC 6749 §4.1.2 建议不超过 600
        pending_request_ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 3600
          default: 600
          description: 待决授权请求 TTL（秒），即用户停留在授权确认页的最长时间
        max_pending_requests_per_client:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000
          default: 20
          description: 单个 Client 的待决授权请求容量上限（个）
        max_pending_requests_global:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
          default: 1000
          description: 全局待决授权请求容量上限（个）
        auth_failure_window_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 86400
          default: 900
          description: 认证失败计数的滑动窗口时长（秒）
        account_failure_limit:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000
          default: 10
          description: 任意一个滑动窗口内账户维度的失败次数上限（次）
        ip_failure_limit:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000
          default: 30
          description: 单窗口内源 IP 维度的失败次数上限（次）
        totp_ticket_failure_limit:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
          default: 5
          description: 单个 TOTP 登录 ticket 允许的累计失败次数（次）
        external_login_state_ttl_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 3600
          default: 600
          description: 外部 OAuth 登录 state 有效期（秒）
        external_login_state_rate_window_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 3600
          default: 60
          description: 外部 OAuth 登录 state 的源 IP 限流窗口（秒）
        external_login_state_rate_limit:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000
          default: 30
          description: 单窗口内单个源 IP 可创建的外部登录 state 数量上限（个）
        external_login_state_max_pending:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
          default: 10000
          description: 外部 OAuth 登录 state 的全局待决容量上限（个）
    AdminSummary:
      type: object
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        username: { type: string }
        role: { type: string }
        status: { type: string }
    OAuthProviderCreateInput:
      type: object
      required: [name, slug, authorization_endpoint, token_endpoint, userinfo_endpoint, client_id, client_secret, scopes, email_verified_claim]
      properties:
        name: { type: string, maxLength: 128 }
        slug: { type: string, pattern: '^[a-z0-9_-]+$', maxLength: 64 }
        authorization_endpoint:
          type: string
          format: uri
          description: HTTPS 公网端点；IP 字面量和连接时 DNS 解析结果不得落入私网、链路本地、CGNAT、ULA 或保留地址。仅 localhost/回环地址可用于本机 HTTP 测试。
        token_endpoint:
          type: string
          format: uri
          description: HTTPS 公网端点；IP 字面量和连接时 DNS 解析结果不得落入私网、链路本地、CGNAT、ULA 或保留地址。仅 localhost/回环地址可用于本机 HTTP 测试。
        userinfo_endpoint:
          type: string
          format: uri
          description: HTTPS 公网端点；IP 字面量和连接时 DNS 解析结果不得落入私网、链路本地、CGNAT、ULA 或保留地址。仅 localhost/回环地址可用于本机 HTTP 测试。
        client_id: { type: string }
        client_secret: { type: string, format: password, writeOnly: true }
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          description: >-
            发往外部 IdP 的 scope。可包含 openid（多数 OIDC 提供商需要它才开放 UserInfo 端点），但本平台只用它
            换取可调用 UserInfo 的 access token，不会解析或验证随之返回的 id_token。
        subject_claim: { type: string, default: sub }
        email_claim: { type: string, default: email }
        name_claim: { type: string, nullable: true }
        email_verified_claim:
          type: string
          description: 指向布尔型邮箱验证状态的 claim 路径。必填：缺失、空白、非 bool 或 false 时服务端拒绝身份解析与自动建号。
        client_auth_method: { type: string, enum: [basic, request_body], default: basic }
    OAuthProviderUpdateInput:
      type: object
      required: [name, slug, authorization_endpoint, token_endpoint, userinfo_endpoint, client_id, scopes, email_verified_claim]
      description: client_secret 可省略，省略时保留原值
      properties:
        name: { type: string, maxLength: 128 }
        slug: { type: string, pattern: '^[a-z0-9_-]+$', maxLength: 64 }
        authorization_endpoint:
          type: string
          format: uri
          description: HTTPS 公网端点；IP 字面量和连接时 DNS 解析结果不得落入私网、链路本地、CGNAT、ULA 或保留地址。仅 localhost/回环地址可用于本机 HTTP 测试。
        token_endpoint:
          type: string
          format: uri
          description: HTTPS 公网端点；IP 字面量和连接时 DNS 解析结果不得落入私网、链路本地、CGNAT、ULA 或保留地址。仅 localhost/回环地址可用于本机 HTTP 测试。
        userinfo_endpoint:
          type: string
          format: uri
          description: HTTPS 公网端点；IP 字面量和连接时 DNS 解析结果不得落入私网、链路本地、CGNAT、ULA 或保留地址。仅 localhost/回环地址可用于本机 HTTP 测试。
        client_id: { type: string }
        client_secret: { type: string, format: password, writeOnly: true, nullable: true }
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          description: >-
            发往外部 IdP 的 scope。可包含 openid（多数 OIDC 提供商需要它才开放 UserInfo 端点），但本平台只用它
            换取可调用 UserInfo 的 access token，不会解析或验证随之返回的 id_token。
        subject_claim: { type: string, default: sub }
        email_claim: { type: string, default: email }
        name_claim: { type: string, nullable: true }
        email_verified_claim:
          type: string
          description: 指向布尔型邮箱验证状态的 claim 路径。必填：缺失、空白、非 bool 或 false 时服务端拒绝身份解析与自动建号。
        client_auth_method: { type: string, enum: [basic, request_body], default: basic }
    OAuthProviderSummary:
      type: object
      description: >-
        自定义提供商摘要。身份建立只依赖 UserInfo 响应；本平台不为该提供商验证 ID Token，
        因此契约中不存在 issuer、jwks_uri 或 id_token 相关字段。
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        slug: { type: string }
        trust_model:
          type: string
          enum: [oauth2_userinfo]
          description: >-
            身份信任模型。恒为 oauth2_userinfo：OAuth 2.0 授权码流程 + UserInfo 端点，sub/email/email_verified
            全部来自 UserInfo 响应，令牌响应中的 id_token 不被解析也不参与身份判定。本平台作为 OP 对下游 Client
            仍完整支持 OIDC，该字段只描述上游自定义提供商这一侧。
        callback_uri: { type: string, format: uri }
        authorization_endpoint: { type: string, format: uri }
        token_endpoint: { type: string, format: uri }
        userinfo_endpoint: { type: string, format: uri }
        client_id: { type: string }
        scopes: { type: array, items: { type: string } }
        subject_claim: { type: string }
        email_claim: { type: string }
        name_claim: { type: string, nullable: true }
        email_verified_claim:
          type: string
          nullable: true
          description: null 表示存量遗留配置，该 provider 无法判断邮箱验证状态，不能被启用，也不会放行外部登录。
        client_auth_method: { type: string, enum: [basic, request_body] }
        status: { type: string, enum: [active, disabled] }
        client_secret_configured: { type: boolean }
    ClientInput:
      type: object
      required: [client_name, redirect_uris, scopes]
      properties:
        client_name: { type: string, minLength: 1, maxLength: 128 }
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 10
          description: 重复 URI 按首次出现顺序去重；HTTPS 可使用普通主机，HTTP 仅允许字面回环 IP（127.0.0.0/8 或 [::1]），不接受 localhost；禁止 wildcard、fragment 和 userinfo。
          items: { type: string, format: uri, minLength: 1, maxLength: 2048 }
        scopes:
          type: array
          minItems: 1
          maxItems: 32
          description: 服务端仅接受 OAUTH_CLIENT_ALLOWED_SCOPES allowlist 中的 scope；默认 allowlist 为 openid、profile、email。
          items: { type: string, minLength: 1, maxLength: 64 }
    ClientSummary:
      allOf:
        - $ref: '#/components/schemas/ClientInput'
        - type: object
          properties:
            id: { type: integer, format: int64, minimum: 1 }
            client_id: { type: string }
            status: { type: string }
            owner_user_id: { type: integer, format: int64, minimum: 1, nullable: true }
    RegisteredClient:
      allOf:
        - $ref: '#/components/schemas/ClientSummary'
        - type: object
          required: [auth_method]
          properties:
            auth_method:
              type: string
              description: Client 认证方式；`none` 表示公开客户端，此时 client_secret 字段整体省略
              enum: [client_secret_basic, client_secret_post, none]
            client_secret:
              type: string
              format: password
              description: 明文 Secret，仅创建时返回一次；公开客户端（auth_method = none）不签发，字段整体省略
    ClientSecretResponse:
      type: object
      properties:
        client_id: { type: string }
        client_secret: { type: string, format: password }
    Plan:
      type: object
      description: 套餐定义；monthly_auth_limit / max_qps 为 null 表示无限 / 不限
      required: [id, code, name, oauth_clients_limit, daily_auth_limit, monthly_auth_limit, max_qps, is_default, status, created_at, updated_at, assigned_users]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        code: { type: string, maxLength: 64, description: 小写字母、数字、下划线或连字符，服务端自动归一化 }
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true, maxLength: 512 }
        oauth_clients_limit: { type: integer, format: int32, minimum: 0 }
        daily_auth_limit: { type: integer, format: int64, minimum: 0 }
        monthly_auth_limit: { type: integer, format: int64, nullable: true, minimum: 0 }
        max_qps: { type: integer, format: int32, nullable: true, minimum: 1 }
        is_default: { type: boolean }
        status: { type: string, enum: [active, archived] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        assigned_users: { type: integer, format: int64, minimum: 0, description: 当前已分配用户数（管理端响应包含） }
    PlanInput:
      type: object
      description: 创建 / 更新套餐的输入
      required: [code, name, oauth_clients_limit, daily_auth_limit, is_default]
      properties:
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true, maxLength: 512 }
        oauth_clients_limit: { type: integer, format: int32, minimum: 0 }
        daily_auth_limit: { type: integer, format: int64, minimum: 0 }
        monthly_auth_limit: { type: integer, format: int64, nullable: true, minimum: 0 }
        max_qps: { type: integer, format: int32, nullable: true, minimum: 1 }
        is_default: { type: boolean }
    AssignPlanInput:
      type: object
      required: [plan_id]
      properties:
        plan_id: { type: integer, format: int64, minimum: 1 }
        expires_at: { type: string, format: date-time, nullable: true, description: null 表示永久有效；也接受 time crate 的 tuple 数组形式 }
    EntitlementsResponse:
      type: object
      required: [entitlements]
      properties:
        plan:
          type: object
          nullable: true
          description: 当前生效套餐；null 表示该账号没有生效套餐（平台未开放自助接入），此时 entitlements 为空数组
          required: [code, name, validity]
          properties:
            code: { type: string }
            name: { type: string }
            description: { type: string, nullable: true }
            validity: { type: string, description: permanent 或 RFC3339 到期时间 }
        entitlements:
          type: array
          items:
            type: object
            required: [key, label, used]
            properties:
              key: { type: string }
              label: { type: string }
              used: { type: integer, format: int64, minimum: 0 }
              limit: { type: integer, format: int64, nullable: true, description: 有上限时存在；null 表示无限；缺失表示无上限概念（如 QPS） }
