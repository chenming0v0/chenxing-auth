      operationId: adminLoginPage
      description: |
        遗留浏览器入口，不是 JSON API。GET 保留查询串并 303 到 `/login`。
        POST 未注册，axum 返回 405 Method Not Allowed，避免旧表单登录被 303 丢掉请求体。
        实际登录走 POST /api/v1/auth/login；React 登录页位于 `/login`。
      responses:
        '303':
          description: 重定向到 React SPA 的 /login，查询串原样保留
          headers:
            Location:
              schema: { type: string, example: /login }
