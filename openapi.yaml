        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '504': { $ref: '#/components/responses/RequestTimeout' }
    put:
      tags: [Admin]
      summary: 创建或更新 OIDC Issuer
      description: |
        Owner 专属，浏览器会话需要 CSRF。value 必须是无 userinfo、路径、查询和片段的
        http(s) 根 URL。expected_generation 用于 CAS 并发保护；修改已有值时 confirm 必须为 true。
        Issuer 写入 PostgreSQL `app_settings`；写入与 issuer_configure/issuer_update 审计在同一事务中提交，
        当前进程立即热生效，其他副本按 generation 轮询收敛。保护模式下可使用 ADMIN_TOKEN 完成恢复配置。
      operationId: updateIssuerSetting
      security:
        - adminBearer: []
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
