openapi: 3.0.3
info:
  title: 辰星认证中枢 API
  version: 1.0.0
  description: |
    辰星通行证用户认证、OAuth 2.0/OIDC 和管理员管理 API。
    当前定义以仓库实际路由为准。生产环境请将服务器地址替换为固定的 APP_ISSUER。
servers:
  - url: http://127.0.0.1:3000
    description: 本地开发
tags:
  - name: System
  - name: User Auth
  - name: OAuth/OIDC
  - name: Admin Auth
  - name: Admin Users
  - name: Admin Clients
  - name: Admin Operations
paths:
  /health:
    get:
      tags: [System]
      summary: 健康检查
      operationId: health
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /.well-known/openid-configuration:
    get:
      tags: [OAuth/OIDC]
      summary: OIDC Discovery
      operationId: openidConfiguration
      responses:
        '200':
          description: OIDC 配置
          content:
            application/json:
              schema:
                type: object
  /.well-known/jwks.json:
    get:
      tags: [OAuth/OIDC]
      summary: JWKS 公钥集合
      operationId: jwks
      responses:
        '200':
          description: 公钥集合
          content:
            application/json:
              schema:
                type: object
  /api/v1/users:
    post:
      tags: [User Auth]
      summary: 注册用户
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/PublicUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/login:
    post:
      tags: [User Auth]
      summary: 用户登录
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: 登录成功，同时设置 Session 和 CSRF Cookie
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetCookie' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/status:
    get:
      tags: [User Auth]
      summary: 查询当前登录状态
      operationId: authStatus
      responses:
        '200':
          description: 登录状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthStatusResponse' }
  /api/v1/auth/me:
    get:
      tags: [User Auth]
      summary: 查询当前用户资料
      operationId: currentUserProfile
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 当前用户资料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserMeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [User Auth]
      summary: 更新当前用户资料
      operationId: updateCurrentUserProfile
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileInput' }
      responses:
        '200':
          description: 更新后的用户资料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserMeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/password:
    post:
      tags: [User Auth]
      summary: 修改当前用户密码
      operationId: changeCurrentUserPassword
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordInput' }
      responses:
        '204': { description: 密码已修改并撤销所有用户 Session }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/sessions:
    get:
      tags: [User Auth]
      summary: 查询当前用户 Session
      operationId: listUserSessions
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 当前用户的活跃 Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/sessions/{session_id}:
    delete:
      tags: [User Auth]
      summary: 撤销指定用户 Session
      operationId: revokeUserSession
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204': { description: Session 已撤销 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/auth/oauth-clients:
    get:
      tags: [User Auth]
      summary: 查询当前用户的 OAuth 项目
      operationId: listOwnedOAuthClients
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 只包含当前用户拥有的 OAuth 项目和配额使用量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnedOAuthClientList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [User Auth]
      summary: 创建当前用户的 OAuth 项目
      operationId: createOwnedOAuthClient
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '201':
          description: 创建成功，Client Secret 只返回一次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredOwnedOAuthClient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/oauth-clients/{client_id}:
    put:
      tags: [User Auth]
      summary: 更新当前用户拥有的 OAuth 项目
      operationId: updateOwnedOAuthClient
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: client_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '204': { description: 更新成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/auth/oauth-clients/{client_id}/disable:
    post:
      tags: [User Auth]
      summary: 禁用当前用户拥有的 OAuth 项目
      operationId: disableOwnedOAuthClient
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: client_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204': { description: 禁用成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/auth/oauth-clients/{client_id}/enable:
    post:
      tags: [User Auth]
      summary: 启用当前用户拥有的 OAuth 项目
      operationId: enableOwnedOAuthClient
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: client_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204': { description: 启用成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/auth/oauth-clients/{client_id}/rotate-secret:
    post:
      tags: [User Auth]
      summary: 轮换当前用户 OAuth 项目的 Secret
      operationId: rotateOwnedOAuthClientSecret
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: client_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '200':
          description: 新 Secret，只返回一次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientSecretResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/auth/session:
    delete:
      tags: [User Auth]
      summary: 注销当前 Session
      operationId: revokeSession
      security: [{ sessionCookie: [] }, { chenxingSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: 注销成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /oauth/authorize:
    get:
      tags: [OAuth/OIDC]
      summary: OAuth 授权码入口
      operationId: authorize
      security: [{ sessionCookie: [] }, {}]
      parameters:
        - { $ref: '#/components/parameters/ClientId' }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: scope, in: query, required: true, schema: { type: string, example: 'openid email profile' } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: nonce, in: query, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
      responses:
        '302': { description: 重定向到 Client 的 redirect_uri 或登录/授权确认页 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/oauth/authorize/requests/{request_id}:
    get:
      tags: [OAuth/OIDC]
      summary: 查询绑定到当前 Session 的待授权请求
      operationId: inspectAuthorizationRequest
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 安全的授权确认数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingAuthorizationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [OAuth/OIDC]
      summary: 批准或拒绝绑定到当前 Session 的授权请求
      operationId: decideAuthorizationRequest
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizationDecisionInput' }
      responses:
        '200':
          description: 决策结果和已校验的回调地址
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationDecisionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /oauth/token:
    post:
      tags: [OAuth/OIDC]
      summary: 交换授权码或刷新 Token
      operationId: token
      security: [{ basicClientAuth: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token 响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /oauth/userinfo:
    get:
      tags: [OAuth/OIDC]
      summary: 获取 OIDC UserInfo
      operationId: userinfo
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /oauth/revoke:
    post:
      tags: [OAuth/OIDC]
      summary: 撤销 Token
      operationId: revokeToken
      security: [{ basicClientAuth: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                token_type_hint: { type: string, enum: [access_token, refresh_token] }
      responses:
        '200': { description: 撤销完成，无响应体 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/bootstrap:
    post:
      tags: [Admin Auth]
      summary: 初始化首个管理员
      operationId: bootstrapAdmin
      security: [{ adminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminInput' }
      responses:
        '201': { description: 初始化成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/auth/login:
    post:
      tags: [Admin Auth]
      summary: 管理员登录
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: 登录成功，同时设置管理员 Session 和 CSRF Cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin_id: { type: string, format: uuid }
                  expires_in: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/auth/me:
    get:
      tags: [Admin Auth]
      summary: 查询当前管理员身份和权限
      operationId: adminMe
      security: [{ adminBearer: [] }, { adminSessionCookie: [] }]
      responses:
        '200':
          description: 管理员身份摘要
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/auth/logout:
    delete:
      tags: [Admin Auth]
      summary: 管理员注销
      operationId: logoutAdmin
      security: [{ adminSessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '204': { description: 注销成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/users:
    get:
      tags: [Admin Users]
      summary: 用户列表
      operationId: listUsers
      security: [{ adminBearer: [] }, { adminSessionCookie: [] }]
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PublicUser' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/users/{user_id}/{status}:
    post:
      tags: [Admin Users]
      summary: 设置用户状态
      operationId: setUserStatus
      security: [{ adminSessionCookie: [] }, { adminBearer: [] }]
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: path, required: true, schema: { type: string, example: disabled } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '204': { description: 更新成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/clients:
    get:
      tags: [Admin Clients]
      summary: Client 列表
      operationId: listClients
      security: [{ adminBearer: [] }, { adminSessionCookie: [] }]
      responses:
        '200':
          description: Client 列表，不包含 Secret
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ClientSummary' } }
    post:
      tags: [Admin Clients]
      summary: 创建 Client
      operationId: createClient
      security: [{ adminBearer: [] }, { adminSessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '201':
          description: 创建成功，Secret 只返回一次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredClient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/clients/{client_id}:
    put:
      tags: [Admin Clients]
      summary: 更新 Client
      operationId: updateClient
      security: [{ adminSessionCookie: [] }, { adminBearer: [] }]
      parameters:
        - { name: client_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '204': { description: 更新成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/admin/clients/{client_id}/disable:
    post:
      tags: [Admin Clients]
      summary: 禁用 Client
      operationId: disableClient
      security: [{ adminSessionCookie: [] }, { adminBearer: [] }]
      parameters: [{ name: client_id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '204': { description: 操作成功 }
  /api/v1/admin/clients/{client_id}/enable:
    post:
      tags: [Admin Clients]
      summary: 启用 Client
      operationId: enableClient
      security: [{ adminSessionCookie: [] }, { adminBearer: [] }]
      parameters: [{ name: client_id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '204': { description: 操作成功 }
  /api/v1/admin/clients/{client_id}/rotate-secret:
    post:
      tags: [Admin Clients]
      summary: 轮换 Client Secret
      operationId: rotateClientSecret
      security: [{ adminSessionCookie: [] }, { adminBearer: [] }]
      parameters: [{ name: client_id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '200':
          description: 新 Secret，只返回一次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientSecretResponse' }
  /api/v1/admin/admins:
    get:
      tags: [Admin Auth]
      summary: 管理员列表
      operationId: listAdmins
      security: [{ adminSessionCookie: [] }, { adminBearer: [] }]
      responses:
        '200':
          description: 管理员摘要
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminSummary' } }
    post:
      tags: [Admin Auth]
      summary: 创建管理员
      operationId: createAdmin
      security: [{ adminSessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminInput' }
      responses:
        '201': { description: 创建成功 }
  /api/v1/admin/audit:
    get:
      tags: [Admin Operations]
      summary: 审计事件列表
      operationId: listAudit
      security: [{ adminSessionCookie: [] }, { adminBearer: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1 } }
      responses:
        '200': { description: 审计事件列表, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /api/v1/admin/overview:
    get:
      tags: [Admin Operations]
      summary: 管理后台概览统计
      operationId: adminOverview
      security: [{ adminBearer: [] }, { adminSessionCookie: [] }]
      responses:
        '200':
          description: 全局资源计数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/users/query:
    get:
      tags: [Admin Users]
      summary: 分页筛选用户
      operationId: queryUsers
      security: [{ adminBearer: [] }, { adminSessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/StatusFilter' }
      responses:
        '200':
          description: 分页用户列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedUsers' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/clients/query:
    get:
      tags: [Admin Clients]
      summary: 分页筛选 OAuth Client
      operationId: queryClients
      security: [{ adminBearer: [] }, { adminSessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/StatusFilter' }
      responses:
        '200':
          description: 分页 Client 列表，包含 owner_user_id 但不包含 Secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedClients' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/audit/query:
    get:
      tags: [Admin Operations]
      summary: 分页筛选审计事件
      operationId: queryAudit
      security: [{ adminBearer: [] }, { adminSessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: action, in: query, schema: { type: string } }
        - { name: resource_type, in: query, schema: { type: string } }
      responses:
        '200':
          description: 分页审计事件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedAudit' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/keys/rotate:
    post:
      tags: [Admin Operations]
      summary: 轮换签名密钥
      operationId: rotateSigningKey
      security: [{ adminSessionCookie: [] }, { adminBearer: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '200':
          description: 轮换结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_id: { type: string }
                  published_key_count: { type: integer }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    adminBearer: { type: http, scheme: bearer }
    basicClientAuth: { type: http, scheme: basic }
    sessionCookie: { type: apiKey, in: cookie, name: chenxing_session }
    adminSessionCookie: { type: apiKey, in: cookie, name: chenxing_admin_session }
    chenxingSession: { type: apiKey, in: header, name: X-Chenxing-Session }
  parameters:
    ClientId: { name: client_id, in: query, required: true, schema: { type: string } }
    CsrfHeader: { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
    Page: { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Search: { name: search, in: query, required: false, schema: { type: string, maxLength: 128 } }
    StatusFilter: { name: status, in: query, required: false, schema: { type: string, enum: [active, disabled] } }
  headers:
    SetCookie: { description: Session 和 CSRF Cookie, schema: { type: string } }
  responses:
    BadRequest: { description: 请求错误, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: 未认证或凭据无效, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: 无权限, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: 资源冲突, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: 资源不存在, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    TooManyRequests: { description: OAuth 配额已耗尽, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    HealthResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        service: { type: string, example: chenxing-auth }
    RegistrationInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 12 }
        display_name: { type: string, nullable: true, maxLength: 128 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    PublicUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string, nullable: true }
        status: { type: string }
        created_at: { type: string, format: date-time }
    LoginResponse:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
    AuthStatusResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
    UserMeResponse:
      type: object
      required: [id, email, status, current_session_expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string, nullable: true }
        status: { type: string }
        current_session_expires_at: { type: string, format: date-time }
    UpdateProfileInput:
      type: object
      properties:
        display_name: { type: string, nullable: true, maxLength: 128 }
    ChangePasswordInput:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 12 }
    SessionItem:
      type: object
      required: [id, created_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }
    SessionListResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SessionItem' } }
    QuotaSnapshot:
      type: object
      required: [daily_limit, daily_used, monthly_limit, monthly_used]
      properties:
        daily_limit: { type: integer, format: int64, example: 2500 }
        daily_used: { type: integer, format: int64 }
        monthly_limit: { type: integer, format: int64, example: 50000 }
        monthly_used: { type: integer, format: int64 }
    OwnedOAuthClient:
      type: object
      required: [id, client_id, client_name, redirect_uris, scopes, status, quota]
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string }
        client_name: { type: string }
        redirect_uris: { type: array, items: { type: string, format: uri } }
        scopes: { type: array, items: { type: string } }
        status: { type: string, enum: [active, disabled] }
        quota: { $ref: '#/components/schemas/QuotaSnapshot' }
    OwnedOAuthClientList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OwnedOAuthClient' } }
    RegisteredOwnedOAuthClient:
      allOf:
        - $ref: '#/components/schemas/OwnedOAuthClient'
        - type: object
          required: [client_secret]
          properties:
            client_secret: { type: string, format: password }
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token] }
        code: { type: string }
        redirect_uri: { type: string, format: uri }
        code_verifier: { type: string }
        refresh_token: { type: string }
        scope: { type: string }
        client_id: { type: string }
        client_secret: { type: string, format: password }
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, format: int64 }
        scope: { type: string }
        refresh_token: { type: string }
        id_token: { type: string }
    UserInfo:
      type: object
      required: [sub]
      properties:
        sub: { type: string }
        email: { type: string, format: email }
        name: { type: string }
    PendingAuthorizationResponse:
      type: object
      required: [request_id, client_id, client_name, redirect_host, scopes, expires_in]
      properties:
        request_id: { type: string }
        client_id: { type: string }
        client_name: { type: string }
        redirect_host: { type: string }
        scopes: { type: array, items: { type: string } }
        expires_in: { type: integer, format: int64, example: 600 }
    AuthorizationDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, deny] }
    AuthorizationDecisionResponse:
      type: object
      required: [decision, redirect_to]
      properties:
        decision: { type: string, enum: [approve, deny] }
        redirect_to: { type: string, format: uri }
    AdminMeResponse:
      type: object
      required: [role, permissions, status]
      properties:
        admin_id: { type: string, format: uuid, nullable: true }
        email: { type: string, format: email, nullable: true }
        role: { type: string, enum: [owner, operator, auditor] }
        permissions: { type: array, items: { type: string } }
        status: { type: string }
    AdminOverview:
      type: object
      required: [users, oauth_clients, administrators, audit_events]
      properties:
        users: { type: integer, format: int64 }
        oauth_clients: { type: integer, format: int64 }
        administrators: { type: integer, format: int64 }
        audit_events: { type: integer, format: int64 }
    PagedUsers:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PublicUser' } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, format: int64 }
    PagedClients:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ClientSummary' } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, format: int64 }
    PagedAudit:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { type: object } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, format: int64 }
    AdminInput:
      type: object
      required: [email, password, role]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 12 }
        role: { type: string, enum: [owner, operator, auditor] }
    AdminSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string }
        status: { type: string }
    ClientInput:
      type: object
      required: [client_name, redirect_uris, scopes]
      properties:
        client_name: { type: string }
        redirect_uris: { type: array, items: { type: string, format: uri } }
        scopes: { type: array, items: { type: string } }
    ClientSummary:
      allOf:
        - $ref: '#/components/schemas/ClientInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            client_id: { type: string }
            status: { type: string }
            owner_user_id: { type: string, format: uuid, nullable: true }
    RegisteredClient:
      allOf:
        - $ref: '#/components/schemas/ClientSummary'
        - type: object
          properties:
            client_secret: { type: string, format: password }
    ClientSecretResponse:
      type: object
      properties:
        client_id: { type: string }
        client_secret: { type: string, format: password }
