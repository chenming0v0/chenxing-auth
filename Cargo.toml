[package]
name = "chenxing-auth"
version = "0.1.0"
edition = "2024"
description = "天穹辰星 · 辰星认证中枢"
license = "MIT"
publish = false

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
cookie = "0.18"
dotenvy = "0.15"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
oxide-auth-axum = "0.6"
redis = { version = "0.29", features = ["script", "tokio-comp"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "migrate", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
rsa = { version = "0.9", features = ["pem"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
