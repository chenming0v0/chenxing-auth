[package]
name = "chenxing-auth"
version = "1.0.3"
edition = "2024"
description = "天穹辰星 · 辰星认证中枢"
license = "MIT"
publish = false

[dependencies]
argon2 = "0.5"
aes-gcm = "0.10"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
cookie = "0.18"
dotenvy = "0.15"
hmac = "0.12"
# 头像二次压缩只需要 PNG/JPEG/WebP 解码与 JPEG 编码。关闭 default-features 把
# 其余格式的解码器排除在攻击面之外：上传字节是不可信输入，每个启用的解码器
# 都是一份额外的 CVE 暴露面。
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }
oxide-auth-axum = "0.6"
redis = { version = "0.29", features = ["script", "tokio-comp"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
subtle = "2"
sqlx-core = { version = "0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json", "migrate", "time", "uuid"] }
sqlx-postgres = { version = "0.8.6", default-features = false, features = ["json", "migrate", "time", "uuid"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
totp-rs = { version = "5.7.2", default-features = false, features = ["gen_secret", "otpauth", "zeroize"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "test-util", "time"] }
tower-http = { version = "0.6", features = ["fs", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
webauthn-rs = { version = "0.6.1-dev", default-features = false, features = ["danger-allow-state-serialisation"] }
webauthn-rs-core = "=0.6.1-dev"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["derive"] }
pkcs8 = { version = "0.10", features = ["std"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[dev-dependencies]
# 集成测试需要生成真实 PNG 作为上传夹具。image 已是常规依赖且启用了 png，
# 这里复用同一份编译产物，不引入额外构建成本。
image = { version = "0.25.10", default-features = false, features = ["png"] }
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
sha2 = "0.10"
