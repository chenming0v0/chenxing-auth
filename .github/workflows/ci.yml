name: CI

on:
  push:
    branches: [dev, releases, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust quality and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chenxing_auth
          POSTGRES_USER: chenxing
          POSTGRES_PASSWORD: chenxing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chenxing -d chenxing_auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://chenxing:chenxing@127.0.0.1:5432/chenxing_auth
      REDIS_URL: redis://127.0.0.1:6379
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets --all-features
      - run: cargo test --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chenxing_auth
          POSTGRES_USER: chenxing
          POSTGRES_PASSWORD: chenxing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chenxing -d chenxing_auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://chenxing:chenxing@127.0.0.1:5432/chenxing_auth
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info --fail-under-lines 75
      - uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info

  apifox-sync:
    name: Sync OpenAPI to Apifox
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [quality, coverage]
    runs-on: ubuntu-latest
    environment: apifox
    steps:
      - name: Import OpenAPI specification
        env:
          API_FOX_KEY: ${{ secrets.API_FOX_KEY }}
        run: |
          set -euo pipefail
          test -n "$API_FOX_KEY"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.apifox.com/v1/projects/8642631/import-openapi?locale=zh-CN" \
            --header "Authorization: Bearer $API_FOX_KEY" \
            --header "X-Apifox-Api-Version: 2024-03-28" \
            --header "Content-Type: application/json" \
            --data '{
              "input": {
                "url": "https://raw.githubusercontent.com/chenming0v0/chenxing-auth/master/openapi.yaml"
              },
              "options": {
                "endpointOverwriteBehavior": "AUTO_MERGE",
                "schemaOverwriteBehavior": "AUTO_MERGE",
                "updateFolderOfChangedEndpoint": true,
                "prependBasePath": false,
                "deleteUnmatchedResources": false
              }
            }'
