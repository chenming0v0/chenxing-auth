name: CI

on:
  push:
    branches: [dev, releases]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust quality and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chenxing_auth
          POSTGRES_USER: chenxing
          POSTGRES_PASSWORD: chenxing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chenxing -d chenxing_auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://chenxing:chenxing@127.0.0.1:5432/chenxing_auth
      REDIS_URL: redis://127.0.0.1:6379
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate GitHub Action pins
        run: python .github/scripts/verify_action_pins.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Validate web build
        run: npm ci --prefix web && npm run build --prefix web
      - name: Run web tests
        run: npm test --prefix web
      - name: Validate OpenAPI
        run: python .codex/skills/sync-openapi/scripts/validate_openapi.py
      - name: Validate deployment files
        shell: bash
        run: |
          set -euo pipefail
          remote_install_dir="$RUNNER_TEMP/chenxing-remote-install"
          cleanup_validation_files() {
            rm -f .env
            rm -rf "$remote_install_dir"
          }
          trap cleanup_validation_files EXIT
          bash -n manage.sh
          bash -n install.sh
          bash -n deploy/install.sh
          bash -n test_sh/deployment_contract.sh
          bash -n test_sh/test_runner_contract.sh
          bash -n test_sh/redis_crash_recovery.sh
          bash test_sh/deployment_contract.sh
          bash test_sh/test_runner_contract.sh
          cp .env.example .env
          sed -i 's/^REDIS_NAMESPACE=$/REDIS_NAMESPACE=ci-validation/' .env
          APP_PORT=8080 docker compose --env-file .env -f docker-compose.prod.yml config --quiet
          mkdir -p "$remote_install_dir"
          cp manage.sh "$remote_install_dir/manage.sh"
          CHENXING_PORT=3000 bash "$remote_install_dir/manage.sh" --prepare-only
          docker compose --env-file "$remote_install_dir/.env" \
            -f "$remote_install_dir/compose.yml" config --quiet
      - name: Verify Redis credential state survives a crash
        shell: bash
        timeout-minutes: 5
        run: bash test_sh/redis_crash_recovery.sh
      - name: Verify migration checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd migrations
          sha256sum -c checksums.sha256
          sha256sum -c published-checksums.sha256
          published_count="$(wc -l < published-checksums.sha256)"
          diff -u \
            published-checksums.sha256 \
            <(head -n "$published_count" checksums.sha256)
          diff -u <(printf '%s\n' *.sql | sort) <(awk '{print $2}' checksums.sha256 | sort)
      - name: Check Rust source file size
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            lines="$(wc -l < "$file")"
            if (( lines > 500 )); then
              printf 'source file exceeds 500 lines: %s (%s)\n' "$file" "$lines" >&2
              failed=1
            elif (( lines > 300 )); then
              printf 'source file warning: %s (%s lines)\n' "$file" "$lines"
            fi
          done < <(find src -type f -print0)
          exit "$failed"
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets --all-features
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: nextest@0.9.143
          fallback: none
      - name: Run Rust tests in parallel
        run: cargo nextest run --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Install cargo-audit
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      # RUSTSEC-2023-0071 currently has no fixed release. It is pulled in by
      # webauthn-rs -> crypto-glue for WebAuthn RSA public-key verification;
      # this application does not use that dependency for RSA private-key
      # decryption/signing. Remove this exception when upstream ships a fix.
      - name: Report cargo-audit exception status
        shell: bash
        run: |
          set -euo pipefail
          advisory_id="RUSTSEC-2023-0071"
          rsa_version="$(awk '
            $0 == "name = \"rsa\"" { in_rsa = 1; next }
            in_rsa && /^version = / {
              gsub(/"/, "", $3)
              print $3
              exit
            }
            in_rsa && /^name = / { exit 1 }
          ' Cargo.lock)"

          if [[ -z "$rsa_version" ]]; then
            printf 'Unable to determine the locked rsa version from Cargo.lock.\n' >&2
            exit 1
          fi

          {
            printf '## cargo-audit exception status\n\n'
            printf -- '- Advisory: `%s`\n' "$advisory_id"
            printf -- '- Locked `rsa` version: `%s`\n' "$rsa_version"
            printf -- '- Dependency chain: `webauthn-rs -> crypto-glue -> rsa`\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [[ ! "$rsa_version" =~ ^0\.9\.[0-9]+$ ]]; then
            printf 'rsa version %s is outside the expected 0.9.x range. 重新评估 RUSTSEC-2023-0071 ignore 是否可以移除。\n' "$rsa_version" >&2
            exit 1
          fi

          printf -- '- Status: exception remains active because `rsa` is still on the 0.9.x line.\n' | tee -a "$GITHUB_STEP_SUMMARY"
      - run: cargo audit --ignore RUSTSEC-2023-0071

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chenxing_auth
          POSTGRES_USER: chenxing
          POSTGRES_PASSWORD: chenxing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chenxing -d chenxing_auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://chenxing:chenxing@127.0.0.1:5432/chenxing_auth
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-nextest and cargo-llvm-cov
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: nextest@0.9.143,cargo-llvm-cov@0.9.0
          fallback: none
      # nextest 一测一进程，避免 oauth 代理边界用例改 HTTP_PROXY 污染 sibling。
      # quality job 已经用 nextest；coverage 必须同一隔离模型，不能退回 cargo test。
      - run: cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov.info --fail-under-lines 75
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-coverage
          path: lcov.info

  apifox-sync:
    name: Sync OpenAPI to Apifox
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [quality, coverage]
    runs-on: ubuntu-latest
    environment: apifox
    # Apifox 的导入 API 会 504。这是文档同步副作用，不是质量门；
    # 重试之后仍失败时不挡住 dev CI，否则 coverage 已经绿的提交合不进去。
    continue-on-error: true
    steps:
      - name: Import OpenAPI specification
        env:
          API_FOX_KEY: ${{ secrets.API_FOX_KEY }}
        run: |
          set -euo pipefail
          test -n "$API_FOX_KEY"
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-delay 20 \
            --retry-all-errors \
            --request POST \
            --url "https://api.apifox.com/v1/projects/8642631/import-openapi?locale=zh-CN" \
            --header "Authorization: Bearer $API_FOX_KEY" \
            --header "X-Apifox-Api-Version: 2024-03-28" \
            --header "Content-Type: application/json" \
            --data '{
              "input": {
                "url": "https://raw.githubusercontent.com/chenming0v0/chenxing-auth/dev/openapi.yaml"
              },
              "options": {
                "endpointOverwriteBehavior": "AUTO_MERGE",
                "schemaOverwriteBehavior": "AUTO_MERGE",
                "updateFolderOfChangedEndpoint": true,
                "prependBasePath": false,
                "deleteUnmatchedResources": true
              }
            }'
