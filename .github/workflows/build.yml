name: Build And Publish

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  verify-provenance:
    name: Verify release provenance
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.verify.outputs.valid }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          fetch-depth: 0
      - name: Validate event and commit provenance
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              echo 'valid=true' >> "$GITHUB_OUTPUT"
              ;;
            workflow_run)
              # Required provenance: workflow_run.conclusion == 'success'.
              test '${{ github.event.workflow_run.conclusion }}' = success
              test '${{ github.event.workflow_run.event }}' = push
              test '${{ github.event.workflow_run.head_branch }}' = releases
              test '${{ github.event.workflow_run.head_repository.full_name }}' = "$GITHUB_REPOSITORY"
              echo 'valid=true' >> "$GITHUB_OUTPUT"
              ;;
            push)
              case "$GITHUB_REF" in refs/tags/v*) ;; *) echo 'unexpected push ref' >&2; exit 1 ;; esac
              git fetch origin releases --depth=1
              tag_sha="$(git rev-list -n1 "$GITHUB_REF")"
              git merge-base --is-ancestor "$tag_sha" FETCH_HEAD
              runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${tag_sha}&event=push&branch=releases&per_page=100")"
              jq -e --arg sha "$tag_sha" --arg repo "$GITHUB_REPOSITORY" '
                .workflow_runs[]
                | select(.head_sha == $sha and .event == "push" and .head_branch == "releases" and .conclusion == "success" and .repository.full_name == $repo)
              ' <<< "$runs" >/dev/null
              echo 'valid=true' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unsupported event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

  web:
    name: Build embedded web
    needs: verify-provenance
    if: >-
      needs.verify-provenance.outputs.valid == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded web
        run: npm ci --prefix web && npm run build --prefix web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  rust-binaries:
    name: Rust ${{ matrix.target }}
    needs: [verify-provenance, web]
    if: >-
      needs.verify-provenance.outputs.valid == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_run')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            builder: bookworm
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            builder: bookworm
          - target: x86_64-pc-windows-gnu
            runner: windows-latest
            builder: cargo
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            builder: cargo
          - target: x86_64-apple-darwin
            runner: macos-14
            builder: cargo
          - target: aarch64-apple-darwin
            runner: macos-14
            builder: cargo
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Accept prebuilt embedded web
        shell: bash
        run: |
          set -euo pipefail
          test -f web/dist/index.html
          # Artifact extract mtimes can look older than the fresh checkout.
          find web/dist -type f -exec touch {} +
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary natively
        if: matrix.builder == 'cargo'
        env:
          CHENXING_USE_PREBUILT_WEB: "1"
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build Linux binary in bookworm-compatible container
        if: matrix.builder == 'bookworm'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/work \
            -w /work \
            -e CHENXING_USE_PREBUILT_WEB=1 \
            rust:1.94-bookworm \
            cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify Linux binary runs on Debian bookworm
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          output="$(docker run --rm \
            -v "$PWD":/work \
            -w /work \
            debian:bookworm-slim \
            sh -lc "ldd -r target/${{ matrix.target }}/release/chenxing-auth")"
          if grep -q "not found" <<< "$output"; then
            echo "binary requires a newer glibc than Debian bookworm" >&2
            exit 1
          fi
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/chenxing-auth-${{ matrix.target }}"
          rm -rf "$package_root"
          mkdir -p dist "$package_root/web"
          cp "target/${{ matrix.target }}/release/chenxing-auth" \
            "$package_root/chenxing-auth"
          chmod 755 "$package_root/chenxing-auth"
          cp -R web/dist "$package_root/web/dist"
          tar -C "$package_root" \
            -czf "dist/chenxing-auth-${{ matrix.target }}.tar.gz" \
            chenxing-auth web/dist
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP "chenxing-auth-${{ matrix.target }}"
          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $packageRoot "web") | Out-Null
          Copy-Item `
            -LiteralPath "target/${{ matrix.target }}/release/chenxing-auth.exe" `
            -Destination (Join-Path $packageRoot "chenxing-auth.exe")
          Copy-Item -LiteralPath "web/dist" `
            -Destination (Join-Path $packageRoot "web") `
            -Recurse `
            -Force
          Compress-Archive `
            -Path (Join-Path $packageRoot "*") `
            -DestinationPath "dist/chenxing-auth-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release assets
    if: >-
      needs.verify-provenance.outputs.valid == 'true' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [verify-provenance, rust-binaries]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      - name: Verify downloaded release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified-download
          gh release download "${{ github.ref_name }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir verified-download \
            --pattern '*' \
            --clobber
          (cd verified-download && sha256sum -c SHA256SUMS)
      - name: Smoke test downloaded native archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(
            verified-download/chenxing-auth-*.tar.gz
            verified-download/chenxing-auth-*.zip
          )
          if (( ${#archives[@]} == 0 )); then
            echo "release contains no native archives" >&2
            exit 1
          fi

          smoke_root="$RUNNER_TEMP/native-release-smoke"
          rm -rf "$smoke_root"
          mkdir -p "$smoke_root"
          for archive in "${archives[@]}"; do
            archive_name="$(basename "$archive")"
            extract_dir="$smoke_root/$archive_name"
            mkdir -p "$extract_dir"
            case "$archive" in
              *.tar.gz)
                tar -xzf "$archive" -C "$extract_dir"
                binary="$extract_dir/chenxing-auth"
                ;;
              *.zip)
                unzip -q "$archive" -d "$extract_dir"
                binary="$extract_dir/chenxing-auth.exe"
                ;;
            esac

            if [ ! -f "$binary" ]; then
              echo "release archive is missing its root binary: $archive_name" >&2
              exit 1
            fi
            index="$extract_dir/web/dist/index.html"
            if [ ! -f "$index" ]; then
              echo "release archive is missing web/dist/index.html: $archive_name" >&2
              exit 1
            fi

            mapfile -t assets < <(grep -oE '(src|href)="/[^"]+"' "$index" \
              | sed -E 's/^(src|href)="//; s/"$//')
            if (( ${#assets[@]} == 0 )); then
              echo "release archive index.html contains no root-absolute assets: $archive_name" >&2
              exit 1
            fi
            for asset in "${assets[@]}"; do
              relative="${asset#/}"
              relative="${relative%%[?#]*}"
              if [ ! -f "$extract_dir/web/dist/$relative" ]; then
                echo "release archive is missing referenced asset: $archive_name: $asset" >&2
                exit 1
              fi
            done
          done

  container:
    name: Multi-platform container
    runs-on: ubuntu-latest
    needs: [verify-provenance, web, rust-binaries]
    if: >-
      needs.verify-provenance.outputs.valid == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_run')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: binary-x86_64-unknown-linux-gnu
          path: dist-linux-amd64
      - uses: actions/download-artifact@v4
        with:
          name: binary-aarch64-unknown-linux-gnu
          path: dist-linux-arm64
      # The same web-dist artifact the binaries were compiled against. The binary
      # embeds index.html, which references assets by content hash, so the image
      # must ship this exact bundle or every asset 404s.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: container-web-dist
      - name: Stage container binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p container-binaries/amd64 container-binaries/arm64
          tar -xzf dist-linux-amd64/chenxing-auth-x86_64-unknown-linux-gnu.tar.gz \
            -C container-binaries/amd64
          tar -xzf dist-linux-arm64/chenxing-auth-aarch64-unknown-linux-gnu.tar.gz \
            -C container-binaries/arm64
          chmod 755 container-binaries/amd64/chenxing-auth container-binaries/arm64/chenxing-auth
          file container-binaries/amd64/chenxing-auth container-binaries/arm64/chenxing-auth
      - name: Stage container web bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f container-web-dist/index.html
          # Every root-absolute asset referenced by the embedded shell must be
          # present in the staged bundle, otherwise the image serves a shell
          # whose scripts and styles cannot load.
          missing=0
          while read -r asset; do
            [ -n "$asset" ] || continue
            if [ ! -f "container-web-dist/${asset#/}" ]; then
              echo "staged web bundle is missing asset: ${asset}" >&2
              missing=1
            fi
          done < <(grep -oE '(src|href)="/[^"]+"' container-web-dist/index.html \
            | sed -E 's/^(src|href)="//; s/"$//')
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Smoke test final container per architecture
        shell: bash
        run: |
          set -euo pipefail
          for platform in amd64 arm64; do
            docker buildx build --platform "linux/${platform}" --load \
              --tag "chenxing-auth-smoke:${platform}" \
              --file Dockerfile.runtime .
            output="$(docker run --rm --platform "linux/${platform}" \
              --entrypoint /bin/sh "chenxing-auth-smoke:${platform}" \
              -lc 'ldd -r /usr/local/bin/chenxing-auth')"
            if grep -q "not found" <<< "$output"; then
              echo "container ${platform} requires a newer glibc than its runtime base" >&2
              exit 1
            fi
            # WEB_DIST_DIR must resolve inside the image and be readable by the
            # unprivileged runtime user, or the console loads without assets.
            docker run --rm --platform "linux/${platform}" \
              --entrypoint /bin/sh "chenxing-auth-smoke:${platform}" \
              -lc 'test -f "${WEB_DIST_DIR:?WEB_DIST_DIR must be set}/index.html"'
          done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # A workflow_run executes with the default branch context even
          # though checkout is pinned to workflow_run.head_sha. Do not let
          # that context mint a misleading `dev` tag for a releases build.
          tags: |
            type=raw,value=manual-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=tag,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=releases,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
