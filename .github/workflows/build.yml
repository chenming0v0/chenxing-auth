name: Build And Publish

on:
  workflow_dispatch:
  push:
    branches: [releases, master]
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  rust-binaries:
    name: Rust ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            builder: cargo
            suffix: ''
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            builder: cross
            suffix: ''
          - target: x86_64-pc-windows-gnu
            runner: windows-latest
            builder: cargo
            suffix: '.exe'
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            builder: cargo
            suffix: '.exe'
          - target: x86_64-apple-darwin
            runner: macos-14
            builder: cargo
            suffix: ''
          - target: aarch64-apple-darwin
            runner: macos-14
            builder: cargo
            suffix: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: matrix.builder == 'cross'
        uses: taiki-e/install-action@cross
      - if: matrix.builder == 'cargo'
        run: cargo build --release --locked --target ${{ matrix.target }}
      - if: matrix.builder == 'cross'
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release \
            -czf "dist/chenxing-auth-${{ matrix.target }}.tar.gz" \
            chenxing-auth
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/chenxing-auth.exe" `
            -DestinationPath "dist/chenxing-auth-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: rust-binaries
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        shell: bash
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  container:
    name: Multi-platform container
    runs-on: ubuntu-latest
    needs: rust-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
