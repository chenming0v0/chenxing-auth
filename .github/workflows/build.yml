name: Build And Publish

on:
  workflow_dispatch:
  push:
    branches: [releases]
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  web:
    name: Build embedded web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded web
        run: npm ci --prefix web && npm run build --prefix web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  rust-binaries:
    name: Rust ${{ matrix.target }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            builder: cargo
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            builder: cargo
          - target: x86_64-pc-windows-gnu
            runner: windows-latest
            builder: cargo
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            builder: cargo
          - target: x86_64-apple-darwin
            runner: macos-14
            builder: cargo
          - target: aarch64-apple-darwin
            runner: macos-14
            builder: cargo
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Accept prebuilt embedded web
        shell: bash
        run: |
          set -euo pipefail
          test -f web/dist/index.html
          # Artifact extract mtimes can look older than the fresh checkout.
          find web/dist -type f -exec touch {} +
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        env:
          CHENXING_USE_PREBUILT_WEB: "1"
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" \
            -czf "dist/chenxing-auth-${{ matrix.target }}.tar.gz" \
            chenxing-auth
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/chenxing-auth.exe" `
            -DestinationPath "dist/chenxing-auth-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: rust-binaries
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        shell: bash
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  container:
    name: Multi-platform container
    runs-on: ubuntu-latest
    needs: rust-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binary-x86_64-unknown-linux-gnu
          path: dist-linux-amd64
      - uses: actions/download-artifact@v4
        with:
          name: binary-aarch64-unknown-linux-gnu
          path: dist-linux-arm64
      - name: Stage container binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p container-binaries/amd64 container-binaries/arm64
          tar -xzf dist-linux-amd64/chenxing-auth-x86_64-unknown-linux-gnu.tar.gz \
            -C container-binaries/amd64
          tar -xzf dist-linux-arm64/chenxing-auth-aarch64-unknown-linux-gnu.tar.gz \
            -C container-binaries/arm64
          chmod 755 container-binaries/amd64/chenxing-auth container-binaries/arm64/chenxing-auth
          file container-binaries/amd64/chenxing-auth container-binaries/arm64/chenxing-auth
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
