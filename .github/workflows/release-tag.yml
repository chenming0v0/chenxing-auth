name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v prefix
        required: true
        default: 1.1.2
        type: string

permissions:
  contents: write

jobs:
  tag:
    name: Tag releases branch
    if: github.ref == 'refs/heads/releases'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git tag --list "v$VERSION")" = ""
      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_PAT" ]]; then
            echo "::error::RELEASE_PAT secret 未配置。用默认 GITHUB_TOKEN 推送标签不会触发下游工作流（GitHub 防递归规则），Build And Publish 的 Publish release assets job 永不执行，Release 不会生成。请配置 RELEASE_PAT（细粒度 PAT，contents: write 权限），或改用本地 git push 打标签。"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "release: v$VERSION"
          git push "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git" "v$VERSION"
