<!--
  Shared GLOBAL TOP BAR for 天穹辰星 · 辰星通行证（最外层导航）.

  悬浮居中玻璃胶囊：左侧品牌、中间实时状态、右侧三杠菜单 + 账户。
  三杠菜单 = 全局导航：主页 / 控制台 / 应用广场 + 状态行。
  Copy verbatim into each console/admin page as the first child of .chenxing-console-main.
  Per page: 中间状态文案跟随当前界面，在 [data-topbar-status] 内设置
  （如「控制台 · 总览」「管理 · 仪表盘」「统一登录」）；菜单里的状态行固定为系统状态「星门在线」。
  已登录：右侧为圆角矩形头像（.chenxing-avatar）+ 账户下拉。
  未登录（landing / login / register）：把头像块替换为 chenxing-btn-primary 主按钮
  （landing→登录、login→创建通行证、register→登录），品牌链接可承载回主页的 data-dom-id。
  CSS: .chenxing-topbar / .chenxing-topbar-status / .chenxing-status-dot /
       .chenxing-hamburger / .chenxing-nav-menu-item / .chenxing-menu in colors_and_type.css
  Requires the [data-menu-toggle] handler from the page tail script.
-->
<header class="chenxing-topbar">
  <!-- left: brand -->
  <a href="landing.html" class="flex items-center gap-2.5 justify-self-start">
    <img src="../assets/logo.png" alt="天穹辰星" class="h-8 w-8 rounded-[var(--chenxing-radius-md)]" />
    <span class="hidden sm:block">
      <span class="chenxing-body block text-sm font-semibold leading-tight">天穹辰星</span>
      <span class="chenxing-caption block text-[10px] leading-tight tracking-[0.08em]">辰星认证中枢</span>
    </span>
  </a>

  <!-- center: current interface status (per page) -->
  <div class="chenxing-topbar-status" data-topbar-status>
    <span>控制台 · 总览</span>
  </div>

  <!-- right: hamburger nav + account -->
  <div class="flex items-center gap-2 justify-self-end">
    <div class="relative">
      <button type="button" data-menu-toggle class="chenxing-hamburger" aria-label="打开导航菜单">
        <span></span><span></span><span></span>
      </button>
      <div data-menu class="chenxing-menu absolute right-0 top-full z-50 mt-3 hidden w-60">
        <a href="landing.html" class="chenxing-nav-menu-item" data-dom-id="dom-console-home">主页<i data-lucide="arrow-up-right" class="h-4 w-4"></i></a>
        <a href="console-overview.html" class="chenxing-nav-menu-item" data-dom-id="dom-topbar-console">控制台<i data-lucide="layout-dashboard" class="h-4 w-4"></i></a>
        <button type="button" class="chenxing-nav-menu-item">应用广场<i data-lucide="store" class="h-4 w-4"></i></button>
        <div class="chenxing-divider my-1"></div>
        <div class="flex items-center justify-between px-3.5 py-2">
          <span class="chenxing-caption text-[11px] tracking-[0.06em]">状态</span>
          <span class="chenxing-caption inline-flex items-center gap-2 text-[11px] tracking-[0.06em] text-[var(--chenxing-success)]"><span class="chenxing-status-dot"></span>星门在线</span>
        </div>
      </div>
    </div>

    <!-- account: rounded-rect avatar dropdown（未登录页面替换为登录按钮） -->
    <div class="relative">
      <button type="button" data-menu-toggle class="chenxing-avatar h-9 w-9 text-sm" aria-label="账户菜单">辰</button>
      <div data-menu class="chenxing-menu absolute right-0 top-full z-50 mt-3 hidden">
        <a href="console-profile.html" class="chenxing-menu-item"><i data-lucide="settings" class="h-4 w-4 text-[var(--chenxing-cyan)]"></i>个人设置</a>
        <button class="chenxing-menu-item"><i data-lucide="key-round" class="h-4 w-4 text-[var(--chenxing-cyan)]"></i>令牌管理</button>
        <button class="chenxing-menu-item"><i data-lucide="wallet" class="h-4 w-4 text-[var(--chenxing-cyan)]"></i>钱包管理</button>
        <div class="chenxing-divider my-1"></div>
        <a href="login.html" class="chenxing-menu-item" data-dom-id="dom-console-logout"><i data-lucide="log-out" class="h-4 w-4 text-[var(--chenxing-error)]"></i>退出登录</a>
      </div>
    </div>
  </div>
</header>
