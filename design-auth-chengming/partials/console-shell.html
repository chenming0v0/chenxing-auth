<!--
  Shared console shell for 辰星通行证 用户中心 / 认证中枢后台.

  Copy this structure into each console page's <main> and:
  - set aria-current="page" on the active .chenxing-console-tab;
  - add data-dom-id="dom-console-tab-<key>" on tabs for .design interaction edges;
  - fill the .chenxing-console-content region with page-specific
    .chenxing-hud-panel cards (the ONLY allowed glass container).

  Layout rules (see DESIGN.md): NO bottom nav bar, NO glowing user card.

  Tab keys: overview / plans / profile / apps / integrate / playground / admin
-->

<!-- deep space layers (same as other pages) -->
<div class="chenxing-nebula left-[-14%] top-[-18%] h-[560px] w-[560px] bg-[var(--chenxing-primary)] opacity-15"></div>
<div class="chenxing-nebula right-[-12%] top-[30%] h-[480px] w-[480px] bg-[var(--chenxing-cyan)] opacity-10"></div>
<canvas id="starfield" class="absolute inset-0 h-full w-full opacity-40"></canvas>
<div class="chenxing-grid absolute inset-0"></div>
<div class="chenxing-vignette absolute inset-0"></div>

<div class="relative z-10 mx-auto flex min-h-screen max-w-6xl flex-col px-4 pb-28 sm:px-6 lg:pb-10">
  <!-- topbar -->
  <header class="flex items-center justify-between gap-4 py-5">
    <!-- brand: logo.png + aurora wordmark + subtitle -->
    <a href="landing.html" class="flex items-center gap-3" data-dom-id="dom-console-home">
      <img src="../assets/logo.png" alt="天穹辰星" class="chenxing-brand-logo" />
      <span>
        <span class="chenxing-wordmark text-aurora block text-lg">天穹辰星</span>
        <span class="chenxing-mono block text-[9px] uppercase tracking-[0.24em] text-[var(--chenxing-muted-foreground)]">用户中心</span>
      </span>
    </a>

    <!-- desktop segmented glass nav -->
    <nav class="chenxing-console-nav hidden lg:inline-flex">
      <a class="chenxing-console-tab" data-dom-id="dom-console-tab-overview" href="console-overview.html"><i data-lucide="layout-grid" class="h-4 w-4"></i>总览</a>
      <a class="chenxing-console-tab" data-dom-id="dom-console-tab-plans" href="console-plans.html"><i data-lucide="crown" class="h-4 w-4"></i>套餐与权益</a>
      <a class="chenxing-console-tab" data-dom-id="dom-console-tab-profile" href="console-profile.html"><i data-lucide="user" class="h-4 w-4"></i>通行证资料</a>
      <a class="chenxing-console-tab" data-dom-id="dom-console-tab-apps" href="console-authorized-apps.html"><i data-lucide="shield-check" class="h-4 w-4"></i>已授权应用</a>
      <a class="chenxing-console-tab" data-dom-id="dom-console-tab-integrate" href="console-integrate.html"><i data-lucide="code-2" class="h-4 w-4"></i>接入应用</a>
      <a class="chenxing-console-tab" data-dom-id="dom-console-tab-playground" href="console-playground.html"><i data-lucide="flask-conical" class="h-4 w-4"></i>授权测试</a>
    </nav>

    <!-- avatar + dropdown -->
    <div class="relative">
      <button type="button" data-menu-toggle class="flex items-center gap-2 rounded-full border border-[var(--chenxing-border)] bg-[var(--chenxing-muted)] py-1 pl-1 pr-2 transition-colors hover:border-[var(--chenxing-border-strong)]">
        <span class="chenxing-avatar h-8 w-8 text-sm">辰</span>
        <span class="chenxing-body hidden text-sm sm:block">辰林</span>
        <i data-lucide="chevron-down" class="h-4 w-4 text-[var(--chenxing-muted-foreground)]"></i>
      </button>
      <div data-menu class="chenxing-menu absolute right-0 top-full z-50 mt-2 hidden">
        <button class="chenxing-menu-item"><i data-lucide="settings" class="h-4 w-4 text-[var(--chenxing-cyan)]"></i>个人设置</button>
        <button class="chenxing-menu-item"><i data-lucide="key-round" class="h-4 w-4 text-[var(--chenxing-cyan)]"></i>令牌管理</button>
        <button class="chenxing-menu-item"><i data-lucide="wallet" class="h-4 w-4 text-[var(--chenxing-cyan)]"></i>钱包管理</button>
        <div class="chenxing-divider my-1"></div>
        <a href="login.html" class="chenxing-menu-item" data-dom-id="dom-console-logout"><i data-lucide="log-out" class="h-4 w-4 text-[var(--chenxing-error)]"></i>退出登录</a>
      </div>
    </div>
  </header>

  <!-- PAGE CONTENT: fill with .chenxing-hud-panel cards -->
  <div class="chenxing-console-content flex-1"><!-- SLOT: consoleContent --></div>
</div>
