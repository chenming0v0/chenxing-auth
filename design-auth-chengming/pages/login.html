<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辰星通行证 · 统一登录</title>
    <style id="theme-vars">
@import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Exo+2:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap");

/* ============================================================
   chenxing-auth · 辰星认证中枢 — brand token & type system
   科幻未来风 + 磨砂玻璃 (glassmorphism) · 主色调：天蓝
   ============================================================ */

:root {
  /* surfaces */
  --chenxing-background: #04060d;
  --chenxing-foreground: #eaf4ff;
  --chenxing-card: rgba(125, 185, 255, 0.06);
  --chenxing-card-foreground: #eaf4ff;
  --chenxing-muted: rgba(255, 255, 255, 0.05);
  --chenxing-muted-foreground: #93a7c7;
  --chenxing-popover: rgba(12, 20, 36, 0.92);
  --chenxing-popover-foreground: #eaf4ff;

  /* single primary hue: sky blue */
  --chenxing-primary: #38bdf8;
  --chenxing-primary-foreground: #04121f;
  --chenxing-primary-soft: rgba(56, 189, 248, 0.16);
  --chenxing-ring: #38bdf8;

  /* informational ice-cyan (HUD telemetry accent) */
  --chenxing-cyan: #67e8f9;
  --chenxing-cyan-soft: rgba(103, 232, 249, 0.13);
  --chenxing-ice: #d9f4ff;

  /* semantic states */
  --chenxing-success: #34d399;
  --chenxing-warning: #fbbf24;
  --chenxing-error: #ff6b7a;
  --chenxing-error-soft: rgba(255, 107, 122, 0.14);
  --chenxing-info: #67e8f9;

  /* lines */
  --chenxing-border: rgba(147, 197, 253, 0.18);
  --chenxing-border-strong: rgba(147, 197, 253, 0.36);
  --chenxing-input: rgba(255, 255, 255, 0.08);

  /* radius — restrained 8/12/16px scale */
  --chenxing-radius-sm: 8px;
  --chenxing-radius-md: 12px;
  --chenxing-radius-lg: 16px;
  --chenxing-radius-xl: 16px;
  --chenxing-radius-full: 9999px;
  --chenxing-radius-pill: 9999px;

  /* shadows — static layers stay subtle; deep/glow layers use floating names */
  --chenxing-shadow-xs: 0 1px 2px rgba(255, 255, 255, 0.03);
  --chenxing-shadow-card: inset 0 1px 0 rgba(255, 255, 255, 0.05);
  --chenxing-shadow-float: 0 16px 48px rgba(1, 4, 12, 0.55);
  --chenxing-shadow-overlay: 0 24px 80px rgba(0, 2, 10, 0.65);
  --chenxing-shadow-glow-float: 0 0 24px rgba(56, 189, 248, 0.35), 0 0 64px rgba(56, 189, 248, 0.18);
  --chenxing-shadow-cyan-float: 0 0 20px rgba(103, 232, 249, 0.25);

  /* type */
  --chenxing-font-display: "Orbitron", "Noto Sans SC", system-ui, sans-serif;
  --chenxing-font-body: "Exo 2", "Noto Sans SC", system-ui, sans-serif;
  --chenxing-font-mono: "Share Tech Mono", "JetBrains Mono", ui-monospace, monospace;
}

/* ---------- canvas-safe page shell ---------- */
html {
  min-height: 100%;
  background: var(--chenxing-background);
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--chenxing-background);
  color: var(--chenxing-foreground);
}

main {
  position: relative;
  min-height: 100vh;
  overflow: hidden;
  background: var(--chenxing-background);
  isolation: isolate;
}

.chenxing-auth-layout {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.chenxing-auth-layout > aside {
  display: none;
}

.chenxing-auth-layout > section {
  min-width: 0;
  box-sizing: border-box;
}

@media (min-width: 1024px) {
  .chenxing-auth-layout {
    flex-direction: row;
  }

  .chenxing-auth-layout > aside {
    display: flex;
    width: 46%;
    flex-shrink: 0;
    flex-direction: column;
    justify-content: space-between;
    box-sizing: border-box;
  }

  .chenxing-auth-layout > section {
    display: flex;
    flex: 1;
    align-items: center;
    justify-content: center;
  }
}

/* ---------- typography ---------- */
.chenxing-display { font-family: var(--chenxing-font-display); letter-spacing: 0.03em; }
.chenxing-h1 { font-family: var(--chenxing-font-display); font-weight: 700; font-size: 2rem; line-height: 1.2; letter-spacing: 0.02em; color: var(--chenxing-foreground); }
.chenxing-h2 { font-family: var(--chenxing-font-display); font-weight: 600; font-size: 1.25rem; line-height: 1.3; letter-spacing: 0.02em; color: var(--chenxing-foreground); }
.chenxing-h3 { font-family: var(--chenxing-font-display); font-weight: 600; font-size: 1rem; letter-spacing: 0.02em; color: var(--chenxing-foreground); }
.chenxing-body { font-family: var(--chenxing-font-body); font-size: 0.9375rem; line-height: 1.65; color: var(--chenxing-foreground); }
.chenxing-caption { font-family: var(--chenxing-font-body); font-size: 0.8125rem; line-height: 1.5; color: var(--chenxing-muted-foreground); }
.chenxing-mono { font-family: var(--chenxing-font-mono); }

.text-aurora {
  background: linear-gradient(94deg, #e8f9ff 0%, #7dd3fc 34%, #38bdf8 62%, #67e8f9 84%, #eafdff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* ---------- glass panels ---------- */
.chenxing-glass {
  position: relative;
  background: linear-gradient(160deg, rgba(125, 185, 255, 0.10), rgba(255, 255, 255, 0.028) 55%, rgba(103, 232, 249, 0.05));
  backdrop-filter: blur(22px) saturate(1.5);
  -webkit-backdrop-filter: blur(22px) saturate(1.5);
  border: 1px solid var(--chenxing-border);
  border-radius: var(--chenxing-radius-lg);
  box-shadow: var(--chenxing-shadow-card), var(--chenxing-shadow-float);
}

.chenxing-glass-strong {
  position: relative;
  background: linear-gradient(165deg, rgba(18, 30, 52, 0.72), rgba(7, 11, 22, 0.66));
  backdrop-filter: blur(28px) saturate(1.6);
  -webkit-backdrop-filter: blur(28px) saturate(1.6);
  border: 1px solid rgba(147, 197, 253, 0.24);
  border-radius: var(--chenxing-radius-lg);
  box-shadow: var(--chenxing-shadow-card), var(--chenxing-shadow-float);
}

/* HUD corner brackets */
.chenxing-hud-frame { position: relative; }
.chenxing-hud-frame::before,
.chenxing-hud-frame::after {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  pointer-events: none;
  opacity: 0.9;
}
.chenxing-hud-frame::before {
  top: -1px; left: -1px;
  border-top: 1px solid var(--chenxing-cyan);
  border-left: 1px solid var(--chenxing-cyan);
  border-top-left-radius: var(--chenxing-radius-md);
}
.chenxing-hud-frame::after {
  bottom: -1px; right: -1px;
  border-bottom: 1px solid var(--chenxing-cyan);
  border-right: 1px solid var(--chenxing-cyan);
  border-bottom-right-radius: var(--chenxing-radius-md);
}

/* Shared two-corner HUD glass panel */
.chenxing-hud-panel {
  position: relative;
  padding: 2rem;
  background: linear-gradient(165deg, rgba(18, 30, 52, 0.72), rgba(7, 11, 22, 0.66));
  backdrop-filter: blur(28px) saturate(1.6);
  -webkit-backdrop-filter: blur(28px) saturate(1.6);
  border: 1px solid rgba(147, 197, 253, 0.24);
  border-radius: var(--chenxing-radius-lg);
  box-shadow: var(--chenxing-shadow-card), var(--chenxing-shadow-float);
}
.chenxing-hud-panel::before,
.chenxing-hud-panel::after {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  pointer-events: none;
  opacity: 0.9;
}
.chenxing-hud-panel::before {
  top: -1px; left: -1px;
  border-top: 1px solid var(--chenxing-cyan);
  border-left: 1px solid var(--chenxing-cyan);
  border-top-left-radius: var(--chenxing-radius-md);
}
.chenxing-hud-panel::after {
  bottom: -1px; right: -1px;
  border-bottom: 1px solid var(--chenxing-cyan);
  border-right: 1px solid var(--chenxing-cyan);
  border-bottom-right-radius: var(--chenxing-radius-md);
}

/* scanning beam */
.chenxing-beam {
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--chenxing-cyan), transparent);
  opacity: 0;
  animation: chenxing-scan 7s linear infinite;
}

/* ---------- buttons ---------- */
.chenxing-btn-primary {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  font-family: var(--chenxing-font-body);
  font-weight: 600;
  font-size: 0.9375rem;
  color: var(--chenxing-primary-foreground);
  background: linear-gradient(120deg, #36b0fa, #1d8ff0 52%, #58d2ff);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: var(--chenxing-radius-md);
  box-shadow: var(--chenxing-shadow-glow-float), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s, filter 0.25s;
  cursor: pointer;
}
.chenxing-btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 0 34px rgba(56, 189, 248, 0.55), 0 0 80px rgba(56, 189, 248, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
.chenxing-btn-primary:active { transform: translateY(0) scale(0.985); }
.chenxing-btn-primary:disabled { opacity: 0.55; cursor: not-allowed; filter: saturate(0.6); }

.chenxing-btn-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  font-family: var(--chenxing-font-body);
  font-weight: 500;
  font-size: 0.875rem;
  color: var(--chenxing-foreground);
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--chenxing-border);
  border-radius: var(--chenxing-radius-md);
  transition: background 0.2s, border-color 0.2s, transform 0.15s;
  cursor: pointer;
}
.chenxing-btn-ghost:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--chenxing-border-strong); }
.chenxing-btn-ghost:active { transform: scale(0.985); }

.chenxing-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  color: var(--chenxing-muted-foreground);
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--chenxing-border);
  border-radius: var(--chenxing-radius-md);
  transition: color 0.2s, background 0.2s, border-color 0.2s;
  cursor: pointer;
}
.chenxing-icon-btn:hover { color: var(--chenxing-foreground); background: rgba(255, 255, 255, 0.08); }

/* ---------- form fields ---------- */
.chenxing-field {
  width: 100%;
  font-family: var(--chenxing-font-body);
  font-size: 0.9375rem;
  color: var(--chenxing-foreground);
  background: rgba(4, 8, 16, 0.6);
  border: 1px solid var(--chenxing-input);
  border-radius: var(--chenxing-radius-md);
  padding: 0.8rem 1rem;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.chenxing-field::placeholder { color: rgba(147, 167, 199, 0.55); }
.chenxing-field:focus {
  outline: none;
  border-color: var(--chenxing-primary);
  box-shadow: 0 0 0 3px var(--chenxing-primary-soft), 0 0 18px rgba(56, 189, 248, 0.18);
}
.chenxing-field.chenxing-field-error { border-color: var(--chenxing-error); box-shadow: 0 0 0 3px var(--chenxing-error-soft); }

.chenxing-label {
  display: block;
  font-family: var(--chenxing-font-mono);
  font-size: 0.6875rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--chenxing-muted-foreground);
  margin-bottom: 0.5rem;
}

/* ---------- chips / badges / links / dividers ---------- */
.chenxing-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-family: var(--chenxing-font-mono);
  font-size: 0.6875rem;
  letter-spacing: 0.08em;
  color: var(--chenxing-cyan);
  background: var(--chenxing-cyan-soft);
  border: 1px solid rgba(103, 232, 249, 0.24);
  border-radius: var(--chenxing-radius-pill);
  padding: 0.3rem 0.7rem;
}
.chenxing-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-family: var(--chenxing-font-mono);
  font-size: 0.6875rem;
  letter-spacing: 0.06em;
  color: var(--chenxing-muted-foreground);
  background: var(--chenxing-muted);
  border: 1px solid var(--chenxing-border);
  border-radius: var(--chenxing-radius-pill);
  padding: 0.28rem 0.65rem;
}
.chenxing-badge-success { color: var(--chenxing-success); border-color: rgba(52, 211, 153, 0.32); background: rgba(52, 211, 153, 0.08); }
.chenxing-badge-warning { color: var(--chenxing-warning); border-color: rgba(251, 191, 36, 0.32); background: rgba(251, 191, 36, 0.08); }

.chenxing-link {
  font-family: var(--chenxing-font-body);
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--chenxing-cyan);
  transition: color 0.2s;
  cursor: pointer;
}
.chenxing-link:hover { color: #bff3ff; }

.chenxing-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--chenxing-border-strong), transparent);
}

/* ---------- background layers ---------- */
.chenxing-nebula {
  position: absolute;
  border-radius: 9999px;
  filter: blur(110px);
  pointer-events: none;
}
.chenxing-grid {
  background-image:
    linear-gradient(rgba(125, 211, 252, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(125, 211, 252, 0.05) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 35%, black 25%, transparent 78%);
  mask-image: radial-gradient(ellipse 90% 70% at 50% 35%, black 25%, transparent 78%);
}
.chenxing-vignette {
  background: radial-gradient(ellipse 120% 90% at 50% 0%, transparent 55%, rgba(1, 3, 8, 0.6) 100%);
}

/* pulsing beacon dot */
.chenxing-dot { position: relative; display: inline-flex; }
.chenxing-dot::after {
  content: "";
  position: absolute;
  inset: -4px;
  border-radius: 9999px;
  background: currentColor;
  opacity: 0.35;
  animation: chenxing-ping 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
}

/* ---------- keyframes ---------- */
@keyframes chenxing-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes chenxing-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
@keyframes chenxing-ping { 0% { transform: scale(1); opacity: 0.4; } 80%, 100% { transform: scale(2.2); opacity: 0; } }
@keyframes chenxing-spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes chenxing-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes chenxing-scan { 0%, 12% { top: 6%; opacity: 0; } 18% { opacity: 0.9; } 82% { opacity: 0.9; } 88%, 100% { top: 94%; opacity: 0; } }
@keyframes chenxing-shoot {
  0% { transform: translate(0, 0) rotate(215deg); opacity: 0; }
  6% { opacity: 1; }
  22% { transform: translate(-46vw, 30vh) rotate(215deg); opacity: 0; }
  100% { transform: translate(-46vw, 30vh) rotate(215deg); opacity: 0; }
}

/* subtle scrollbar */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: #04060d; }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #1e4b8a, #0f2b52); border-radius: 99px; border: 2px solid #04060d; }
::-webkit-scrollbar-thumb:hover { background: #2a6bb8; }
::selection { background: rgba(56, 189, 248, 0.4); color: #fff; }

<body class="min-h-screen font-sans antialiased">
    <main class="chenxing-auth-layout">
      <!-- deep space layers -->
      <div class="chenxing-nebula left-[-16%] top-[-14%] h-[580px] w-[580px] bg-[var(--chenxing-primary)] opacity-25"></div>
      <div class="chenxing-nebula right-[-12%] bottom-[-18%] h-[540px] w-[540px] bg-[var(--chenxing-cyan)] opacity-15"></div>
      <canvas id="starfield" class="absolute inset-0 h-full w-full opacity-70"></canvas>
      <div class="chenxing-grid absolute inset-0"></div>
      <div class="chenxing-vignette absolute inset-0"></div>

      <!-- left brand / HUD panel -->
      <aside class="relative z-10 hidden w-[46%] flex-col justify-between border-r border-[var(--chenxing-border)] p-12 lg:flex">
        <div>
          <a href="landing.html" class="flex items-center gap-3" data-dom-id="dom-login-home">
            <span class="relative flex h-11 w-11 items-center justify-center">
              <span class="absolute inset-0 animate-[chenxing-spin-slow_18s_linear_infinite] rounded-full border border-dashed border-[var(--chenxing-border-strong)]"></span>
              <span class="absolute inset-[7px] rounded-full border border-[var(--chenxing-cyan)] opacity-70"></span>
              <i data-lucide="sparkles" class="h-4 w-4 text-[var(--chenxing-cyan)]"></i>
            </span>
            <span>
              <span class="chenxing-h3 block">辰星认证中枢</span>
              <span class="chenxing-mono text-[10px] uppercase tracking-[0.22em] text-[var(--chenxing-muted-foreground)]">Chenxing Passport</span>
            </span>
          </a>

          <div class="chenxing-hud-frame chenxing-glass-strong mt-14 max-w-md p-6">
            <span class="chenxing-beam"></span>
            <p class="chenxing-mono text-[10px] uppercase tracking-[0.3em] text-[var(--chenxing-cyan)]">// Gateway 01 · Unified Identity</p>
            <h1 class="chenxing-h1 mt-4 leading-snug">一次认证，<br><span class="text-aurora">抵达所有星辰</span></h1>
            <p class="chenxing-caption mt-4">一套通行证，通行于天穹辰星生态中的所有服务。OAuth 2.0 / OIDC 认证中枢，为每一段旅程签发专属信标。</p>
          </div>
        </div>

      </aside>

      <!-- right auth card -->
      <section class="relative z-10 flex flex-1 items-center justify-center px-6 py-14 lg:px-12">
        <div class="w-full max-w-md">
          <div class="mb-8 flex items-center gap-3 lg:hidden">
            <span class="relative flex h-10 w-10 items-center justify-center">
              <span class="absolute inset-0 animate-[chenxing-spin-slow_18s_linear_infinite] rounded-full border border-dashed border-[var(--chenxing-border-strong)]"></span>
              <i data-lucide="sparkles" class="h-4 w-4 text-[var(--chenxing-cyan)]"></i>
            </span>
            <span class="chenxing-h3">辰星认证中枢</span>
          </div>

          <div class="chenxing-hud-panel">
            <div class="flex items-center justify-between">
              <div>
                <h2 class="chenxing-h2">统一登录</h2>
                <p class="chenxing-caption mt-1">使用辰星通行证身份进入服务</p>
              </div>
            </div>

            <div class="mt-6 flex gap-1 rounded-[var(--chenxing-radius-md)] bg-[var(--chenxing-muted)] p-1">
              <button type="button" data-auth-tab="account" class="flex-1 rounded-[var(--chenxing-radius-sm)] bg-[var(--chenxing-card)] px-4 py-2 text-sm font-medium text-[var(--chenxing-foreground)] shadow-[var(--chenxing-shadow-xs)]">账号登录</button>
              <button type="button" data-auth-tab="auth" class="flex-1 rounded-[var(--chenxing-radius-sm)] px-4 py-2 text-sm text-[var(--chenxing-muted-foreground)]">Auth 登录</button>
            </div>

            <div data-auth-panel="account">
            <div class="mt-5 flex items-start gap-3 rounded-[var(--chenxing-radius-md)] border border-[rgba(255,107,122,0.35)] bg-[rgba(255,107,122,0.08)] px-4 py-3">
              <i data-lucide="alert-triangle" class="mt-0.5 h-4 w-4 shrink-0 text-[var(--chenxing-error)]"></i>
              <p class="chenxing-caption text-[var(--chenxing-foreground)]">凭证校验失败 · 请检查邮箱与密码后再试</p>
            </div>

            <form class="mt-5 space-y-4" novalidate>
              <div>
                <label for="login-email" class="chenxing-label">邮箱</label>
                <div class="chenxing-field-shell chenxing-field-error">
                  <i data-lucide="mail" class="chenxing-field-icon h-4 w-4"></i>
                  <input id="login-email" type="email" placeholder="you@chenxing.star" value="ops@chenxing.star" />
                </div>
              </div>
              <div>
                <label for="login-password" class="chenxing-label">密码</label>
                <div class="chenxing-field-shell">
                  <i data-lucide="lock-keyhole" class="chenxing-field-icon h-4 w-4"></i>
                  <input id="login-password" type="password" placeholder="输入通行凭证" value="starport-2026" />
                  <button type="button" class="chenxing-icon-btn" aria-label="显示密码">
                    <i data-lucide="eye" class="h-4 w-4"></i>
                  </button>
                </div>
              </div>

              <div class="flex items-center justify-between">
                <label class="flex cursor-pointer items-center gap-2 text-sm text-[var(--chenxing-muted-foreground)]">
                  <input type="checkbox" checked class="h-4 w-4 rounded accent-[var(--chenxing-primary)]" />
                  在此设备保持登录
                </label>
                <a class="chenxing-link" href="#">忘记密码？</a>
              </div>

              <button type="submit" class="chenxing-btn-primary w-full py-3" data-dom-id="dom-login-submit">
                登录 · 进入星门
                <i data-lucide="arrow-right" class="h-4 w-4"></i>
              </button>
            </form>
            </div>

            <div data-auth-panel="auth" hidden>
              <div class="mt-5 grid grid-cols-2 gap-3">
                <button type="button" class="chenxing-btn-ghost py-2.5">
                  <i data-lucide="github" class="h-4 w-4"></i>
                  GitHub
                </button>
                <button type="button" class="chenxing-btn-ghost py-2.5">
                  <i data-lucide="chrome" class="h-4 w-4"></i>
                  Google
                </button>
              </div>
            </div>


            <p class="chenxing-caption mt-6 text-center">
              还没有通行证？
              <a href="register.html" class="chenxing-link font-medium" data-dom-id="dom-login-register">创建辰星通行证</a>
            </p>
          </div>

          <p class="chenxing-mono mt-6 text-center text-[10px] uppercase tracking-[0.24em] text-[var(--chenxing-muted-foreground)]">Encrypted Gateway · 天穹辰星</p>
        </div>
      </section>
    </main>
    <script>
      (function () {
        var c = document.getElementById("starfield"); if (!c) return;
        var x = c.getContext("2d"); var w, h, stars = [], t = 0;
        function rs() {
          w = c.width = c.offsetWidth * devicePixelRatio; h = c.height = c.offsetHeight * devicePixelRatio;
          stars = []; var n = Math.floor(w * h / 8500);
          for (var i = 0; i < n; i++) stars.push({ x: Math.random() * w, y: Math.random() * h, z: Math.random(), r: Math.random() * 1.3 + 0.3, tw: Math.random() * 6.28, sp: Math.random() * 0.05 + 0.008 });
        }
        rs(); window.addEventListener("resize", rs);
        function draw() {
          t += 0.016; x.clearRect(0, 0, w, h);
          for (var i = 0; i < stars.length; i++) {
            var s = stars[i]; s.y -= s.sp * (0.4 + s.z) * devicePixelRatio;
            if (s.y < -4) { s.y = h + 4; s.x = Math.random() * w; }
            var a = 0.25 + 0.75 * Math.abs(Math.sin(t * (0.5 + s.z) + s.tw));
            var hue = s.z > 0.7 ? "178,230,255" : s.z > 0.35 ? "196,220,253" : "255,255,255";
            x.beginPath(); x.arc(s.x, s.y, s.r * devicePixelRatio, 0, 6.283);
            x.fillStyle = "rgba(" + hue + "," + (a * (0.3 + s.z * 0.7)) + ")"; x.fill();
          }
          requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
      })();
    </script>
    <script>
      (function () {
        var tabs = document.querySelectorAll("[data-auth-tab]");
        var panels = document.querySelectorAll("[data-auth-panel]");
        function setActive(name) {
          tabs.forEach(function (tab) {
            var active = tab.getAttribute("data-auth-tab") === name;
            tab.classList.toggle("bg-[var(--chenxing-card)]", active);
            tab.classList.toggle("text-[var(--chenxing-foreground)]", active);
            tab.classList.toggle("font-medium", active);
            tab.classList.toggle("shadow-[var(--chenxing-shadow-xs)]", active);
          });
          panels.forEach(function (panel) {
            panel.hidden = panel.getAttribute("data-auth-panel") !== name;
          });
        }
        tabs.forEach(function (tab) {
          tab.addEventListener("click", function () {
            setActive(tab.getAttribute("data-auth-tab"));
          });
        });
      })();
    </script>

    <script>lucide.createIcons();</script>
</body>
</html>
